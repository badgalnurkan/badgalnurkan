name: Account consistency
on:
  pull_request:
    paths:
      - 'index.html'
      - 'package.json'
      - 'tests/**'
      - '.github/workflows/account-consistency.yml'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'package.json'
      - 'tests/**'
      - '.github/workflows/account-consistency.yml'

permissions:
  contents: read

jobs:
  node-regression-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run automated regression tests
        run: npm test
