name: Cross-device sync safety
on:
  pull_request:
    paths:
      - 'index.html'
      - 'cross-device-sync.js'
      - 'browser-verification.js'
      - 'email-change-otp.js'
      - 'tests/email-change-otp.test.cjs'
      - 'supabase/functions/browser-verification/**'
      - 'supabase/rollouts/browser-session-verification-staging.sql'
      - 'supabase/qa/browser-session-verification-assertions-qa-only.sql'
      - 'tests/cross-device-sync.test.cjs'
      - 'tests/qa-preview-network.cjs'
      - 'supabase/qa/account-lifecycle-push-assertions.sql'
      - 'package.json'
      - '.github/workflows/cross-device-sync.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check sync JavaScript syntax
        run: node --check cross-device-sync.js
      - name: Check browser OTP code and Edge handler syntax
        run: |
          node --check browser-verification.js
          node --check email-change-otp.js
          node --check supabase/functions/browser-verification/handler.mjs
      - name: Check inline application JavaScript syntax
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          const html=fs.readFileSync('index.html','utf8');
          const source=html.match(/<script>([\s\S]*?)<\/script>/)?.[1];
          if(!source || !source.includes('syncStart'))process.exit(1);
          new Function(source);
          NODE
      - name: Verify conflict, retry and three-account tests
        run: node --test tests/cross-device-sync.test.cjs
      - name: Verify new-browser email OTP safety tests
        run: node --test tests/browser-verification.test.cjs
      - name: Run all existing regression tests
        run: npm test

  qa-network:
    name: QA browser with live QA services
    if: github.head_ref == 'qa/browser-otp-e2e-20261120' || github.ref_name == 'qa/browser-otp-e2e-20261120'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --init
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --ignore-scripts --package-lock=false playwright@1.56.1
      - name: Render the released app and contact the QA Auth and Web Push endpoints
        env:
          IYD_QA_PACKAGE_MODE: '1'
        run: node tests/qa-preview-network.cjs
