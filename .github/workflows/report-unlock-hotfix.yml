name: Report period unlock regression
on:
  pull_request:
    paths:
      - 'index.html'
      - 'package.json'
      - 'account-security.*'
      - 'cookies.html'
      - 'supabase/**'
      - 'tests/account-security*'
      - 'tests/report-unlock.test.cjs'
      - 'tests/**'
      - '.github/workflows/report-unlock-hotfix.yml'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'package.json'
      - 'account-security.*'
      - 'cookies.html'
      - 'supabase/**'
      - 'tests/account-security*'
      - 'tests/report-unlock.test.cjs'
      - 'tests/**'
      - '.github/workflows/report-unlock-hotfix.yml'

permissions:
  contents: read

jobs:
  reports:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirm script syntax
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          const source=fs.readFileSync('index.html','utf8')
            .match(/<script>([\s\S]*?)<\/script>/)?.[1];
          if(!source)throw Error('Cannot find HTML application script');
          new Function(source);
          if(source.includes('iydu_save_cas'))throw Error('Unfinished auth sync accidentally included in hotfix');
          console.log('PASS: index.html script syntax and isolated report patch');
          NODE
      - name: Test existing site and weekly/monthly unlocks
        run: npm test
      - name: Build isolated static preview
        run: python scripts/build-preview.py
      - name: Inspect deployed account mail readiness without sending messages
        run: |
          node - <<'NODE'
          (async()=>{
            const url='https://flcfqwndqfmbritaywfb.supabase.co/functions/v1/account-security';
            const r=await fetch(url); const d=await r.json();
            console.log('Account security health:',JSON.stringify(d));
            const fs=require('node:fs'),html=fs.readFileSync('index.html','utf8');
            const key=html.match(/const SUPABASE_KEY='([^']+)'/)[1];
            const settings=await fetch('https://flcfqwndqfmbritaywfb.supabase.co/auth/v1/settings',{headers:{apikey:key}});
            if(!settings.ok)throw Error('Auth settings unreachable');
            const a=await settings.json();
            console.log('Public Auth settings:',JSON.stringify({emailAutoconfirm:a.mailer_autoconfirm,emailEnabled:a.external?.email,googleEnabled:a.external?.google}));
            if(!r.ok||!d.ok)throw Error('Account backend not reachable');
          })().catch(e=>{console.error(e);process.exitCode=1});
          NODE
      - name: Install browsers for mobile date regression
        run: |
          npm install --no-save --ignore-scripts --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium webkit
      - name: Check project date widths in Chromium and WebKit
        run: node tests/account-security.browser.cjs
      - name: Verify the published custom domain
        if: github.event_name == 'push'
        run: |
          node - <<'NODE'
          (async()=>{
            const expected="2026-11-17-account-security-domain";
            for(let attempt=0;attempt<6;attempt++){
              const r=await fetch('https://badgalnurkan.com/?release-check='+Date.now(),{cache:'no-store',signal:AbortSignal.timeout(15000)});
              const html=await r.text();
              if(r.ok&&html.includes(expected)){
                for(const path of ['account-security.js','account-security.css','cookies.html']){
                  const asset=await fetch('https://badgalnurkan.com/'+path,{signal:AbortSignal.timeout(15000)});
                  if(!asset.ok)throw Error('Missing production asset '+path);
                }
                console.log('PASS: badgalnurkan.com serves the released application and all security/cookie assets');return;
              }
              await new Promise(resolve=>setTimeout(resolve,10000));
            }
            throw Error('Custom domain did not serve the expected release');
          })().catch(e=>{console.error(e);process.exitCode=1});
          NODE
