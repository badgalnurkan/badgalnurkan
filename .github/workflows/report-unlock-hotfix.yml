name: Report period unlock regression
on:
  pull_request:
    paths:
      - 'index.html'
      - 'package.json'
      - 'account-security.*'
      - 'cookies.html'
      - 'supabase/**'
      - 'tests/account-security*'
      - 'tests/report-unlock.test.cjs'
      - 'tests/**'
      - '.github/workflows/report-unlock-hotfix.yml'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'package.json'
      - 'account-security.*'
      - 'cookies.html'
      - 'supabase/**'
      - 'tests/account-security*'
      - 'tests/report-unlock.test.cjs'
      - 'tests/**'
      - '.github/workflows/report-unlock-hotfix.yml'

permissions:
  contents: read

jobs:
  reports:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirm script syntax
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          const source=fs.readFileSync('index.html','utf8')
            .match(/<script>([\s\S]*?)<\/script>/)?.[1];
          if(!source)throw Error('Cannot find HTML application script');
          new Function(source);
          if(source.includes('iydu_save_cas'))throw Error('Unfinished auth sync accidentally included in hotfix');
          console.log('PASS: index.html script syntax and isolated report patch');
          NODE
      - name: Test existing site and weekly/monthly unlocks
        run: npm test
      - name: Build isolated static preview
        run: python scripts/build-preview.py
      - name: Inspect deployed account mail readiness without sending messages
        run: |
          node - <<'NODE'
          (async()=>{
            const url='https://flcfqwndqfmbritaywfb.supabase.co/functions/v1/account-security';
            const r=await fetch(url); const d=await r.json();
            console.log('Account security health:',JSON.stringify(d));
            const fs=require('node:fs'),html=fs.readFileSync('index.html','utf8');
            const key=html.match(/const SUPABASE_KEY='([^']+)'/)[1];
            const settings=await fetch('https://flcfqwndqfmbritaywfb.supabase.co/auth/v1/settings',{headers:{apikey:key}});
            if(!settings.ok)throw Error('Auth settings unreachable');
            const a=await settings.json();
            console.log('Public Auth settings:',JSON.stringify({emailAutoconfirm:a.mailer_autoconfirm,emailEnabled:a.external?.email,googleEnabled:a.external?.google}));
            if(!r.ok||!d.ok)throw Error('Account backend not reachable');
          })().catch(e=>{console.error(e);process.exitCode=1});
          NODE
  production-smoke:
    name: Verify deployed production files
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify custom domain serves the exact tested source files
        run: |
          node - <<'NODE'
          const fs=require('node:fs'),crypto=require('node:crypto');
          const digest=buffer=>crypto.createHash('sha256').update(buffer).digest('hex');
          const files=[['index.html','/'],['account-security.js','/account-security.js'],['account-security.css','/account-security.css'],['cookies.html','/cookies.html']];
          const expected=files.map(([filename,path])=>({filename,path,hash:digest(fs.readFileSync(filename))}));
          const base='https://badgalnurkan.com';
          const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));
          (async()=>{
            for(let attempt=1;attempt<=12;attempt++){
              const failures=[];
              for(const {filename,path,hash} of expected){
                try{
                  const url=new URL(path,base);
                  url.searchParams.set('release_check',String(Date.now()));
                  const response=await fetch(url,{cache:'no-store',redirect:'follow',headers:{'cache-control':'no-cache'},signal:AbortSignal.timeout(15000)});
                  if(!response.ok)throw Error('HTTP '+response.status);
                  const found=digest(Buffer.from(await response.arrayBuffer()));
                  if(found!==hash)throw Error('SHA-256 differs from main commit');
                }catch(error){
                  failures.push(filename+': '+error.message);
                }
              }
              if(failures.length===0){
                console.log('PASS: '+base+' serves exact index.html and security/cookie assets from commit '+process.env.GITHUB_SHA);
                return;
              }
              console.log('Production not yet matched ('+attempt+'/12): '+failures.join('; '));
              if(attempt<12)await sleep(15000);
            }
            throw Error('Production does not serve the expected source files for '+process.env.GITHUB_SHA);
          })().catch(error=>{console.error(error);process.exitCode=1});
          NODE

  browser-e2e:
    name: Chromium and WebKit UI
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned browser driver (browsers already in image)
        run: npm install --no-save --ignore-scripts --package-lock=false playwright@1.56.1
      - name: Build isolated test site
        run: python3 scripts/build-preview.py
      - name: Check mobile and account UI in Chromium and WebKit
        run: node tests/account-security.browser.cjs
