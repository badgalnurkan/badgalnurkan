name: Cloudflare QA isolation
on:
  push:
    branches: [qa-cloudflare]
  pull_request:
    branches: [qa-cloudflare]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qa-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout QA branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify no production Supabase endpoints are shipped
        run: node --test tests/qa-isolation.test.cjs
      - name: Check standalone account-close JavaScript syntax
        run: node --check account-close.js
      - name: Run existing application regression suite
        run: npm test
      - name: Run QA concurrency and browser-boundary tests
        run: node --test tests/qa-sync-safety.test.cjs
      - name: Run isolated concurrent-user protocol simulations
        run: node --test tests/qa-concurrency-model.test.cjs
      - name: Test QA browser verification origins
        run: node --test tests/qa-browser-verification-origin.test.cjs
      - name: Verify QA CAS database contract
        run: node --test tests/qa-cas-db-contract.test.cjs
      - name: Verify safe local preview
        run: npm run test:local
