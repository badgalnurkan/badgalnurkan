name: Cloudflare QA isolation
on:
  push:
    branches: [qa-cloudflare]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qa-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout QA branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify no production Supabase endpoints are shipped
        run: node --test tests/qa-isolation.test.cjs
      - name: Check standalone account-close JavaScript syntax
        run: node --check account-close.js
