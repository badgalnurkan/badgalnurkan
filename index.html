<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Improvin' your day</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6eee3">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Fraunces:wght@500;600;700&family=Homemade+Apple&family=Libre+Baskerville:wght@400;700&family=Patrick+Hand&family=Nunito:wght@400;600;700&family=UnifrakturCook:wght@700&display=swap">
<style>
:root{--bg:#FFFAFA;--card:#ffffff;--ink:#542A0C;--mut:#835C3B;--acc:#800000;--acc2:#FDD7E4;--ok:#387C44;--no:#C71585;--ln:#ebd8d4;--sh:0 12px 32px #542A0C13;--on-acc:#fff;--okbg:#eaf4ed;--fs:'Fraunces',Georgia,'Times New Roman',serif;--okbg:#e6f1e6}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;scroll-padding-top:env(safe-area-inset-top,0px);font-size:clamp(16px,.35vw + 11px,24px);overflow-y:scroll}
@media(min-width:1600px){html{font-size:clamp(15.5px,.45vw + 11px,16px)}}
/* mobil: okunakli taban olcu */
@media(max-width:600px){html{font-size:clamp(16px,4.4vw,17.5px)}}
@media(max-width:360px){html{font-size:16px}}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Nunito',system-ui,-apple-system,'Segoe UI',Roboto,Ubuntu,sans-serif;line-height:1.6;transition:background .4s,color .4s;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
#app{display:flex;flex-direction:column;flex:1;width:100%;transition:opacity .22s ease}
#app.soft-out{opacity:0}
button,input,select,textarea{font:inherit;color:inherit}
button{background:var(--acc);color:var(--on-acc,#fff);border:0;border-radius:999px;padding:.6em 1.4em;min-height:2.75rem;font-weight:600;cursor:pointer;box-shadow:0 4px 14px #a9714b33;transition:transform .2s,box-shadow .2s,background .3s;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button:hover{transform:translateY(-1px);box-shadow:0 6px 18px #a9714b44}
button.g{background:transparent;border:1.5px solid var(--ln);color:var(--ink);box-shadow:none}
button.g:hover{border-color:var(--acc)}
button.s{min-height:2.2rem;padding:.25em .9em;font-size:.82rem}
button.d{color:var(--no);border-color:var(--no)}
button:disabled{opacity:.35;cursor:not-allowed;transform:none}
input,select,textarea{background:var(--bg);border:1.5px solid var(--ln);border-radius:16px;padding:.7em 1.1em;width:100%;margin:.3em 0 .8em;font-size:max(16px,1rem);transition:border .3s}
textarea{resize:vertical}
input:focus,textarea:focus{outline:0;border-color:var(--acc)}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
label{font-size:.9rem;font-weight:600}
.shell{display:flex;flex:1;max-width:80rem;margin:0 auto;width:100%;align-items:flex-start;padding:0 1rem;gap:1.2rem}
aside{width:16rem;background:var(--card);margin:1.2rem 0;border-radius:24px;box-shadow:var(--sh);padding:1.4rem 1rem;display:flex;flex-direction:column;gap:.3rem;transition:background .4s;flex-shrink:0;position:sticky;top:1rem}
aside .lg{font-family:var(--fs);font-weight:700;font-size:1.4rem;line-height:1.2;color:var(--acc);margin-bottom:1rem;word-break:break-word;cursor:pointer;padding:0 .5rem}
aside .lg small{display:block;font-family:'Nunito',system-ui,sans-serif;font-size:.8rem;font-weight:600;color:var(--mut);margin-bottom:.2rem}
aside a{padding:.7em 1rem;border-radius:999px;cursor:pointer;color:var(--mut);font-weight:600;font-size:.95rem;transition:all .25s;-webkit-tap-highlight-color:transparent}
aside a:hover{background:var(--bg);color:var(--ink)}
aside a.on{background:var(--acc);color:var(--on-acc,#fff);box-shadow:0 4px 14px #a9714b33}
aside a.press{transform:scale(.96);background:color-mix(in srgb,var(--acc) 22%,transparent)}
aside a{transition:background .22s ease,color .22s ease,transform .16s ease}
aside a.on{font-weight:800;letter-spacing:.005em}
@supports not (background:color-mix(in srgb,red,blue)){aside a.press{background:var(--bg)}}
main{transition:opacity .18s ease}
main.swap{opacity:0}
main.an{animation:pgIn .32s cubic-bezier(.2,.7,.2,1) both}
@keyframes pgIn{from{opacity:0;transform:translate3d(0,var(--pg-dy,8px),0)}to{opacity:1;transform:none}}
@media(max-aspect-ratio:3/4){main{--pg-dy:10px}}
@media(min-aspect-ratio:16/10){main{--pg-dy:6px}}
@media(prefers-reduced-motion:reduce){main.an{animation:none}}
aside a{transition:background .22s ease,color .22s ease,transform .16s ease,box-shadow .22s ease}
main{flex:1;min-width:0;padding:1.2rem 0;max-width:54rem;margin:0 auto;width:100%;animation:fi .3s ease;display:flex;flex-direction:column;gap:1.2rem}
@keyframes fi{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
header.top{display:flex;justify-content:space-between;align-items:center;gap:.6rem;padding:.9rem 1.5rem;background:var(--card);border-bottom:1px solid var(--ln);color:var(--mut);font-size:.95rem;transition:all .4s;position:relative}
header.top b{font-family:var(--fs);font-size:1.15rem;color:var(--acc);cursor:pointer}
.lv2 header.top,.lv3 header.top,.lv4 header.top{background:linear-gradient(90deg,var(--card),var(--bg));border-bottom:2px solid var(--acc)}
.lv3 .card,.lv4 .card{box-shadow:0 14px 40px #8a5a3a2a}
.lv4 aside .lg{letter-spacing:.06em}
.card{background:var(--card);border:1px solid var(--ln);border-radius:24px;box-shadow:var(--sh);padding:1.5rem;transition:all .3s}
h1,h2,h3{font-family:var(--fs);font-weight:600;margin:.2em 0 .5em}
h1,h2{font-size:1.3rem}h3{font-size:1.05rem}
.mut{color:var(--mut)}
.row{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center}
.row>input{flex:1;min-width:8rem;margin:0}
.center{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:clamp(1rem,3vw,1.5rem);width:100%}
.welcome-screen{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;justify-content:space-between;padding:1.5rem;position:relative}
/* ust satir: marka solda, tema sagda — mobilde ust uste binmez */
.welcome-top{display:flex;align-items:center;justify-content:space-between;gap:.6rem;flex-wrap:wrap}
.welcome-top .themebar{margin:0!important;justify-content:flex-end!important}
@media(max-width:600px){
  .welcome-screen{padding:1rem}
  .welcome-top{gap:.35rem}
  .welcome-top .brand-badge{font-size:1.05rem}
  .welcome-top .themebar button{padding:.3em .7em;font-size:.72rem;min-height:2rem}
  .welcome-top .themebar small{display:none}
}
@media(max-width:360px){.welcome-top .themebar button{padding:.28em .55em;font-size:.68rem}}
.brand-badge{font-family:var(--fs);font-weight:700;font-size:1.2rem;color:var(--acc);letter-spacing:.05em}
.welcome-center{display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;margin:auto;max-width:30rem;width:100%;padding:1rem 0}
.welcome-footer-bar{display:flex;justify-content:space-between;align-items:flex-end;width:100%;font-size:.85rem;color:var(--mut);gap:1rem}
.social-links{display:flex;flex-direction:column;text-align:right;gap:.2rem}
.social-links a{color:var(--mut);text-decoration:none;transition:color .2s}
.social-links a:hover{color:var(--acc)}
.box{max-width:26rem;width:100%;text-align:left}
/* giris/kayit kutusu: dengeli en-boy orani (ekrani kaplamaz, kucuk de kalmaz) */
.login-wrap{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:1.2rem;gap:.4rem}
.login-wrap>.langbar,.login-wrap>.themebar{max-width:26rem;margin:0 auto}
.login-wrap .box{max-width:clamp(20rem,34vw,27rem)}
/* ust serit: solda tema, sagda dil; ikisi ayni hizada ve kutu kenarlarina simetrik */
.login-top{width:100%;max-width:clamp(20rem,34vw,27rem);margin:.2rem auto .7rem;display:flex;align-items:center;justify-content:space-between;gap:.6rem}
.login-top .themebar{display:flex;flex-wrap:nowrap;align-items:center;gap:.3rem!important;margin:0!important;justify-content:flex-start!important;width:auto}
.login-top .themebar>small{margin:0 .15rem 0 0!important}
.login-top .themebar button,.login-top .langbar button{min-height:2.1rem;padding:.3em .8em;font-size:.8rem;line-height:1}
.login-top .langbar{display:flex;flex-wrap:nowrap;gap:.3rem;width:auto;margin:0;justify-content:flex-end}
.login-top .langbar button{min-width:2.6rem;padding:.3em .65em}
@media(min-width:901px) and (min-aspect-ratio:1/1){.login-top{max-width:clamp(21rem,26vw,26rem)}}
@media(min-width:601px) and (max-width:1024px){.login-top,.login-wrap .box{max-width:min(26rem,86vw)}}
@media(max-width:600px){.login-top{max-width:100%;margin:.1rem auto .6rem}}
@media(max-width:380px){
  .login-top{gap:.35rem}
  .login-top .themebar>small{display:none}
  .login-top .themebar button,.login-top .langbar button{padding:.28em .6em;font-size:.74rem;min-height:2rem}
  .login-top .langbar button{min-width:2.3rem}
}
@media(max-height:500px) and (orientation:landscape){.login-top{max-width:min(26rem,90vw);margin:.1rem auto .4rem}.login-wrap{padding-top:.5rem}}
@media(min-width:901px) and (min-aspect-ratio:1/1){
  .login-wrap .box{max-width:clamp(21rem,26vw,26rem)}
  .login-wrap .box input{font-size:.98rem;padding:.62em 1em;margin:.25em 0 .7em}
  .login-wrap .box h2{font-size:1.2rem;margin-bottom:.6rem}
}
@media(max-height:640px){.login-wrap{justify-content:flex-start;padding-top:.6rem}}
/* simetri: ust serit ile giris kutusu ayni genislik ve ayni kenar (en-boy oranina gore) */
.login-wrap{--lw:clamp(20rem,34vw,27rem)}
@media(min-width:901px) and (min-aspect-ratio:1/1){.login-wrap{--lw:clamp(21rem,26vw,26rem)}}
@media(min-width:601px) and (max-width:1024px){.login-wrap{--lw:min(26rem,86vw)}}
@media(max-width:600px){.login-wrap{--lw:100%;padding-left:clamp(.75rem,4vw,1.2rem);padding-right:clamp(.75rem,4vw,1.2rem)}}
@media(max-height:500px) and (orientation:landscape){.login-wrap{--lw:min(26rem,90vw)}}
.login-wrap .center{padding:0;min-height:auto;width:100%}
.login-wrap .login-top,.login-wrap .box{width:100%;max-width:var(--lw)!important;box-sizing:border-box}
.big{font-family:var(--fs);font-size:clamp(2.2rem,7vw,4.2rem);font-weight:600;letter-spacing:.04em;line-height:1.1;text-align:center;margin:.2em 0 .4em;color:var(--ink)}
.task{display:flex;align-items:center;gap:.7rem;padding:.8rem 1rem;background:var(--bg);border:1.5px solid var(--ln);border-radius:16px;margin:.5rem 0;transition:all .4s}
.task span{flex:1;min-width:0;overflow-wrap:anywhere;transition:color .4s}
.task.done{background:var(--okbg);border-color:var(--ok)}
@supports(background:color-mix(in srgb,red,blue)){.task.done{background:color-mix(in srgb,var(--ok) 16%,var(--card))}}
.task.done span{color:var(--ok);text-decoration:line-through}
.task.miss{border-color:var(--no);opacity:.85}
.day-task{flex-wrap:wrap;align-items:flex-start}
.day-task>span{flex:1 1 12rem;min-width:0;overflow-wrap:anywhere}
.day-task>b{font-size:.85rem;overflow-wrap:anywhere}
.day-task.pending>b{color:var(--mut)}
.task.shake{animation:sh .45s}
@keyframes sh{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.ck,.xx{width:2.5rem;height:2.5rem;min-height:0;padding:0;border-radius:50%;background:transparent;border:2px solid var(--ln);color:var(--mut);box-shadow:none;transition:all .35s;flex-shrink:0}
.ck.on{background:var(--ok);border-color:var(--ok);color:#fff}
.xx.on{background:var(--no);border-color:var(--no);color:#fff}
.cal{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:1rem;justify-content:center}
.dot{width:3.2rem;height:3.2rem;border-radius:16px;background:var(--ln);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:.65rem;cursor:pointer;transition:all .25s;color:var(--mut);gap:1px;border:0;padding:0;min-height:0;box-shadow:none}
.dot span{font-size:.9rem;font-weight:700}
.dot small{font-size:.55rem;opacity:.85;text-transform:uppercase}
.cal .dot{height:3.75rem}
.dot em.dpct{font-style:normal;font-size:.6rem;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;opacity:.95}
@media(max-aspect-ratio:3/4){.cal .dot{height:calc(clamp(2.2rem,13vw,3rem) + .7rem)}}
.dot.ok{background:var(--ok);color:#fff}
.dot.miss-dot{background:var(--mut);color:#fff;opacity:.75}
.dot.pending-dot{background:var(--bg);color:var(--mut);border:1px dashed var(--mut)}
.dot.td{outline:2px solid var(--acc);outline-offset:2px}
.dot:hover{transform:scale(1.08)}
.bar{height:.65rem;background:var(--ln);border-radius:10px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);transition:width .6s}
.tm{font-family:var(--fs);font-size:clamp(2.6rem,8vw,5rem);font-weight:600;color:var(--acc);text-align:center;font-variant-numeric:tabular-nums}
.tag{display:flex;align-items:center;justify-content:space-between;gap:.5rem;flex-wrap:wrap;background:var(--bg);border:1.5px solid var(--ln);border-radius:14px;padding:.5rem 1rem;margin:.3rem 0;font-size:.95rem}
.tag.on{border-color:var(--acc)}
.note{background:var(--bg);border:1px dashed var(--acc);border-radius:12px;padding:.6em 1em;margin:.5em 0;font-size:.9rem}
.qa{display:flex;gap:.5rem;align-items:flex-start}
.qa textarea{margin:0;flex:1}
.qcap{text-align:right;font-size:.78rem;margin:.2rem 0 .8rem}
.pct-big{font-family:var(--fs);font-size:clamp(2.4rem,8vw,4rem);font-weight:700;color:var(--acc);line-height:1}
footer{text-align:center;padding:1rem;color:var(--mut);font-size:.8rem;background:var(--card);border-top:1px solid var(--ln);width:100%;margin-top:auto}
#ck[hidden]{display:none}
#ck{position:fixed;left:1rem;right:1rem;bottom:calc(1rem + env(safe-area-inset-bottom,0px));z-index:99;background:var(--card);border:1px solid var(--acc);border-radius:14px;padding:1rem;display:flex;gap:.8rem;flex-wrap:wrap;align-items:center;justify-content:space-between;max-width:42rem;margin:auto;box-shadow:var(--sh)}
.mini-popup{display:none;position:fixed;top:0;left:0;right:auto;background:var(--card);border:1px solid var(--ln);border-radius:18px;padding:clamp(.7rem,2vw,1rem);box-shadow:0 18px 50px #00000055;z-index:99999;width:min(20rem,calc(100vw - 1.2rem));max-height:min(78vh,34rem);overflow:auto;text-align:center;-webkit-overflow-scrolling:touch;touch-action:manipulation}
#mini-backdrop{position:fixed;inset:0;background:transparent;z-index:99998}
#mini-backdrop[hidden]{display:none}
.mini-cal-grid{display:flex;flex-wrap:wrap;gap:.3rem;margin-top:.5rem;justify-content:center}
.mini-dot{position:relative;width:2rem;height:2rem;border-radius:50%;background:var(--ln);display:grid;place-items:center;font-size:.7rem;color:var(--mut)}
.mini-dot.td{outline:2px solid var(--acc);font-weight:700;color:var(--acc)}
.mini-dot::after{content:attr(data-day);position:absolute;bottom:125%;left:50%;transform:translateX(-50%) translateY(4px);background:var(--ink);color:var(--bg);font-size:.65rem;padding:3px 7px;border-radius:6px;white-space:nowrap;opacity:0;visibility:hidden;transition:opacity .25s,transform .25s,visibility .25s;pointer-events:none;z-index:100}
.mini-dot:hover::after{opacity:1;visibility:visible;transform:translateX(-50%)}
/* mini takvim (header sag ust): sayinin uzerine gelince yumusak fade-in / fade-out + acik bej */
.mini-dot{transition:background .45s ease,color .45s ease,box-shadow .45s ease,opacity .45s ease,transform .45s ease,filter .45s ease}
.mini-cal-grid .mini-dot:hover,.mini-cal-grid .mini-dot.lit{background:#f7ecdc;color:#a8845c;box-shadow:0 6px 16px #8a5a3a33;transform:translateY(-1px) scale(1.12)}
.mini-cal-grid .mini-dot span{transition:color .45s ease}
.mini-cal-grid .mini-dot:hover span,.mini-cal-grid .mini-dot.lit span{color:#a8845c}
.mini-dot.future{background:transparent;border:1.5px dashed var(--ln);color:var(--mut);opacity:.6}
.mini-dot.fog{background:var(--ln);color:var(--mut);opacity:.5;filter:blur(.6px) saturate(.4)}
.mini-cal-grid .mini-dot.fog:hover,.mini-cal-grid .mini-dot.fog.lit{filter:none;opacity:1}
.mini-dot.note{position:relative}
.mini-dot span{font-weight:600;font-size:.72rem;line-height:1}
.mini-dot small{display:none}
.mini-dot.note::before{content:'•';position:absolute;top:-2px;right:1px;font-size:.6rem;color:var(--acc)}
#top-date-trigger{transition:color .35s,background .35s,box-shadow .35s,transform .35s;padding:.25em .7em;border-radius:999px;display:inline-flex;align-items:center;gap:.35em}
#top-date-trigger:hover{color:var(--acc);background:var(--bg);transform:translateY(-1px)}
#top-date-trigger.lit{color:#7a5636;background:#f7ecdc;box-shadow:0 6px 18px #8a5a3a2a}
#top-date-trigger small{font-size:.72rem;opacity:.85;font-weight:600}
.mini-popup{animation:mpIn .32s cubic-bezier(.2,.7,.2,1) both}
/* TV / uzaktan kumanda ve klavye: odak gorunur, hedefler buyuk */
aside a:focus-visible,button:focus-visible,.dot:focus-visible,.mini-dot:focus-visible{outline:3px solid var(--acc);outline-offset:3px}
@media(min-width:1700px) and (min-aspect-ratio:16/9){
html{font-size:16px}html{font-size:16px}aside{width:18.5rem}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
/* mobil menu: takilma/jitter yok, dokunma hedefleri buyuk, smooth kaydirma */
aside{-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;touch-action:pan-x;scroll-behavior:smooth;scrollbar-width:none}
aside::-webkit-scrollbar{display:none}
aside a{flex:0 0 auto;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
@media(hover:none),(pointer:coarse){
  aside a:hover{transform:none;background:transparent;color:var(--mut)}
  aside a.on:hover{background:var(--acc);color:var(--on-acc,#fff)}
  aside a{padding:.55em 1.05em;min-height:2.75rem;height:2.75rem;display:flex;align-items:center;justify-content:center;line-height:1;font-size:.92rem}
  aside{gap:.35rem;scroll-padding-inline:.4rem;scroll-snap-type:x proximity}
}
::view-transition-old(root){animation:vtOut .28s ease both}
::view-transition-new(root){animation:vtIn .28s ease both}
@keyframes vtOut{to{opacity:0}}
@keyframes vtIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){::view-transition-new(root){animation:none}}
/* ---- tum cihazlarda ayni gecisler: TV, telefon, tablet, dokunmatik ---- */
.emenv{display:flex;justify-content:center;gap:.5rem;flex-wrap:wrap;margin-bottom:.6rem}
.row{row-gap:.5rem}
.card,.task,.tag,.note{max-width:100%;overflow-wrap:anywhere}
[role=button]{-webkit-user-select:none;user-select:none}
@media(hover:none),(pointer:coarse){
  button,a[role=button],.dot,.mini-dot,.ck,.xx{min-height:2.9rem}
  button.s,.ck,.xx,.dot{min-height:2.6rem}
  button:hover,a[role=button]:hover{transform:none;box-shadow:none}
  aside a:hover{background:transparent;color:var(--mut)}
  aside a.on:hover{background:var(--acc);color:var(--on-acc,#fff)}
  .dot:hover{transform:none}
}
/* telefon */
@media(max-width:600px){
  .shell{padding:0 .6rem}
  .card{padding:1rem;border-radius:18px}
  h1,h2{font-size:1.15rem}
  .pct-big{font-size:clamp(2rem,11vw,3rem)}
  header.top{flex-wrap:wrap;row-gap:.3rem}
  .row>button{flex:1 1 auto}
  .qa{flex-direction:column}.qa button{align-self:flex-end}
  .dot{width:clamp(2.4rem,15vw,3rem);height:clamp(2.4rem,15vw,3rem)}
}
/* tablet: kendi olcusu */
@media(min-width:601px) and (max-width:1024px){
  aside{width:13.5rem}
  main{max-width:44rem}
  html{font-size:16px}
}
/* televizyon / cok genis ekran: uzaktan kumanda icin buyuk hedefler ve odak */
@media(min-width:1700px){
  button{min-height:2.9rem;padding:.6em 1.45em}
  aside a{padding:.75em 1.05em}
  .dot{width:3.2rem;height:3.2rem}
  .shell{max-width:84rem}
  main{max-width:56rem}
}
/* TV: uzaktan kumanda icin buyuk hedefler, ama yazi boyu sabit */

.card h2,.card h3{overflow-wrap:normal;word-break:normal;hyphens:none}
.task span{overflow-wrap:break-word;word-break:normal;white-space:pre-wrap}
#tl .task{gap:.5rem;align-items:center}
#tl .task span{flex:1 1 13rem;min-width:min(100%,13rem)}
.project-add{display:grid;grid-template-columns:minmax(0,1fr) minmax(8rem,11rem) auto;gap:.55rem;align-items:center;min-width:0;max-width:100%}
.tomorrow-plan-add{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:.5rem;align-items:center}
.tomorrow-plan-add input{margin:0;min-width:0;width:100%}
.project-add>input{margin:0;min-width:0;min-inline-size:0;width:100%;max-width:100%;box-sizing:border-box}
.project-add>button{min-width:5.5rem;max-width:100%;white-space:normal;overflow-wrap:anywhere}
.project-add-error{grid-column:1/-1;margin:0;color:var(--no);font-size:.85rem;overflow-wrap:anywhere}
.project-add-error:empty{display:none}
.danger-logout{background:#a3424b;color:#fff;border:1px solid transparent;box-shadow:0 4px 14px #a43b3733}
.danger-logout:hover{background:color-mix(in srgb,#a3424b 85%,#000)}
.modal{animation:modalVeil .25s ease both}
.modal .card{animation:modalLift .4s cubic-bezier(.2,.75,.2,1) both;transform-origin:center center}
.modal[data-kind=day] .card{animation:dayCircleOpen .65s cubic-bezier(.77,0,.175,1) both}
@keyframes modalVeil{from{opacity:0}to{opacity:1}}
@keyframes modalLift{from{opacity:0;transform:translateY(10px) scale(.985)}to{opacity:1;transform:none}}
@keyframes dayCircleOpen{0%{clip-path:circle(0 at 50% 50%);opacity:0}18%{clip-path:circle(5rem at 50% 50%);opacity:1}100%{clip-path:circle(150vmax at 50% 50%);opacity:1}}
/* Circular app reveal only after successful sign-in: no looping pulse. */
#app.circular-enter{animation:circularAppEnter .9s cubic-bezier(.77,0,.175,1) both}
@keyframes circularAppEnter{0%{clip-path:circle(0 at 50% 50%);opacity:.25}18%{clip-path:circle(5rem at 50% 50%);opacity:.9}100%{clip-path:circle(150vmax at 50% 50%);opacity:1}}
.login-busy-overlay{background:color-mix(in srgb,var(--bg) 91%,transparent)}
.login-busy-orbit{width:min(68vw,16rem);aspect-ratio:1;border:1px solid var(--ln);box-shadow:0 0 0 10px color-mix(in srgb,var(--acc) 7%,transparent);animation:none;opacity:1;position:relative}
.login-busy-orbit:before{content:'';position:absolute;inset:-3px;border-radius:50%;border:3px solid transparent;border-top-color:var(--acc);animation:spinSubtle 1.1s linear infinite}
@keyframes spinSubtle{to{transform:rotate(360deg)}}
#journal-counter{font-variant-numeric:tabular-nums}
.note-tile small{align-self:flex-end;font-size:.77rem}
.lap-row b,.lap-italic{font-style:italic}
/* Analog stopwatch: elapsed time, not wall clock. */
.chrono-dial{position:relative;width:min(78vw,24rem,55vh);aspect-ratio:1;border-radius:50%;background:color-mix(in srgb,#191d22 87%,var(--acc));margin:1rem auto;color:#fff;box-shadow:inset 0 0 0 2px #ffffff1d,0 18px 50px #0002;overflow:hidden;isolation:isolate}
.chrono-mark{position:absolute;inset:0;transform:rotate(var(--a));pointer-events:none}
.chrono-mark:before{content:'';position:absolute;top:3.3%;left:calc(50% - .55px);width:1.1px;height:var(--h,3%);background:#ffffff78}
.chrono-mark.major:before{width:2px;left:calc(50% - 1px);background:#fff9;height:5%}
.chrono-number{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:clamp(.8rem,3vw,1.18rem);font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:400;color:#fff}
.chrono-mini{position:absolute;left:35%;top:13%;width:30%;aspect-ratio:1;border-radius:50%;border:1px solid #ffffff49}
.chrono-mini-tick{position:absolute;left:50%;top:50%;transform:rotate(var(--a)) translateY(calc(-1 * min(9vw,2.35rem)));font-size:.51rem;color:#ffffffbd}
.chrono-mini .chrono-number{font-size:clamp(.45rem,1.7vw,.65rem)}
.chrono-mini:after{content:'';position:absolute;width:.27rem;height:.27rem;background:var(--acc);border-radius:50%;inset:calc(50% - .135rem) auto auto calc(50% - .135rem);z-index:6}
.chrono-hand{position:absolute;top:12%;left:calc(50% - 1px);width:2px;height:40%;background:var(--acc);transform-origin:50% 95%;transform:rotate(var(--deg));z-index:3;border-radius:3px}
.chrono-pivot{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:.53rem;height:.53rem;border-radius:50%;background:var(--acc);z-index:5}
.chrono-digital{position:absolute;left:50%;top:60%;transform:translate(-50%,-50%);font-size:clamp(.8rem,2.8vw,1.08rem);font-variant-numeric:tabular-nums;color:#fff;white-space:nowrap}
.chrono-controls{display:flex;justify-content:space-between;gap:.8rem;max-width:min(82vw,25rem);margin:0 auto;width:100%}
.chrono-controls button{min-width:4.3rem;min-height:4.3rem;border-radius:50%;padding:.35rem;background:var(--card);color:var(--ink);border:2px solid var(--ln)}
.chrono-controls .stop{color:var(--no);border-color:var(--no);background:color-mix(in srgb,var(--no) 10%,var(--card))}
.chrono-controls button:disabled{opacity:.45}
@media(max-width:700px){
 header.top{display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto;justify-items:center;gap:.42rem;padding:.7rem .75rem}

 header.top .top-tools{width:100%;margin:0;display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:center;gap:.35rem;justify-content:space-between}

 header.top .account-chip .avatar{width:2.25rem;height:2.25rem;font-size:1.05rem}
 .top-tools .account-name{display:none}
 #tl .task{display:flex;flex-wrap:wrap;align-items:center;justify-content:flex-start;gap:.42rem}
 #tl .task span{flex:1 0 100%;min-width:0;width:100%;line-height:1.5;margin:0 0 .18rem;overflow-wrap:break-word;word-break:normal}
 #tl .task button{flex:0 0 auto;min-width:2.6rem}
 #tl .task button.g.s{font-size:clamp(.78rem,3.2vw,.9rem)}
 .project-add{grid-template-columns:minmax(0,1fr) auto;gap:.45rem}
 .tomorrow-plan-add{grid-template-columns:minmax(0,1fr)}

}
@media(max-width:600px){
 .project-add{grid-template-columns:minmax(0,1fr);gap:.6rem}
 .project-add #pn{grid-column:auto}
 .project-add>button{width:100%;min-width:0;min-height:44px}
}
#project-reminder-settings :is(p,label){overflow-wrap:anywhere}
#project-reminder-settings input[type=datetime-local]{display:block;min-width:0;min-inline-size:0;max-width:100%;width:100%;box-sizing:border-box}
.project-add input[type=date]::-webkit-date-and-time-value,#project-reminder-settings input[type=datetime-local]::-webkit-date-and-time-value{min-width:0;text-align:left}
@media(max-width:360px){header.top .top-tools{gap:.17rem}.chrono-controls button{min-height:3.75rem;min-width:3.75rem}}
@media(min-width:1600px){html{font-size:clamp(16px,1vw,18px)}.shell{max-width:86rem}}
@media(prefers-reduced-motion:reduce){#app.circular-enter,.modal,.modal .card,.modal[data-kind=day] .card,.login-busy-orbit:before{animation:none!important}}
html{font-size:clamp(15.5px, .4vw + 13.8px, 17.5px)}
body{line-height:1.55}
main,.shell,.card{min-width:0}
header.top{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:clamp(.5rem,1.8vw,1rem);align-items:center;padding:clamp(.58rem,1.1vw,.85rem) clamp(.7rem,2vw,1.5rem)}
.brand-cluster{display:flex;align-items:center;gap:clamp(.42rem,1.3vw,.85rem);justify-content:flex-start;min-width:0}
.brand-mark{display:block;width:clamp(2.55rem,4.4vw,3.75rem);height:clamp(2.55rem,4.4vw,3.75rem);object-fit:contain;flex-shrink:0;filter:var(--brand-tone,none);transition:filter .35s ease,transform .3s ease}
header.top .top-brand{max-width:none;overflow:visible;text-overflow:clip;white-space:normal;line-height:1.22;font-size:clamp(.94rem,1.25vw,1.18rem);text-align:left}

.clock-lang{min-height:2rem;min-width:2rem;box-shadow:none;padding:.2rem .4rem;background:var(--card);color:var(--acc);border:1px solid var(--ln);font-size:.74rem}
.clock-lang:hover{background:var(--bg)}
.brand-mark:hover{transform:scale(1.035)}
@media(max-width:780px){

 .brand-cluster{width:100%;justify-content:center;gap:.45rem}

 header.top .top-tools{width:min(100%,30rem);display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:center;gap:clamp(.25rem,1.7vw,.65rem);justify-content:space-between}
 header.top .top-clock{justify-self:start;gap:.2rem;font-size:clamp(.74rem,2.75vw,.91rem)}
 header.top #top-date-trigger{justify-self:center;white-space:nowrap;font-size:clamp(.72rem,2.9vw,.9rem)}
 header.top .account-chip{justify-self:end;max-width:3.1rem}
}
@media(max-width:340px){.top-clock{letter-spacing:-.015em}.clock-lang{min-width:1.7rem;padding:.18rem .3rem}.brand-mark{width:2.3rem;height:2.3rem}}
@media(min-width:781px) and (max-width:980px){header.top .account-chip .account-name{display:none}.account-chip{padding:.25rem}.account-chip .avatar{width:2rem;height:2rem}}
.theme-picker{display:grid!important;grid-template-columns:repeat(auto-fit,minmax(min(100%,8.4rem),1fr));gap:.6rem!important;justify-content:stretch!important}
.theme-picker button.theme-choice{display:flex;align-items:center;gap:.4rem;text-align:left;justify-content:flex-start;min-height:2.6rem;white-space:normal;font-size:.87rem;padding:.45rem .6rem}
.theme-swatch{display:inline-block;width:1rem;height:1rem;flex:0 0 1rem;border-radius:50%;border:1px solid #0002;background:var(--acc2)}

.theme-choice[data-theme=lavender] .theme-swatch{background:#8566a4}.theme-choice[data-theme=rose] .theme-swatch{background:#bf718d}

.theme-choice[data-theme=apricot] .theme-swatch{background:#95614f}.theme-choice[data-theme=dusk] .theme-swatch{background:#cbb1c1}

#mn .card label{display:block;margin-top:.7rem;margin-bottom:.2rem}
#mn .card label:first-of-type{margin-top:.25rem}
.settings-theme .themebar>.theme-label{display:none}
.google-auth-row{margin-top:.85rem}.google-signin{width:100%;min-height:2.7rem}
#settings-name-hint:empty{display:none}
/* Stop watch uses the current theme, never fixed dark/white palette */
.chrono-dial{background:color-mix(in srgb,var(--card) 88%,var(--acc));border:2px solid var(--ln);color:var(--ink);box-shadow:inset 0 0 0 1px var(--acc2),0 14px 36px #0001;transition:background .32s,border-color .32s,color .32s}
.chrono-mark:before{background:color-mix(in srgb,var(--ink) 52%,transparent)}
.chrono-mark.major:before{background:color-mix(in srgb,var(--ink) 83%,transparent)}
.chrono-number,.chrono-digital{color:var(--ink)}
.chrono-mini{border-color:var(--ln)}
.chrono-mini-tick{color:var(--mut)}
/* Smooth circular sign-in portal: thin rotating ring -> full-screen disc -> reveal */
#login-portal{position:fixed;inset:0;z-index:20019;pointer-events:none;display:grid;place-items:center;isolation:isolate}
#login-portal .portal-disc{position:absolute;inset:0;background:color-mix(in srgb,var(--card) 85%,var(--acc));clip-path:circle(0 at 50% 50%);animation:portalBloom .88s cubic-bezier(.56,.03,.25,1) both}
#login-portal .portal-ring{width:4.2rem;height:4.2rem;border:2px solid transparent;border-top-color:var(--acc);border-right-color:var(--acc);border-radius:50%;animation:portalSpin .78s cubic-bezier(.28,.6,.25,1) both;position:relative;z-index:2}
@keyframes portalBloom{0%{clip-path:circle(0 at 50% 50%);opacity:.05}18%{clip-path:circle(7vmax at 50% 50%);opacity:1}52%{clip-path:circle(150vmax at 50% 50%);opacity:1}65%{clip-path:circle(150vmax at 50% 50%);opacity:1}100%{clip-path:circle(0 at 50% 50%);opacity:0}}
@keyframes portalSpin{0%{opacity:1;transform:rotate(0) scale(.9)}50%{opacity:1;transform:rotate(240deg) scale(1.16)}100%{opacity:0;transform:rotate(425deg) scale(.2)}}

.mini-popup{display:block!important;visibility:hidden;opacity:0;pointer-events:none;transform:translate3d(0,-9px,0) scale(.975);animation:none!important;transition:opacity .22s cubic-bezier(.2,.7,.2,1),transform .26s cubic-bezier(.2,.7,.2,1),visibility .22s;z-index:18000;width:min(25rem,calc(100vw - 1rem))}
.mini-popup.open{visibility:visible;opacity:1;pointer-events:auto;transform:none}
.mini-cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:clamp(.2rem,.8vw,.4rem)}
.mini-cal-grid .mini-dot{width:100%;height:auto;aspect-ratio:1;min-height:2.35rem;max-height:3rem;font-size:.8rem}
#mini-backdrop{z-index:17990}
.modal{z-index:19000;animation:modalVeil .23s ease both}
.modal[data-kind=day]{z-index:21000;background:rgba(24,19,18,.5);backdrop-filter:blur(7px)}
.modal .card{width:min(32rem,calc(100vw - 1.3rem))!important;border-radius:clamp(18px,4vw,27px);overscroll-behavior:contain;max-height:min(85dvh,48rem)!important}
.modal[data-kind=day] .card{animation:dayDetailIn .36s cubic-bezier(.2,.8,.2,1) both}
@keyframes dayDetailIn{from{opacity:0;clip-path:circle(7% at 50% 42%);transform:translateY(6px) scale(.98)}to{opacity:1;clip-path:circle(160% at 50% 42%);transform:none}}
.modal.is-closing{opacity:0;pointer-events:none;transition:opacity .19s ease;animation:none!important}
.modal.is-closing .card{transform:translateY(7px) scale(.985);opacity:0;transition:transform .19s ease,opacity .19s ease;animation:none!important}
body:has(.modal:not(.is-closing)){overflow:hidden}

.future-note-tile>.row{margin-top:.3rem;gap:.5rem}

function softPaint(){

  const canVT=document.startViewTransition&&document.visibilityState==='visible'&&!reduced;
  if(canVT){
    clearTimeout(softPaintTimer);softPaintTimer=0;

    try{
      const t=document.startViewTransition(()=>paint());
      if(t&&t.finished&&t.finished.catch)t.finished.catch(()=>{});

    }catch(e){}

  if(!root||reduced){paint();return;}
  clearTimeout(softPaintTimer);

    paint();

  if(!aside||!on||aside.scrollWidth<=aside.clientWidth+2)return;
  /* Use visible rectangles rather than offsetLeft: mobile browsers can report
     offsetLeft relative to the page when the horizontal nav is not positioned. */
  const navRect=aside.getBoundingClientRect(),itemRect=on.getBoundingClientRect();
  const itemCenter=(itemRect.left-navRect.left)+aside.scrollLeft+(itemRect.width/2);
  const target=itemCenter-(aside.clientWidth/2);
  const max=Math.max(0,aside.scrollWidth-aside.clientWidth);
  const left=Math.max(0,Math.min(max,target));
  const reduced=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(immediate||reduced){
    const previous=aside.style.scrollBehavior;
    aside.style.scrollBehavior='auto';aside.scrollLeft=left;aside.style.scrollBehavior=previous;

  if(typeof value!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(value))return false;

function progressPercent(activeDays,pctFrom,asOf){

  const cutoff=current<PROGRESS_CUTOVER?current:PROGRESS_CUTOVER;
  const isLegacy=validProgressDate(pctFrom)&&pctFrom<=PROGRESS_CUTOVER;
  const baseline=isLegacy?Math.max(1,progressDayDistance(pctFrom,cutoff)+1):0;
  const recent=Object.keys(days).filter(day=>
    validProgressDate(day)&&day<=current&&days[day]===true&&(!isLegacy||day>cutoff)
  ).length;

function usernameSuggestions(name,used=[]){
  // Suggestions are cosmetic candidates; the server still decides availability.
  const normalized=String(name||'').normalize('NFKD').replace(/[\u0300-\u036f]/g,'')
    .replace(/ı/g,'i').replace(/İ/g,'I').replace(/ğ/g,'g').replace(/Ğ/g,'G')

    .replace(/^[._-]+|[._-]+$/g,'').slice(0,15)||'user';
  const endings=['nova','lumen','pixel','orbit','river','solace','sky','glow','aurora','bloom',
    'moss','mist','quartz','echo','star','dawn','horizon','spark','sage','cloud','amber','trail','moon','verse',
    'mint','cove','atlas','vibe','grove','wave','dream','pulse','wander','zenith','ember','rain','drift'];
  const taken=new Set(used.map(x=>String(x).toLocaleLowerCase('tr-TR')));
  const out=[],seen=new Set();
  const randomNumber=(limit)=>{
    if(globalThis.crypto?.getRandomValues){const v=new Uint32Array(1);crypto.getRandomValues(v);return v[0]%limit}
    return Math.floor(Math.random()*limit);
  };
  for(let attempt=0;attempt<100&&out.length<5;attempt++){
    const ending=endings[randomNumber(endings.length)];
    const joiner=['','_','.','-'][randomNumber(4)];
    const number=attempt%3===0?String(11+randomNumber(88)):'';
    const prefix=normalized.slice(0,20-ending.length-joiner.length-number.length);
    const suggestion=(prefix+joiner+ending+number).replace(/^[._-]+|[._-]+$/g,'');
    const lower=suggestion.toLocaleLowerCase('tr-TR');
    if(userRe.test(suggestion)&&!taken.has(lower)&&!seen.has(lower)){
      seen.add(lower);out.push(suggestion);
    }
  }
  return out;
}

function detectDevice(){
  const w=innerWidth,h=innerHeight,coarse=window.matchMedia('(pointer:coarse)').matches||(navigator.maxTouchPoints||0)>1;
  const short=Math.min(w,h),long=Math.max(w,h);
  let dev='desktop';
  /* telefon/tablet: kisa kenar + dokunmatik; TV: buyuk ekran; masaustu: geri kalan */
  if(short<=600&&(coarse||short<=480))dev='phone';
  else if(short<=900&&coarse)dev='tablet';
  else if(short<=1024&&long<=1400)dev='tablet';
  else if(coarse&&long>1024)dev='tv';
  else if(long>=1700)dev='desktop-xl';
  else if(long<=900)dev='mobile-narrow';
  document.documentElement.dataset.dev=dev;
  document.documentElement.dataset.orient=h>=w?'portrait':'landscape';
  if(view==='app')requestAnimationFrame(()=>centerNav(true));
  return dev;
}

  dialog.innerHTML=`<div class="mobile-menu-heading"><h2 id="mobile-menu-title">${tr()?'Menü':'Menu'}</h2><button type="button" class="mobile-menu-close" aria-label="${tr()?'Menüyü kapat':'Close menu'}" onclick="closeNavMenu()"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div><nav class="mobile-menu-grid" aria-label="${tr()?'Tüm sayfalar':'All pages'}">${NAV.map(([key])=>`<button type="button" class="mobile-menu-item ${pg===key?'is-current':''}" ${pg===key?'aria-current="page" autofocus':''} onclick="selectNavPage('${key}')">${navIcon(key)}<span><strong>${navLabel(key)}</strong><small>${hints[key]}</small></span></button>`).join('')}</nav>`;
  const overflow=document.documentElement.style.overflow;
  dialog.addEventListener('keydown',event=>{
    if(event.key!=='Tab')return;
    const controls=[...dialog.querySelectorAll('button:not([disabled])')],first=controls[0],last=controls[controls.length-1];
    if(event.shiftKey&&(document.activeElement===first||!dialog.contains(document.activeElement))){event.preventDefault();last.focus()}
    else if(!event.shiftKey&&(document.activeElement===last||!dialog.contains(document.activeElement))){event.preventDefault();first.focus()}
  });
  dialog.addEventListener('click',event=>{if(event.target!==dialog)return;const r=dialog.getBoundingClientRect();if(event.clientX<r.left||event.clientX>r.right||event.clientY<r.top||event.clientY>r.bottom)closeNavMenu()});

function closeNavMenu(){
  const dialog=document.getElementById('mobile-menu');

  if(window.matchMedia?.('(prefers-reduced-motion:reduce)').matches){dialog.close();return}
  dialog.classList.add('is-closing');
  let closed=false,fallback=0;
  const finish=()=>{if(closed)return;closed=true;clearTimeout(fallback);if(dialog.open)dialog.close()};
  dialog.addEventListener('animationend',event=>{if(event.target===dialog&&event.animationName==='mobileMenuOut')finish()},{once:true});
  fallback=setTimeout(finish,uiMotionTime('--motion-surface-close-ms',240)+100);
}

function navKeydown(event){

  if(index<0)return;

}

async function activateCloudUser(j,preferredName='',method='password',options={}){
  const uid=j&&j.user&&j.user.id;
  if(!uid||!j.access_token)throw new Error('Missing authenticated session');
  sbSave({access_token:j.access_token,refresh_token:j.refresh_token,user:j.user,at:Date.now()});
  const meta=j.user.user_metadata||{};
  if(window.IYAccount&&!await IYAccount.checkAccess(j.user))return;
  if(options.requireRecentGoogle&&!await sbGoogleQuickResumeAllowed())return null;
  // Never load or render private data until this JWT session has confirmed
  // ownership of the registered email address. RLS and RPCs enforce the gate.
  if(!window.IYBrowserGate||!await IYBrowserGate.check(j.user))return null;
  const fromCloud=await sbPull(); // may throw, never replace cloud data with empty after a failure
  const progressPolicy=await sbProgressPolicy(uid);
  if(sbSession()?.user?.id!==uid)throw new Error('Authenticated identity changed during activation');
  if(options.requireRecentGoogle&&!await sbGoogleQuickResumeAllowed())return null;
  const fromLocal=Object.values(DB.accounts).find(x=>x.authUid===uid);
  if(!fromLocal&&deviceAccountCount()>=MAX_DEVICE_ACCOUNTS){sbClear();throw Object.assign(Error('DEVICE_ACCOUNT_LIMIT'),{code:'DEVICE_ACCOUNT_LIMIT'})}
  const pending=syncStart(uid,fromCloud||{});
  if(fromLocal&&!pending&&fromCloud)syncArchiveLegacy(uid,fromLocal,fromCloud);
  const username=String((fromCloud&&fromCloud.u)||meta.username||preferredName||(fromLocal&&fromLocal.u)||j.user.email.split('@')[0]);
  const a=norm(pending||fromCloud||fromLocal||{u:username,nick:meta.nick||username,email:j.user.email});
  bindReportCalendar(a,j.user,!fromCloud&&!fromLocal);
  applyServerProgressPolicy(a,progressPolicy);
  a.u=username;a.authUid=uid;a.accountOrigin='cloud';a.email=String(j.user.email||a.email||'').toLowerCase();a.mail=a.email;
  a.pw='';delete a.salt; // Cloud passwords are checked by Supabase, never stored in user_data.
  a.loginMethod=method==='google'?'google':'password';
  if(method==='google'||j.user.app_metadata?.providers?.includes('google'))a.googleConnected=true;
  v13ProtectLegacyCollision(a.u,uid,options.allowLegacyReplacement===true);
  DB.accounts[a.u]=a;DB.last=a.nick||a.u;DB.lastUser=a.u;A=a;
  restorePomodoroState();applyTheme();
  if(!save({skipCloudPush:true}))throw Error('LOCAL_SYNC_STORAGE_UNAVAILABLE');
  loginDat={u:'',p:''};
  if(options.entryTransition)await options.entryTransition;
  goTo('app','home');
  // A newly created row initially contains {}. Only this case queues an
  // explicit first write; logging in NEVER re-uploads stale normalized cache.
  if(!fromCloud&&!pending){if(save())await sbPush()}
  syncNotice();
  return a;
}
async function login(){

  const localKey=findUser(raw);
  const matchingMail=Object.values(DB.accounts).find(a=>String(a.email||a.mail||'').toLowerCase()===raw.toLowerCase());
  const localAcc=localKey?DB.accounts[localKey]:matchingMail;
  const email=raw.includes('@')?raw.toLowerCase():localAcc&&String(localAcc.email||localAcc.mail||'').toLowerCase();
  const entryTransition=new Promise(resolve=>playWelcomeTransition(resolve));

          sbClear();A=norm(localAcc);A.accountOrigin='local';DB.lastUser=A.u;restorePomodoroState();applyTheme();save();await entryTransition;goTo('app','home');
          toast(tr()?'Eski yerel hesabın açıldı; başka cihazlarla eşitlenmez.':'Legacy local account: no cross-device sync.');return;
        }

          return;

        if(authErrorMessage(e)==='credentials'&&localAcc?.googleConnected)msg=tr()?'E-posta veya şifre doğrulanamadı. Uygulama şifren yoksa “Şifremi unuttum” üzerinden e-postanı doğrulayarak oluşturabilirsin. Google ile giriş de kullanılabilir.':'Email or password could not be verified. If you do not have an app password, use “Forgot password” to create one after verifying your email. Google sign-in remains available.';
        if(e.code==='DEVICE_ACCOUNT_LIMIT')msg=tr()?'Bu cihazda üç hesap sınırına ulaşıldı. Önce kullanılmayan bir bulut profilini bu cihazda unut.':'This device already remembers three accounts. Forget one cloud profile locally before signing in to another.';
        if(e.name==='AbortError')msg=tr()?'Bağlantı zaman aşımına uğradı.':'Connection timed out.';
        return renderAppOrAuth();
      }
    }
    if(localAcc&&!accountCloudHints(localAcc)&&await pwMatch(localAcc,password)){
      sbClear();A=norm(localAcc);A.accountOrigin='local';restorePomodoroState();applyTheme();save();await entryTransition;goTo('app','home');
      toast(tr()?'Bu yalnızca yerel eski hesap. Diğer cihazlarda e-posta ile bulut hesabına giriş yapmalısın.':'Legacy local account only.');return;

    renderAppOrAuth();
  }finally{loginBusy(false)}
}

async function setup(){
  if(authBusy)return;
  const u=String($('#u')?.value||'').trim(),n=String($('#n')?.value||'').trim();
  const e=String($('#e')?.value||'').trim().toLowerCase(),p=String($('#p')?.value||''),p2=String($('#p2')?.value||'');
  formDat={u,n,b:String($('#b')?.value||'').slice(0,160),e,t:'',p:'',p2:''};
  if(!userRe.test(u))msg=t('usernameRules');
  else if(!n)msg=t('displayRequired');
  else if(findUser(u))msg=t('usernameTaken');
  else if(!emailPattern.test(e))msg=t('emailInvalid');
  else if(p!==p2)msg=tr()?'Şifreler eşleşmiyor.':'Passwords do not match.';
  else msg=pwOk(p,u);
  if(msg){renderAppOrAuth();if(msg===t('usernameTaken'))debounceNameCheck();return}
  if(Object.values(DB.accounts).some(a=>String(a.email||a.mail||'').toLowerCase()===e)){goExistingEmail(e);return}
  if(deviceAccountCount()>=MAX_DEVICE_ACCOUNTS){msg=tr()?'Bu cihazda en fazla 3 hesap saklanabilir. Önce mevcut bulut hesaplarından birini bu cihazda unut.':'This device can remember at most 3 accounts. Forget an unused cloud profile on this device first.';renderAppOrAuth();return}
  loginBusy(true);
  try{
    const available=await sb('/rest/v1/rpc/iydu_username_available',{method:'POST',body:{p_username:u}});
    if(available!==true){msg=t('usernameTaken');renderAppOrAuth();debounceNameCheck();return}
    const j=await sbSignUp(u,p,n,e);
    if(!j||!j.access_token){
      pendingSignup={email:e,username:u,nick:n};
      formDat.p='';formDat.p2='';
      view='signup-code';msg='';renderAppOrAuth();return;
    }
    if(!j.user?.email_confirmed_at){
      sbClear();
      pendingSignup={email:e,username:u,nick:n};
      formDat.p='';formDat.p2='';
      view='signup-code';msg=tr()?'E-posta doğrulaması tamamlanmadan giriş yapılamaz.':'Email verification must be completed before signing in.';
      renderAppOrAuth();return;
    }
    const entryTransition=new Promise(resolve=>playWelcomeTransition(resolve));
    await activateCloudUser(j,u,'password',{entryTransition});
    formDat={u:'',n:'',b:'',e:'',t:'',p:''};
    toast(tr()?'Hesabın oluşturuldu. E-posta durumunu Ayarlar’dan kontrol edebilirsin.':'Your account is ready. Check your email status in Settings.');
  }catch(err){
    const cause=authErrorMessage(err);
    if(cause==='already-email'){goExistingEmail(e);return}
    if(cause==='username'){msg=t('usernameTaken');renderAppOrAuth();debounceNameCheck();return}
    msg=(tr()?'Bulut kaydı tamamlanamadı. Ağ veya Supabase ayarlarını kontrol et.':'Could not register. Check network and Supabase configuration.');
    if(err.name==='AbortError')msg=tr()?'İstek zaman aşımına uğradı.':'Request timed out.';
    renderAppOrAuth();
  }finally{loginBusy(false)}
}

let recoveryMailBusy=false,recoveryMailRetryAfter=0;
async function fSend(k){
  if(recoveryMailBusy)return;
  const email=String($('#u')?.value||'').trim().toLowerCase();
  const feedback=$('#fz');
  const inform=text=>{msg=text;if(feedback)feedback.textContent=text;else renderAppOrAuth()};
  if(!emailPattern.test(email)){inform(t('emailInvalid'));return}
  if(Date.now()<recoveryMailRetryAfter){
    inform(tr()?'Yeni bağlantı istemeden önce biraz bekle. Önceki e-postanı da kontrol edebilirsin.':'Please wait before requesting another link. You can check your previous email.');
    return;
  }
  recoveryMailBusy=true;
  const button=document.getElementById('forgot-reset-submit');
  if(button)button.disabled=true;
  try{
    await sbRecover(email);
    recoveryMailRetryAfter=Date.now()+60000;
    msg='';
    if(feedback){
      feedback.innerHTML=`<div class="note">${tr()?'E-posta isteği alındı.':'Email requested.'}</div><button class="g" type="button" onclick="IYRecovery.resume(this.dataset.email)">${tr()?'Onay kodunu gir':'Enter confirmation code'}</button>`;
      feedback.querySelector('button').dataset.email=email;
    }
  }catch(error){
    if(error?.status===429||error?.code==='over_email_send_rate_limit'){
      recoveryMailRetryAfter=Date.now()+60000;
      inform(tr()?'Çok fazla sıfırlama isteği gönderildi. En az bir dakika bekleyip tekrar dene.':'Too many reset requests. Wait at least one minute before trying again.');
    }else{
      inform(tr()?'E-posta şu an gönderilemedi. Biraz sonra tekrar dene.':'Could not send the email. Try again shortly.');
    }
  }finally{
    recoveryMailBusy=false;
    if(button?.isConnected)button.disabled=false;
  }
}

let profileHintTimer=0,profileHintSequence=0;
async function profileUsernameHint(name,targetId){
  const serial=++profileHintSequence;
  clearTimeout(profileHintTimer);
  const el=document.getElementById(targetId);
  if(!el||!A)return;
  const proposed=String(name||'').trim();
  if(!proposed){el.textContent='';return}
  if(!userRe.test(proposed)){
    el.innerHTML=`<small class="mut">${esc(t('usernameRules'))}</small>`;return;
  }
  if(proposed===A.u){el.innerHTML=`<small class="username-available">${tr()?'Bu, mevcut kullanıcı adın.':'This is your current username.'}</small>`;return}
  el.textContent=tr()?'Kullanıcı adı denetleniyor…':'Checking username…';
  profileHintTimer=setTimeout(async()=>{
    let taken=!!(findUser(proposed)&&findUser(proposed)!==A.u);
    if(!taken&&A.authUid){
      try{const available=await sb('/rest/v1/rpc/iydu_username_available',{method:'POST',body:{p_username:proposed}});taken=available===false}
      catch(_){if(serial===profileHintSequence)el.textContent=tr()?'Kullanıcı adı şu an doğrulanamadı.':'Could not verify username availability.';return}
    }
    if(serial!==profileHintSequence||!el.isConnected)return;
    if(!taken){
      el.innerHTML=`<small class="username-available">${tr()?(A.authUid?'Bu kullanıcı adı uygun.':'Bu cihazda uygun; bulut kontrolü yapılmadı.'):(A.authUid?'This username is available.':'Available on this device; cloud status not checked.')}</small>`;
      return;
    }
    const proposals=usernameSuggestions(proposed,Object.keys(DB.accounts));
    let suggestions=proposals;
    if(A.authUid){
      const checks=await Promise.all(proposals.map(async candidate=>{
        try{return await sb('/rest/v1/rpc/iydu_username_available',{method:'POST',body:{p_username:candidate}})===true?candidate:null}
        catch(_){return null}
      }));
      suggestions=checks.filter(Boolean);
    }
    if(serial!==profileHintSequence||!el.isConnected)return;
    const target=targetId==='settings-name-hint'?'su':'prof-u';
    el.innerHTML=`<small class="mut">${t('usernameTaken')} ${tr()?'Benzer alternatifler:':'Matching alternatives:'}</small><div class="row username-suggestions">${suggestions.map(candidate=>`<button type="button" class="g s" data-suggest="${esc(candidate)}">${esc(candidate)}</button>`).join('')}</div><button type="button" class="g s" data-refresh-suggestions>${tr()?'Yeni öneriler':'More suggestions'}</button>`;
    el.querySelectorAll('[data-suggest]').forEach(button=>button.addEventListener('click',()=>{
      const input=document.getElementById(target);if(!input)return;
      input.value=button.dataset.suggest;profileUsernameHint(input.value,targetId);
    }));
    el.querySelector('[data-refresh-suggestions]')?.addEventListener('click',()=>profileUsernameHint(proposed,targetId));
  },300);
}

/* Return one month of header buttons without rebuilding the page or any draft inputs. */
function miniCalendarData(dayKey){
  const [y,month]=dayKey.split('-').map(Number),mo=month-1;
  const days=new Date(y,mo+1,0).getDate();
  const labels=tr()?['Pzt','Sal','Çar','Per','Cum','Cmt','Paz']:['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  const leading=(new Date(y,mo,1).getDay()+6)%7;
  let mc=labels.map(day=>`<span class="mini-cal-weekday">${day}</span>`).join('')+'<span class="mini-calendar-empty" aria-hidden="true"></span>'.repeat(leading);
  for(let d=1;d<=days;d++){
    const k=`${y}-${pad(month)}-${pad(d)}`,its=items(k),future=k>dayKey;
    let cls=future?'future':(k<dayKey&&A.fog&&!(its.length>0&&its.every(x=>x.done))?'fog':'');
    if(!future&&its.length>0)cls=its.every(x=>x.done)?'ok':its.some(x=>taskStatus(x)==='miss')?'miss-dot':'pending-dot';
    if(hasNote(k))cls+=' note';
    mc+=`<button class="mini-dot ${cls} ${k===dayKey?'td':''}" title="${fmt(k)}" ${k<dayKey&&!A.fog?'disabled aria-disabled="true"':''} onclick="miniClick(event,'${k}')"><span>${d}</span></button>`;
  }
  return {y,mo,mc};
}

function latestUnlockedReportPeriod(kind,day){

function logFocusSegment(endedAt,startedAt,completed=false,paused=[],expected=0){
  if(!completed||!A||!Number.isFinite(endedAt)||!Number.isFinite(startedAt)||endedAt<startedAt)return;
  const parts=(Array.isArray(paused)?paused:[]).filter(p=>p&&Number.isFinite(p.at)&&Number.isFinite(p.seconds)&&p.seconds>0&&p.at<=endedAt);
  const last=Math.floor((endedAt-startedAt)/1000);
  if(last>0)parts.push({at:endedAt,seconds:last});
  const seconds=parts.reduce((total,p)=>total+p.seconds,0);
  if(seconds<=0||seconds>36000||seconds<expected)return;
  if(!Array.isArray(A.focusHistory))A.focusHistory=[];
  const history=A.focusHistory;
  if(history.some(r=>r?.at===endedAt&&r.completed===true))return;
  history.push({at:endedAt,seconds,completed:true,...(parts.length>1?{parts}:{})});
  if(history.length>2000)history.splice(0,history.length-2000);

function focusSummary(history,start,end){
  const perDay={};let seconds=0,sessions=0;
  for(const record of Array.isArray(history)?history:[]){
    if(record?.completed!==true||!Number.isFinite(record.at)||!Number.isFinite(record.seconds)||record.seconds<=0||record.seconds>36000)continue;
    const parts=Array.isArray(record.parts)?record.parts:[record];
    for(const part of parts){
      if(!Number.isFinite(part?.at)||!Number.isFinite(part.seconds)||part.seconds<=0||part.seconds>36000)continue;
      let cursor=part.at-part.seconds*1000;
      while(cursor<part.at){
        const date=new Date(cursor),day=D(date);
        const next=Math.min(part.at,new Date(date.getFullYear(),date.getMonth(),date.getDate()+1).getTime());
        if(!Number.isFinite(next)||next<=cursor)break;
        if(day>=start&&day<=end){
          perDay[day]||={seconds:0,sessions:0};
          const duration=(next-cursor)/1000;perDay[day].seconds+=duration;seconds+=duration;
        }
        cursor=next;
      }
    }
    const finishedDay=D(new Date(record.at));
    if(finishedDay>=start&&finishedDay<=end){
      perDay[finishedDay]||={seconds:0,sessions:0};perDay[finishedDay].sessions++;sessions++;
    }
  }
  return {seconds,sessions,perDay};
}

const clk=ms=>{const d=new Date(Date.now()+ms);return pad(d.getHours())+':'+pad(d.getMinutes())};
let audioCtx=null;
function prepareAudio(){
  try{
    const Ctx=window.AudioContext||window.webkitAudioContext;
    if(!Ctx)return;
    if(!audioCtx)audioCtx=new Ctx();
    if(audioCtx.state==='suspended')audioCtx.resume().catch(()=>{});
  }catch(_){}
}
function beep(){
  try{
    if(!audioCtx||audioCtx.state!=='running')return;
    const at=audioCtx.currentTime;
    for(const [i,frequency] of [523.25,659.25].entries()){
      const osc=audioCtx.createOscillator(),gain=audioCtx.createGain();
      osc.type='sine';osc.frequency.value=frequency;
      osc.connect(gain);gain.connect(audioCtx.destination);
      const start=at+i*.16;
      gain.gain.setValueAtTime(.0001,start);
      gain.gain.exponentialRampToValueAtTime(.055,start+.035);
      gain.gain.exponentialRampToValueAtTime(.0001,start+.38);
      osc.start(start);osc.stop(start+.4);
    }
  }catch(_){}
}
function pomoPhaseLabel(){return pm.ph==='w'?(tr()?'Odak zamanı':'Focus time'):(pm.lg?t('longBreak'):t('break'))}
function closePomoOverlay(){const el=$('#pomo-overlay');if(!el)return;el.classList.add('pomo-exit');setTimeout(()=>el.remove(),20)}

  const pctRemain=Math.min(100,Math.max(0,pm.left/total*100));

  const value=$('#pomo-overlay-time');if(value)value.textContent=ft(pm.left);

  const toggle=$('#pomo-overlay-toggle');if(toggle)toggle.textContent=pm.run?(tr()?'Duraklat':'Pause'):(tr()?'Devam et':'Resume');

let pomoPipWindow=null;
function updatePomoPip(){
  if(!pomoPipWindow||pomoPipWindow.closed)return;
  const doc=pomoPipWindow.document;
  const time=doc.getElementById('pip-time'),phase=doc.getElementById('pip-phase'),toggle=doc.getElementById('pip-toggle');

  if(phase)phase.textContent=pomoPhaseLabel();
  if(toggle)toggle.textContent=pm.run?(tr()?'Duraklat':'Pause'):(tr()?'Başlat':'Start');

function syncPomoPipAppearance(doc){
  if(!doc?.documentElement)return;
  const styles=getComputedStyle(document.documentElement);
  for(const prop of ['--bg','--card','--ink','--acc','--acc2','--ln','--on-acc','--fs']){
    const value=styles.getPropertyValue(prop).trim();
    if(value)doc.documentElement.style.setProperty(prop,value);
  }
  const bodyFont=getComputedStyle(document.body).fontFamily;
  doc.documentElement.style.setProperty('--pip-body-font',bodyFont);
}
async function openPomoPip(){

  const api=window.documentPictureInPicture;

    if(pomoPipWindow&&!pomoPipWindow.closed){pomoPipWindow.focus();return}

     style.textContent=`*{box-sizing:border-box}html{font-size:16px}body{margin:0;display:grid;place-items:center;min-height:100vh;min-height:100dvh;padding:10px;background:var(--bg,#fff);color:var(--ink,#222);font:600 1rem/1.4 var(--pip-body-font,'Nunito',system-ui,sans-serif);text-align:center}.ring{border:7px solid var(--acc,#777);background:var(--card,#fff);border-radius:50%;width:min(58vw,185px);aspect-ratio:1;display:grid;place-items:center;align-content:center;gap:8px}#pip-time{font:600 clamp(1.8rem,8vw,2.35rem)/1.1 var(--fs,'Fraunces',Georgia,serif);font-variant-numeric:tabular-nums;color:var(--acc,#777)}#pip-phase{font-family:var(--pip-body-font,'Nunito',system-ui,sans-serif);font-size:.85rem;color:var(--ink,#222)}.actions{display:flex;gap:7px;justify-content:center;margin:12px 0;flex-wrap:wrap}button{background:var(--acc,#777);color:var(--on-acc,#fff);border:1px solid var(--ln,#ccc);border-radius:999px;padding:9px 14px;font:600 .9rem/1.2 var(--pip-body-font,'Nunito',system-ui,sans-serif);cursor:pointer}`;
     doc.head.appendChild(style);syncPomoPipAppearance(doc);
    const wrap=doc.createElement('main');wrap.innerHTML='<div class="ring"><div id="pip-phase"></div><div id="pip-time"></div></div><div class="actions"><button id="pip-toggle"></button><button id="pip-reset">Reset</button></div>';
    doc.body.appendChild(wrap);
    doc.getElementById('pip-toggle').addEventListener('click',()=>{pS();updatePomoPip()});

}
async function pomoFullscreen(){

let stopwatchView='timer',swTouchX=null,swLapFlashUntil=0;
function swElapsed(){
  const st=A?.stopwatch||{elapsed:0,started:0,running:false};
  return Math.max(0,Number(st.elapsed)||0)+(st.running?Math.max(0,Date.now()-Number(st.started||Date.now())):0);
}
function swRender(){
  const ms=swElapsed(),formatted=stopwatchFormat(ms);
  const e=document.getElementById('sw');if(e){e.textContent=formatted;e.classList.toggle('lap-italic',Date.now()<swLapFlashUntil)}
  const chrono=document.getElementById('chrono-digital');if(chrono){chrono.textContent=formatted;chrono.classList.toggle('lap-italic',Date.now()<swLapFlashUntil)}
  if(stopwatchView==='clock')updateClockFace();
}
function chronographTicks(){
  let output='';
  for(let i=0;i<300;i++)output+=`<i class="chrono-mark ${i%25===0?'major':''}" style="--a:${i*1.2}deg;--h:${i%5===0?'3.2%':'1.45%'}"></i>`;
  for(let v=0;v<60;v+=5){
    const angle=v*Math.PI/30,position=38.5;
    const x=50+position*Math.sin(angle),y=50-position*Math.cos(angle);
    output+=`<span class="chrono-number" style="left:${x}%;top:${y}%">${v}</span>`;
  }
  return output;
}
const CHRONO_TICKS=chronographTicks();
function updateClockFace(){
  const ms=swElapsed(),hand=document.getElementById('chrono-hand');
  if(hand)hand.style.setProperty('--deg',(ms%60000)/60000*360+'deg');
  const sub=document.getElementById('chrono-sub-hand');
  if(sub)sub.style.setProperty('--deg',(ms%1800000)/1800000*360+'deg');
}
function swMode(mode){
  stopwatchView=mode==='clock'?'clock':'timer';

}
function swTouchStart(ev){swTouchX=null;if(ev.target.closest('button,input,textarea'))return;swTouchX=ev.touches?.[0]?.clientX??null}
function swTouchEnd(ev){if(swTouchX==null)return;const delta=(ev.changedTouches?.[0]?.clientX??swTouchX)-swTouchX;swTouchX=null;if(delta>43)swMode('timer');else if(delta< -43)swMode('clock')}
function lap(){
  if(!A?.stopwatch?.running)return;

  A.laps.push(swElapsed());A.laps=A.laps.slice(-100);swLapFlashUntil=Date.now()+820;save();P.pomo();

  ${stopwatchView==='timer'?`<div id="sw" class="sw-display">${stopwatchFormat(swElapsed())}</div>`:`<div class="chrono-dial" role="img" aria-label="${tr()?'Analog kronometre':'Analog stopwatch'}">${CHRONO_TICKS}<div class="chrono-mini">${[0,10,20].map(v=>{const a=v*Math.PI/15;return `<span class="chrono-number" style="left:${50+37*Math.sin(a)}%;top:${50-37*Math.cos(a)}%">${v}</span>`}).join('')}<div id="chrono-sub-hand" class="chrono-hand" style="top:12%;height:40%"></div></div><div id="chrono-hand" class="chrono-hand"></div><div class="chrono-pivot"></div><div id="chrono-digital" class="chrono-digital">${stopwatchFormat(swElapsed())}</div></div>`}
  <div class="row stopwatch-actions"><button onclick="swStart()" ${A.stopwatch.running?'disabled':''}>${tr()?'Başlat':'Start'}</button><button class="g" onclick="swStop()" ${A.stopwatch.running?'':'disabled'}>${tr()?'Durdur':'Stop'}</button><button class="g" onclick="lap()" ${A.stopwatch.running?'':'disabled'}>Lap</button><button class="g" onclick="swR()">${t('reset')}</button></div><div class="laps">${laps}</div>

function setP(w,b){if(pm.run)pTick(true);clearInterval(pm.iv);pm={...pm,w,b,ph:'w',left:w*60,run:0,end:0,n:0,lg:0,focusParts:[],noticeFive:false,iv:0};persistPomodoroState();document.title=TITLE;closePomoOverlay();P.pomo()}

function addP(){

function pTick(silent=false){
  if(!pm.run||!pm.end)return;
  const now=Date.now();let transitions=0,changed=false;
  while(pm.end<=now&&transitions<10000){
    if(!silent&&transitions===0&&document.visibilityState==='visible')beep();
    let nextMinutes;
    if(pm.ph==='w'){
      logFocusSegment(pm.end,pm.segmentStart||pm.end-pm.w*60000,true,pm.focusParts||[],pm.w*60);pm.focusParts=[];
      pm.n++;pm.ph='b';pm.lg=pm.n%5===0?1:0;
      const breaks=Array.isArray(A&&A.presets)?A.presets.map(p=>Number(p.b)).filter(v=>Number.isFinite(v)&&v>0):[];
      nextMinutes=pm.lg?Math.max(pm.b,...breaks):pm.b;
    }else{
      pm.ph='w';pm.lg=0;nextMinutes=pm.w;
    }
    pm.segmentStart=pm.end;
    pm.end+=Math.max(1,nextMinutes)*60000;
    transitions++;changed=true;
  }
  if(pm.end<=now)pm.end=now+1000;
  pm.left=Math.max(0,Math.ceil((pm.end-now)/1000));
  if(changed){pm.noticeFive=false;if(A&&ensureNoticeState().notificationPrefs.pomo!==false)addNotification('pomo-phase:'+pm.end+':'+pm.ph,pm.ph==='b'?'pomo-break':'pomo-focus',{session:pm.n})}
  if(A&&pm.ph==='w'&&pm.w>5&&pm.left>0&&pm.left<=300&&!pm.noticeFive){pm.noticeFive=true;changed=true;if(ensureNoticeState().notificationPrefs.pomo!==false)addNotification('pomo-five:'+pm.end,'pomo-five')}

    persistPomodoroState();
    const card=pg==='pomo'?document.querySelector('.focus-history'):null;
    if(card){const open=card.querySelector('details')?.open;card.outerHTML=focusHistoryCard();if(open){const details=document.querySelector('.focus-history details');if(details)details.open=true}}
  }
  pi();swRender();
}
function pS(){
  prepareAudio();

      const at=Date.now(),seconds=Math.max(0,Math.floor((at-pm.segmentStart)/1000));

// V11: evidence of cloud history is never silently downgraded to a local account.
// A copied browser profile is NOT proof of an active authenticated cloud session.
function accountCloudHints(account){
  return !!(account && (account.authUid || account.accountOrigin==='cloud' ||
    account.googleConnected===true || account.loginMethod==='google' || account.loginMethod==='password'));
}
function accountConnection(account=A){
  if(!account)return 'unknown';
  if(accountCloudHints(account)){
    const session=sbSession();
    return account.authUid && session?.access_token && session.user?.id===account.authUid ? 'cloud' : 'unknown';
  }
  return account.accountOrigin==='local' && typeof account.pw==='string' && account.pw.length>0
    ? 'local' : 'unknown';
}
function accountConnectionHtml(account=A){
  const kind=accountConnection(account);
  const textByKind={
    cloud:tr()?['Bulut profili — oturum bağlı','Bulut hesabına ilişkin işlemler sunucuda ayrıca doğrulanır.']:
       ['Cloud profile — session present','Cloud account actions are independently authenticated by the server.'],
    local:tr()?['Eski yerel profil — yalnızca bu cihaz','Bu profilin silinmesi Supabase veya Google hesabını silmez.']:
       ['Legacy local profile — this device only','Removing this profile does not delete any Supabase or Google account.'],
    unknown:tr()?['Hesap bağlantısı doğrulanamadı','Bu profili yanlışlıkla yerel hesap olarak silmeyeceğiz. Önce çıkış yapıp doğru yöntemle yeniden giriş yap.']:
       ['Account connection unverified','We will not assume this is a local account. Sign out and sign in again with the right method.']
  };

}

async function setGoogleAccountPassword(scope='settings'){
  if(settingGooglePassword||!A?.authUid||A.loginMethod!=='google')return;
  const prefix=scope==='profile'?'prof-':'';
  const passEl=document.getElementById(prefix+'google-app-pass');
  const confirmEl=document.getElementById(prefix+'google-app-pass-confirm');
  const password=String(passEl?.value||''),confirm=String(confirmEl?.value||'');
  const error=pwOk(password,A.u);
  if(error){toast(error);return}
  if(password!==confirm){toast(tr()?'Şifreler eşleşmiyor.':'Passwords do not match.');return}
  settingGooglePassword=true;
  const button=document.getElementById(prefix+'google-app-pass-submit');
  if(button)button.disabled=true;
  try{
    // Local profile metadata is NOT proof of identity. Revalidate the Auth user.
    const user=await sbCurrentUser();
    if(!user?.id||user.id!==A.authUid)throw new Error('Identity mismatch');
    const updated=await sb('/auth/v1/user',{method:'PUT',body:{password}});
    if(!updated?.id||updated.id!==A.authUid)throw new Error('Password update unverified');
    // Do not cache or sync the password. Supabase Auth owns it.
    if(passEl)passEl.value='';
    if(confirmEl)confirmEl.value='';
    msg=tr()?'Uygulama şifresi belirlendi. Artık aynı e-posta ve yeni şifreyle manuel giriş yapabilirsin. Google girişi de çalışır.':'App password saved. You can now sign in with your email and new password. Google sign-in still works.';
    if(scope==='profile'){toast(msg);msg=''}else P.set();
  }catch(e){
    if(passEl)passEl.value='';
    if(confirmEl)confirmEl.value='';
    toast(tr()?'Şifre kaydedilemedi. Google ile yeniden giriş yapıp tekrar dene; güvenlik doğrulaması isteniyor olabilir.':'Could not save the password. Sign in with Google again and retry; additional verification may be required.');
  }finally{
    settingGooglePassword=false;
    const submit=document.getElementById(prefix+'google-app-pass-submit');
    if(submit)submit.disabled=false;
  }
}
async function chPw(scope='settings'){
  const prefix=scope==='profile'?'prof-':'';
  const oldPass=String(document.getElementById(prefix+'op')?.value||'');
  const newPass=String(document.getElementById(prefix+'np')?.value||'');
  const notify=(value)=>{if(scope==='profile')toast(value);else{msg=value;P.set()}};
  const problem=pwOk(newPass,A.u);if(problem){notify(problem);return}
  if(A.authUid){
    try{
      const email=A.email;const j=await sbSignIn(A.u,oldPass,email);
      if(!j?.user?.id||j.user.id!==A.authUid)throw new Error('Identity mismatch');
      sbSave({...j,at:Date.now()});
      await sb('/auth/v1/user',{method:'PUT',body:{password:newPass}});
      if(scope==='profile'){
        const old=document.getElementById('prof-op'),fresh=document.getElementById('prof-np');
        if(old)old.value='';if(fresh)fresh.value='';
      }
      notify(t('pwChanged'));
    }catch(_){notify(tr()?'Mevcut şifre yanlış veya sunucuya ulaşılamadı.':'Current password invalid or server unavailable.')}
    return;
  }
  if(!await pwMatch(A,oldPass)){notify(t('currentWrong'));return}
  await setPw(A,newPass);save();
  if(scope==='profile'){
    const old=document.getElementById('prof-op'),fresh=document.getElementById('prof-np');
    if(old)old.value='';if(fresh)fresh.value='';
  }
  notify(t('pwChanged'));
}

let accountDeletionBusy=false;
let pendingDeleteUid=null;
function accountDeletionMessage(code){
  const messages={
    UNAUTHORIZED:["Oturum doğrulanamadı. Hesabından çıkıp yeniden giriş yap.","Session could not be verified. Sign out and sign in again."],
    DELETION_DISABLED:["Hesap silme sunucuda henüz etkin değil. Şimdilik indirme özelliğini kullanabilirsin.","Server-side account deletion is not yet enabled. You can download your data."],
    RECENT_SIGN_IN_REQUIRED:["Güvenlik için yeniden giriş yapıp ardından işlemi tekrarla.","For security, sign in again before trying this action."],
    CONFIRMATION_REQUIRED:["Onay metni veya e-posta eşleşmedi.","The confirmation phrase or email did not match."],
    DELETE_FAILED:["Hesap silinemedi. Sunucu günlükleri kontrol edilmeli; Storage sahipliği de engel olabilir.","Account deletion failed. Check server logs; Storage ownership may block it."],
    ORIGIN_NOT_ALLOWED:["Bu site adresi sunucu izin listesinde değil.","This site origin is not allowed by the server."],
    SERVER_CONFIGURATION_ERROR:["Sunucu yapılandırması eksik; hiçbir hesap silinmedi.","The server is not configured; no account was deleted."],
    TIMEOUT:["İstek zaman aşımına uğradı. Hesap durumunu kontrol etmeden tekrar silmeyi deneme.","Request timed out. Verify account state before retrying deletion."],
    NETWORK:["Bağlantı kurulamadı. Daha sonra yeniden kontrol et.","Could not connect. Check again later."]
  };
  return (messages[code]||["İşlem doğrulanamadı. Hesap durumunu kontrol et.","Could not verify the action. Check account state."])[tr()?0:1];
}
async function accountFunction(action,fields={},retry=true){
  const session=sbSession();
  if(accountConnection(A)!=='cloud'||!session?.access_token||session?.user?.id!==A.authUid){
    const error=new Error('UNAUTHORIZED');error.code='UNAUTHORIZED';throw error;
  }
  const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),12000);
  try{
    const response=await fetch(SUPABASE_URL+'/functions/v1/delete-account',{
      method:'POST',headers:{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+session.access_token,'Content-Type':'application/json'},
      body:JSON.stringify({action,...fields}),signal:controller.signal,cache:'no-store'
    });
    let result=null;try{result=await response.json()}catch(_){}
    if(!response.ok){
      if(response.status===401&&retry&&await sbRefresh())return accountFunction(action,fields,false);
      const error=new Error(String(result?.code||'HTTP_'+response.status));error.code=result?.code||(response.status===401?'UNAUTHORIZED':'HTTP_'+response.status);throw error;
    }
    return result;
  }catch(e){
    if(e.name==='AbortError'){const error=new Error('TIMEOUT');error.code='TIMEOUT';throw error}
    if(e.code)throw e;
    const error=new Error('NETWORK');error.code='NETWORK';throw error;
  }finally{clearTimeout(timer)}
}
async function delAcc(){
  if(!A||accountDeletionBusy)return;
  if(A.authUid)return IYAccount.request('delete');
  pendingDeleteUid=null;
  const connection=accountConnection(A);
  if(connection==='unknown'){
    openModal('account-deletion-unknown',`<h2>${tr()?'Hesap bağlantısı doğrulanamadı':'Account connection unverified'}</h2><p class="account-data-alert">${tr()?'Bu profili yanlışlıkla yalnızca yerel saymayacağız. Hiçbir hesap veya veri silinmedi. Önce verilerini indir, sonra çıkış yapıp Google ya da e-posta/şifreyle yeniden giriş yap.':'We will not assume this is a local-only profile. No account or data was deleted. Export your data, sign out, then sign in again with Google or email/password.'}</p><button onclick="closeModal('account-deletion-unknown')">${tr()?'Anladım':'Got it'}</button>`);
    return;

function v13PristineCloudProfile(a, uid){

  if(a.pctFrom&&validProgressDate(a.pctFrom)&&a.pctFrom<PROGRESS_CUTOVER)return false;

    'u','nick','email','mail','phone','authUid','accountOrigin','loginMethod',
    'googleConnected','updatedAt','legacyMigrationId','legacyMigratedAt']);
  if(Object.keys(a).some(k=>!keys.has(k)))return false;
  if(a.legacyMigrationId||a.legacyMigratedAt||Number(a.progressState?.base)>1)return false;
  for(const key of ['tasks','backlog','projects','nc','uc','laps']){
    if(a[key]!=null&&(!Array.isArray(a[key])||a[key].length))return false;
  }
  for(const key of ['hist','future','futureMeta','plans','journal','activeDays','qs','ql','ver']){
    if(a[key]!=null&&(!a[key]||typeof a[key]!=='object'||Array.isArray(a[key])||Object.keys(a[key]).length))return false;
