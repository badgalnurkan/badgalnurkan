<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Improvin' your day</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6eee3">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Nunito:wght@400;600;700&display=swap">
<style>
:root{--bg:#f6eee3;--card:#fffaf3;--ink:#4a3426;--mut:#9a8068;--acc:#a9714b;--acc2:#e3c3a1;--ok:#6fa876;--no:#c76b5a;--ln:#ecdcc8;--sh:0 12px 32px #8a5a3a16;--fs:'Fraunces',Georgia,'Times New Roman',serif;--okbg:#e6f1e6}
:root[data-t=dark]{--bg:#221914;--card:#2e221b;--ink:#f3e8da;--mut:#b09a84;--acc:#d2a074;--acc2:#6b4a33;--ok:#7bbd83;--no:#d7796a;--ln:#40302a;--sh:0 12px 32px #0006;--okbg:#2a3a2c}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;scroll-padding-top:env(safe-area-inset-top,0px);font-size:clamp(16px,.35vw + 11px,24px);overflow-y:scroll}
@media(min-width:1600px){html{font-size:clamp(15.5px,.45vw + 11px,16px)}
/* mobil: okunakli taban olcu */
@media(max-width:600px){html{font-size:clamp(16px,4.4vw,17.5px)}}
@media(max-width:360px){html{font-size:16px}}}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Nunito',system-ui,-apple-system,'Segoe UI',Roboto,Ubuntu,sans-serif;line-height:1.6;transition:background .4s,color .4s;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
#app{display:flex;flex-direction:column;flex:1;width:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{background:var(--acc);color:#fff;border:0;border-radius:999px;padding:.6em 1.4em;min-height:2.75rem;font-weight:600;cursor:pointer;box-shadow:0 4px 14px #a9714b33;transition:transform .2s,box-shadow .2s,background .3s;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button:hover{transform:translateY(-1px);box-shadow:0 6px 18px #a9714b44}
button.g{background:transparent;border:1.5px solid var(--ln);color:var(--ink);box-shadow:none}
button.g:hover{border-color:var(--acc)}
button.s{min-height:2.2rem;padding:.25em .9em;font-size:.82rem}
button.d{color:var(--no);border-color:var(--no)}
button:disabled{opacity:.35;cursor:not-allowed;transform:none}
input,select,textarea{background:var(--bg);border:1.5px solid var(--ln);border-radius:16px;padding:.7em 1.1em;width:100%;margin:.3em 0 .8em;font-size:max(16px,1rem);transition:border .3s}
textarea{resize:vertical}
input:focus,textarea:focus{outline:0;border-color:var(--acc)}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
label{font-size:.9rem;font-weight:600}
.shell{display:flex;flex:1;max-width:80rem;margin:0 auto;width:100%;align-items:flex-start;padding:0 1rem;gap:1.2rem}
aside{width:16rem;background:var(--card);margin:1.2rem 0;border-radius:24px;box-shadow:var(--sh);padding:1.4rem 1rem;display:flex;flex-direction:column;gap:.3rem;transition:background .4s;flex-shrink:0;position:sticky;top:1rem}
aside .lg{font-family:var(--fs);font-weight:700;font-size:1.4rem;line-height:1.2;color:var(--acc);margin-bottom:1rem;word-break:break-word;cursor:pointer;padding:0 .5rem}
aside .lg small{display:block;font-family:'Nunito',system-ui,sans-serif;font-size:.8rem;font-weight:600;color:var(--mut);margin-bottom:.2rem}
aside a{padding:.7em 1rem;border-radius:999px;cursor:pointer;color:var(--mut);font-weight:600;font-size:.95rem;transition:all .25s;-webkit-tap-highlight-color:transparent}
aside a:hover{background:var(--bg);color:var(--ink)}
aside a.on{background:var(--acc);color:#fff;box-shadow:0 4px 14px #a9714b33}
aside a.press{transform:scale(.96);background:color-mix(in srgb,var(--acc) 22%,transparent)}
aside a{transition:background .22s ease,color .22s ease,transform .16s ease}
aside a.on{font-weight:800;letter-spacing:.005em}
@supports not (background:color-mix(in srgb,red,blue)){aside a.press{background:var(--bg)}}
main{transition:opacity .18s ease}
main.swap{opacity:.45}
main.an{animation:pgIn .32s cubic-bezier(.2,.7,.2,1) both}
@keyframes pgIn{from{opacity:0;transform:translate3d(0,var(--pg-dy,8px),0)}to{opacity:1;transform:none}}
@media(max-aspect-ratio:3/4){main{--pg-dy:10px}}
@media(min-aspect-ratio:16/10){main{--pg-dy:6px}}
@media(prefers-reduced-motion:reduce){main.an{animation:none}}
aside a{transition:background .22s ease,color .22s ease,transform .16s ease,box-shadow .22s ease}
main{flex:1;min-width:0;padding:1.2rem 0;max-width:54rem;margin:0 auto;width:100%;animation:fi .3s ease;display:flex;flex-direction:column;gap:1.2rem}
@keyframes fi{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
header.top{display:flex;justify-content:space-between;align-items:center;gap:.6rem;padding:.9rem 1.5rem;background:var(--card);border-bottom:1px solid var(--ln);color:var(--mut);font-size:.95rem;transition:all .4s;position:relative}
header.top b{font-family:var(--fs);font-size:1.15rem;color:var(--acc);cursor:pointer}
.lv2 header.top,.lv3 header.top,.lv4 header.top{background:linear-gradient(90deg,var(--card),var(--bg));border-bottom:2px solid var(--acc)}
.lv3 .card,.lv4 .card{box-shadow:0 14px 40px #8a5a3a2a}
.lv4 aside .lg{letter-spacing:.06em}
.card{background:var(--card);border:1px solid var(--ln);border-radius:24px;box-shadow:var(--sh);padding:1.5rem;transition:all .3s}
h1,h2,h3{font-family:var(--fs);font-weight:600;margin:.2em 0 .5em}
h1,h2{font-size:1.3rem}h3{font-size:1.05rem}
.mut{color:var(--mut)}
.row{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center}
.row>input{flex:1;min-width:8rem;margin:0}
.center{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:clamp(1rem,3vw,1.5rem);width:100%}
.welcome-screen{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;justify-content:space-between;padding:1.5rem;position:relative}
/* ust satir: marka solda, tema sagda — mobilde ust uste binmez */
.welcome-top{display:flex;align-items:center;justify-content:space-between;gap:.6rem;flex-wrap:wrap}
.welcome-top .themebar{margin:0!important;justify-content:flex-end!important}
@media(max-width:600px){
  .welcome-screen{padding:1rem}
  .welcome-top{gap:.35rem}
  .welcome-top .brand-badge{font-size:1.05rem}
  .welcome-top .themebar button{padding:.3em .7em;font-size:.72rem;min-height:2rem}
  .welcome-top .themebar small{display:none}
}
@media(max-width:360px){.welcome-top .themebar button{padding:.28em .55em;font-size:.68rem}}
.brand-badge{font-family:var(--fs);font-weight:700;font-size:1.2rem;color:var(--acc);letter-spacing:.05em}
.welcome-center{display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;margin:auto;max-width:30rem;width:100%;padding:1rem 0}
.welcome-footer-bar{display:flex;justify-content:space-between;align-items:flex-end;width:100%;font-size:.85rem;color:var(--mut);gap:1rem}
.social-links{display:flex;flex-direction:column;text-align:right;gap:.2rem}
.social-links a{color:var(--mut);text-decoration:none;transition:color .2s}
.social-links a:hover{color:var(--acc)}
.box{max-width:26rem;width:100%;text-align:left}
/* giris/kayit kutusu: dengeli en-boy orani (ekrani kaplamaz, kucuk de kalmaz) */
.login-wrap{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:1.2rem;gap:.4rem}
.login-wrap>.langbar,.login-wrap>.themebar{max-width:26rem;margin:0 auto}
.login-wrap .box{max-width:clamp(20rem,34vw,27rem)}
/* ust serit: solda tema, sagda dil; ikisi ayni hizada ve kutu kenarlarina simetrik */
.login-top{width:100%;max-width:clamp(20rem,34vw,27rem);margin:.2rem auto .7rem;display:flex;align-items:center;justify-content:space-between;gap:.6rem}
.login-top .themebar{display:flex;flex-wrap:nowrap;align-items:center;gap:.3rem!important;margin:0!important;justify-content:flex-start!important;width:auto}
.login-top .themebar>small{margin:0 .15rem 0 0!important}
.login-top .themebar button,.login-top .langbar button{min-height:2.1rem;padding:.3em .8em;font-size:.8rem;line-height:1}
.login-top .langbar{display:flex;flex-wrap:nowrap;gap:.3rem;width:auto;margin:0;justify-content:flex-end}
.login-top .langbar button{min-width:2.6rem;padding:.3em .65em}
@media(min-width:901px) and (min-aspect-ratio:1/1){.login-top{max-width:clamp(21rem,26vw,26rem)}}
@media(min-width:601px) and (max-width:1024px){.login-top,.login-wrap .box{max-width:min(26rem,86vw)}}
@media(max-width:600px){.login-top{max-width:100%;margin:.1rem auto .6rem}}
@media(max-width:380px){
  .login-top{gap:.35rem}
  .login-top .themebar>small{display:none}
  .login-top .themebar button,.login-top .langbar button{padding:.28em .6em;font-size:.74rem;min-height:2rem}
  .login-top .langbar button{min-width:2.3rem}
}
@media(max-height:500px) and (orientation:landscape){.login-top{max-width:min(26rem,90vw);margin:.1rem auto .4rem}.login-wrap{padding-top:.5rem}}
@media(min-width:901px) and (min-aspect-ratio:1/1){
  .login-wrap .box{max-width:clamp(21rem,26vw,26rem)}
  .login-wrap .box input{font-size:.98rem;padding:.62em 1em;margin:.25em 0 .7em}
  .login-wrap .box h2{font-size:1.2rem;margin-bottom:.6rem}
}
@media(max-height:640px){.login-wrap{justify-content:flex-start;padding-top:.6rem}}
/* simetri: ust serit ile giris kutusu ayni genislik ve ayni kenar (en-boy oranina gore) */
.login-wrap{--lw:clamp(20rem,34vw,27rem)}
@media(min-width:901px) and (min-aspect-ratio:1/1){.login-wrap{--lw:clamp(21rem,26vw,26rem)}}
@media(min-width:601px) and (max-width:1024px){.login-wrap{--lw:min(26rem,86vw)}}
@media(max-width:600px){.login-wrap{--lw:100%;padding-left:clamp(.75rem,4vw,1.2rem);padding-right:clamp(.75rem,4vw,1.2rem)}}
@media(max-height:500px) and (orientation:landscape){.login-wrap{--lw:min(26rem,90vw)}}
.login-wrap .center{padding:0;min-height:auto;width:100%}
.login-wrap .login-top,.login-wrap .box{width:100%;max-width:var(--lw)!important;box-sizing:border-box}
.big{font-family:var(--fs);font-size:clamp(2.2rem,7vw,4.2rem);font-weight:600;letter-spacing:.04em;line-height:1.1;text-align:center;margin:.2em 0 .4em;color:var(--ink)}
.task{display:flex;align-items:center;gap:.7rem;padding:.8rem 1rem;background:var(--bg);border:1.5px solid var(--ln);border-radius:16px;margin:.5rem 0;transition:all .4s}
.task span{flex:1;min-width:0;overflow-wrap:anywhere;transition:color .4s}
.task.done{background:var(--okbg);border-color:var(--ok)}
@supports(background:color-mix(in srgb,red,blue)){.task.done{background:color-mix(in srgb,var(--ok) 16%,var(--card))}}
.task.done span{color:var(--ok);text-decoration:line-through}
.task.miss{border-color:var(--no);opacity:.85}
.task.shake{animation:sh .45s}
@keyframes sh{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.ck,.xx{width:2.5rem;height:2.5rem;min-height:0;padding:0;border-radius:50%;background:transparent;border:2px solid var(--ln);color:var(--mut);box-shadow:none;transition:all .35s;flex-shrink:0}
.ck.on{background:var(--ok);border-color:var(--ok);color:#fff}
.xx.on{background:var(--no);border-color:var(--no);color:#fff}
.cal{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:1rem;justify-content:center}
.dot{width:3.2rem;height:3.2rem;border-radius:16px;background:var(--ln);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:.65rem;cursor:pointer;transition:all .25s;color:var(--mut);gap:1px;border:0;padding:0;min-height:0;box-shadow:none}
.dot span{font-size:.9rem;font-weight:700}
.dot small{font-size:.55rem;opacity:.85;text-transform:uppercase}
.cal .dot{height:3.75rem}
.dot em.dpct{font-style:normal;font-size:.6rem;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;opacity:.95}
@media(max-aspect-ratio:3/4){.cal .dot{height:calc(clamp(2.2rem,13vw,3rem) + .7rem)}}
.dot.ok{background:var(--ok);color:#fff}
.dot.miss-dot{background:var(--mut);color:#fff;opacity:.75}
.dot.td{outline:2px solid var(--acc);outline-offset:2px}
.dot:hover{transform:scale(1.08)}
.bar{height:.65rem;background:var(--ln);border-radius:10px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);transition:width .6s}
.tm{font-family:var(--fs);font-size:clamp(2.6rem,8vw,5rem);font-weight:600;color:var(--acc);text-align:center;font-variant-numeric:tabular-nums}
.tag{display:flex;align-items:center;justify-content:space-between;gap:.5rem;flex-wrap:wrap;background:var(--bg);border:1.5px solid var(--ln);border-radius:14px;padding:.5rem 1rem;margin:.3rem 0;font-size:.95rem}
.tag.on{border-color:var(--acc)}
.note{background:var(--bg);border:1px dashed var(--acc);border-radius:12px;padding:.6em 1em;margin:.5em 0;font-size:.9rem}
.qa{display:flex;gap:.5rem;align-items:flex-start}
.qa textarea{margin:0;flex:1}
.qcap{text-align:right;font-size:.78rem;margin:.2rem 0 .8rem}
.pct-big{font-family:var(--fs);font-size:clamp(2.4rem,8vw,4rem);font-weight:700;color:var(--acc);line-height:1}
footer{text-align:center;padding:1rem;color:var(--mut);font-size:.8rem;background:var(--card);border-top:1px solid var(--ln);width:100%;margin-top:auto}
#ck[hidden]{display:none}
#ck{position:fixed;left:1rem;right:1rem;bottom:calc(1rem + env(safe-area-inset-bottom,0px));z-index:99;background:var(--card);border:1px solid var(--acc);border-radius:14px;padding:1rem;display:flex;gap:.8rem;flex-wrap:wrap;align-items:center;justify-content:space-between;max-width:42rem;margin:auto;box-shadow:var(--sh)}
.mini-popup{display:none;position:fixed;top:0;left:0;right:auto;background:var(--card);border:1px solid var(--ln);border-radius:18px;padding:clamp(.7rem,2vw,1rem);box-shadow:0 18px 50px #00000055;z-index:99999;width:min(20rem,calc(100vw - 1.2rem));max-height:min(78vh,34rem);overflow:auto;text-align:center;-webkit-overflow-scrolling:touch;touch-action:manipulation}
#mini-backdrop{position:fixed;inset:0;background:transparent;z-index:99998}
#mini-backdrop[hidden]{display:none}
.mini-cal-grid{display:flex;flex-wrap:wrap;gap:.3rem;margin-top:.5rem;justify-content:center}
.mini-dot{position:relative;width:2rem;height:2rem;border-radius:50%;background:var(--ln);display:grid;place-items:center;font-size:.7rem;color:var(--mut)}
.mini-dot.td{outline:2px solid var(--acc);font-weight:700;color:var(--acc)}
.mini-dot::after{content:attr(data-day);position:absolute;bottom:125%;left:50%;transform:translateX(-50%) translateY(4px);background:var(--ink);color:var(--bg);font-size:.65rem;padding:3px 7px;border-radius:6px;white-space:nowrap;opacity:0;visibility:hidden;transition:opacity .25s,transform .25s,visibility .25s;pointer-events:none;z-index:100}
.mini-dot:hover::after{opacity:1;visibility:visible;transform:translateX(-50%)}
/* mini takvim (header sag ust): sayinin uzerine gelince yumusak fade-in / fade-out + acik bej */
.mini-dot{transition:background .45s ease,color .45s ease,box-shadow .45s ease,opacity .45s ease,transform .45s ease,filter .45s ease}
.mini-cal-grid .mini-dot:hover,.mini-cal-grid .mini-dot.lit{background:#f7ecdc;color:#a8845c;box-shadow:0 6px 16px #8a5a3a33;transform:translateY(-1px) scale(1.12)}
.mini-cal-grid .mini-dot span{transition:color .45s ease}
.mini-cal-grid .mini-dot:hover span,.mini-cal-grid .mini-dot.lit span{color:#a8845c}
.mini-dot.future{background:transparent;border:1.5px dashed var(--ln);color:var(--mut);opacity:.6}
.mini-dot.fog{background:var(--ln);color:var(--mut);opacity:.5;filter:blur(.6px) saturate(.4)}
.mini-cal-grid .mini-dot.fog:hover,.mini-cal-grid .mini-dot.fog.lit{filter:none;opacity:1}
.mini-dot.note{position:relative}
.mini-dot span{font-weight:600;font-size:.72rem;line-height:1}
.mini-dot small{display:none}
.mini-dot.note::before{content:'•';position:absolute;top:-2px;right:1px;font-size:.6rem;color:var(--acc)}
#top-date-trigger{transition:color .35s,background .35s,box-shadow .35s,transform .35s;padding:.25em .7em;border-radius:999px;display:inline-flex;align-items:center;gap:.35em}
#top-date-trigger:hover{color:var(--acc);background:var(--bg);transform:translateY(-1px)}
#top-date-trigger.lit{color:#7a5636;background:#f7ecdc;box-shadow:0 6px 18px #8a5a3a2a}
#top-date-trigger small{font-size:.72rem;opacity:.85;font-weight:600}
.mini-popup{animation:mpIn .32s cubic-bezier(.2,.7,.2,1) both}
/* TV / uzaktan kumanda ve klavye: odak gorunur, hedefler buyuk */
aside a:focus-visible,button:focus-visible,.dot:focus-visible,.mini-dot:focus-visible{outline:3px solid var(--acc);outline-offset:3px}
@media(min-width:1700px) and (min-aspect-ratio:16/9){
html{font-size:16px}html{font-size:16px}aside{width:18.5rem}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
/* mobil menu: takilma/jitter yok, dokunma hedefleri buyuk, smooth kaydirma */
aside{-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;touch-action:pan-x;scroll-behavior:smooth;scrollbar-width:none}
aside::-webkit-scrollbar{display:none}
aside a{flex:0 0 auto;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
@media(hover:none),(pointer:coarse){
  aside a:hover{transform:none;background:transparent;color:var(--mut)}
  aside a.on:hover{background:var(--acc);color:#fff}
  aside a{padding:.55em 1.05em;min-height:2.75rem;height:2.75rem;display:flex;align-items:center;justify-content:center;line-height:1;font-size:.92rem}
  aside{gap:.35rem;scroll-padding-inline:.4rem;scroll-snap-type:x proximity}
}
::view-transition-old(root){animation:none}
::view-transition-new(root){animation:vtIn .28s ease both}
@keyframes vtIn{from{opacity:.35;transform:translateY(6px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){::view-transition-new(root){animation:none}}
/* ---- tum cihazlarda ayni gecisler: TV, telefon, tablet, dokunmatik ---- */
.emenv{display:flex;justify-content:center;gap:.5rem;flex-wrap:wrap;margin-bottom:.6rem}
.row{row-gap:.5rem}
.card,.task,.tag,.note{max-width:100%;overflow-wrap:anywhere}
[role=button]{-webkit-user-select:none;user-select:none}
@media(hover:none),(pointer:coarse){
  button,a[role=button],.dot,.mini-dot,.ck,.xx{min-height:2.9rem}
  button.s,.ck,.xx,.dot{min-height:2.6rem}
  button:hover,a[role=button]:hover{transform:none;box-shadow:none}
  aside a:hover{background:transparent;color:var(--mut)}

  .dot:hover{transform:none}
}
/* telefon */

  .shell{padding:0 .6rem}
  .card{padding:1rem;border-radius:18px}
  h1,h2{font-size:1.15rem}

  header.top{flex-wrap:wrap;row-gap:.3rem}

  aside{width:13.5rem}

}

  button{min-height:2.9rem;padding:.6em 1.45em}

  .dot{width:3.2rem;height:3.2rem}

}
/* TV: uzaktan kumanda icin buyuk hedefler, ama yazi boyu sabit */
@media(min-height:1000px) and (min-aspect-ratio:16/9) and (pointer:coarse){
  button{min-height:3.25rem;padding:.7em 1.6em}

}
@media(min-width:2400px){.shell{max-width:92rem}main{max-width:60rem}}
:focus-visible{outline:3px solid var(--acc);outline-offset:3px}
/* ---- cihaza gore ince ayar (data-dev) ---- */
html[data-dev=phone] .shell{padding:0 .55rem}

<div id="ck" hidden>
  <span>Do you accept cookies? If you accept, your data is stored on this device permanently; if you decline, it is kept only while this tab stays open.</span>

</div>
<script>
const $=s=>document.querySelector(s),pad=n=>String(n).padStart(2,'0');
const TITLE="Improvin' your day";
/* ---- kalici depo: localStorage oncelikli, olmazsa bellek ici yedek (Safari gizli mod / dosya:// ) ---- */
const MEM={};
const store=()=>{try{const t='__t'+Math.random();localStorage.setItem(t,'1');localStorage.removeItem(t);return localStorage}catch(e){return null}};
const LSK='b1', OTURUM='b1s', FEEDB='b1f', LOCAL_OTURUM='b1.this';
function getItem(k){try{const s=store();if(s){const v=s.getItem(k);if(v!==null)return v}}catch(e){}return MEM[k]===undefined?null:MEM[k]}
function setItem(k,v){MEM[k]=v;try{const s=store();if(s){s.setItem(k,v);return true}}catch(e){}return false}
let DB=null;
let DBraw=null;try{DBraw=JSON.parse(getItem(LSK)||'')}catch(e){}
/* veri kaybina karsi yedek: her acilista son iyi kayit ayri tutulur */
let DBbak=null;try{DBbak=JSON.parse(getItem('b1.bak')||'')}catch(e){}
if((!DBraw||!DBraw.accounts||!Object.keys(DBraw.accounts).length)&&DBbak&&DBbak.accounts&&Object.keys(DBbak.accounts).length)DBraw=DBbak;
DB=DBraw&&DBraw.accounts?DBraw:{accounts:{},last:'',lastUser:'',lock:{},lang:'en',beige:false};
if(!DB.lang)DB.lang='en';if(DB.beige===undefined)DB.beige=false;if(!DB.lastUser)DB.lastUser='';
document.documentElement.lang=DB.lang;
let pushT=null;
function schedulePush(){try{clearTimeout(pushT)}catch(e){}pushT=setTimeout(()=>{try{sbPush()}catch(e){}},2500)}
const save=()=>{
  try{
    if(A)A.updatedAt=Date.now();
    DB.savedAt=Date.now();
    setItem(LSK,JSON.stringify(DB));
    touchSession();
    schedulePush();
  }catch(e){}
};
/* oturum: kullanici bilgisi kucuk ve ayri tutulur -> ana kayit bozulsa da geri donus var */
function touchSession(){
  try{
    const u=A?A.u:(DB.lastUser||'');if(!u)return;
    const body=JSON.stringify({user:u,sig:signature(A||DB.accounts[u]),at:Date.now()});
    setItem(OTURUM,body);setItem(LOCAL_OTURUM,body);
  }catch(e){}
}
/* imza: menude/acik sayfada oturumu geri yuklemek icin (sifre yerine ozet) */
const signature=a=>a?(a.pw||'').slice(0,24)+':'+String(a.u||''):'';
function ck(v){setItem('b1ck',String(v));$('#ck').hidden=true;save()}
/* her kayitta kucuk bir yedek tut (kaza/bug ile veri kaybini engeller) */
function backupTick(){try{const raw=getItem(LSK);if(!raw)return;const parsed=JSON.parse(raw);if(parsed&&parsed.accounts&&Object.keys(parsed.accounts).length){setItem('b1.bak',raw);setItem('b1.bak.at',String(Date.now()))}}catch(e){}}
setInterval(backupTick,20000);
window.addEventListener('beforeunload',backupTick);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')backupTick()});
try{if(getItem('b1ck')===null)$('#ck').hidden=false}catch(e){}
const sysTheme=()=>(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';
document.documentElement.dataset.t=sysTheme();
try{if(JSON.parse(getItem(LSK)||'{}').beige)document.documentElement.dataset.t='beige'}catch(e){}
let A=null,A0=null,view='welcome',pg='home',calOff=0,selDay=null,msg='',codes={},lastSig='';
/* yenileme / yeni sekme: son kullanici + acik sayfa geri gelir, veriler korunur */
function readJson(k){try{return JSON.parse(getItem(k)||'null')}catch(e){return null}}
function restoreSession(){
  try{
    const cands=[readJson(OTURUM),readJson(LOCAL_OTURUM)];
    let user='';
    for(const c of cands){if(c&&c.user&&findUser(c.user)){user=findUser(c.user);break}}
    if(!user&&DB.lastUser&&findUser(DB.lastUser))user=findUser(DB.lastUser);
    if(!user){const ks=Object.keys(DB.accounts);if(ks.length===1)user=ks[0]}
    if(!user)return false;
    A=norm(DB.accounts[user]);lastSig=signature(A);
    loginDat.u=user;
    if(cloud()&&!sbSession())sbRefresh();
    const st=history.state;
    view='app';pg=(st&&st.v==='app'&&st.p)?st.p:'home';
    applyTheme();touchSession();
    return true;
  }catch(e){return false}
}
/* baska sekmede yapilan degisiklik bu sekmeye de yansir (veri ayrismasi olmaz) */
window.addEventListener('storage',e=>{
  if(e.key!==LSK||!e.newValue)return;
  let nd;try{nd=JSON.parse(e.newValue)}catch(_){return}
  if(!nd||!nd.accounts)return;
  DB=nd;
  const u=loginDat.u||DB.lastUser;
  if(!A&&u&&DB.accounts[u]){A=norm(DB.accounts[u]);applyTheme();if(view!=='app'){view='app';pg='home'}renderAppOrAuth();return}
  if(A&&DB.accounts[A.u]){A=nd.accounts[A.u];applyTheme();if(document.querySelector('aside')){const m=$('#mn');const had=m?m.innerHTML:'';shell()}return}
  renderAppOrAuth();
});
/* geri tusu: oturum acikken cikis ekranina dusmesin */

let formDat={u:'',n:'',b:'',e:'',t:'',p:''},loginDat={u:'',p:''};

function paint(){renderAppOrAuth()}
/* yumusak sayfa gecisi: destekleyen tarayicida View Transitions, digerlerinde ayni davranis */
function softPaint(){
  const canVT=document.startViewTransition&&document.visibilityState==='visible'&&!window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(canVT){
    try{
      const t=document.startViewTransition(()=>paint());
      if(t&&t.finished&&t.finished.catch)t.finished.catch(()=>{});
      if(t&&t.ready&&t.ready.catch)t.ready.catch(()=>{});

    }catch(e){}
  }

}
function goTo(v,p,push=true){
  const same=A&&v==='app'&&view==='app'&&document.getElementById('mn')&&document.querySelector('#nav-aside,aside');
  view=v;pg=p;msg='';selDay=null;

  softPaint();window.scrollTo(0,0);

/* menu gecisi: header ve menu yerinde kalir, yalnizca sayfa icerigi yumusakca degisir */
function swapPage(){
  const aside=document.querySelector('aside');
  if(aside){aside.querySelectorAll('a[data-k]').forEach(a=>{const on=a.dataset.k===pg;a.classList.toggle('on',on);if(on)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')})}
  if(pg!=='pomo'||!pm.run)document.title=TITLE;
  const y=window.scrollY;
  renderPage();
  if(pg!=='pomo'&&y>0){try{window.scrollTo({top:0,behavior:'smooth'})}catch(e){window.scrollTo(0,0)}}
  centerNav();
}
/* mobil/tablet: secilen sekme yatay menude ortalanir, sayfa ziplamaz */
function centerNav(){
  const aside=document.querySelector('aside'),on=aside&&aside.querySelector('a.on');
  if(!aside||!on||aside.scrollWidth<=aside.clientWidth+2)return;
  const left=on.offsetLeft-(aside.clientWidth-on.offsetWidth)/2;
  try{aside.scrollTo({left:Math.max(0,left),behavior:'smooth'})}catch(e){aside.scrollLeft=Math.max(0,left)}

window.addEventListener('popstate',e=>{
  if(A)return;

});
try{if(!history.state)history.replaceState({v:view,p:pg},'','')}catch(e){}
document.addEventListener('keydown',e=>{
  const t=e.target;
  if((e.key==='Enter'||e.key===' ')&&t&&t.getAttribute&&t.getAttribute('role')==='button'){e.preventDefault();t.click()}
});

const D=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>D(new Date()),fmt=s=>{const[y,m,d]=s.split('-');return d+'.'+m};

/* sifre: PBKDF2 + tuz (yeni kayitlar), eski kayitlar icin geriye donuk dogrulama */
async function hashPw(p,salt){
  salt=salt||rndHex(16);
  try{
    const key=await crypto.subtle.importKey('raw',new TextEncoder().encode(p),'PBKDF2',false,['deriveBits']);
    const bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt:new TextEncoder().encode(salt),iterations:120000,hash:'SHA-256'},key,256);
    return {pw:'p2$'+salt+'$'+[...new Uint8Array(bits)].map(x=>x.toString(16).padStart(2,'0')).join(''),salt};
  }catch(e){return {pw:'p1$'+salt+'$'+await sha(salt+'|'+p),salt}}
}
async function pwMatch(a,p){
  if(!a||!a.pw)return false;
  const v=String(a.pw);
  if(v.indexOf('p2$')===0||v.indexOf('p1$')===0){const r=await hashPw(p,v.split('$')[1]);return r.pw===v}
  return v===await sha(p);
}

function detectDevice(){
  const w=innerWidth,h=innerHeight,coarse=window.matchMedia('(pointer:coarse)').matches||(navigator.maxTouchPoints||0)>1;
  const short=Math.min(w,h),long=Math.max(w,h);
  let dev='desktop';
  /* telefon/tablet: kisa kenar + dokunmatik; TV: buyuk ekran; masaustu: geri kalan */
  if(short<=600&&(coarse||short<=480))dev='phone';
  else if(short<=900&&coarse)dev='tablet';
  else if(short<=1024&&long<=1400)dev='tablet';
  else if(coarse&&long>1024)dev='tv';
  else if(long>=1700)dev='desktop-xl';
  else if(long<=900)dev='mobile-narrow';
  document.documentElement.dataset.dev=dev;
  document.documentElement.dataset.orient=h>=w?'portrait':'landscape';
  return dev;
}

async function login(){
  let typed=loginDat.u.trim();
  /* e-posta ile giris: baska cihaz/tarayicida hesap bulutten bulunur */
  let typedMail='';
  if(typed.indexOf('@')>0){
    typedMail=typed.toLowerCase();
    const loc=Object.keys(DB.accounts).find(k=>String(DB.accounts[k].mail||DB.accounts[k].email||'').toLowerCase()===typedMail);
    typed=loc||typed.split('@')[0];
    loginDat.e=typedMail;
  }
  let u=typed||(skipRem?'':rememberedUser());
  loginDat.u=u;
  if(!u){msg=tr()?'Kullanıcı adını gir.':'Enter your username.';return renderAppOrAuth()}
  const key=findUser(u),k=(key||u).toLowerCase(),L=DB.lock[k]||{f:0,lv:0,until:0};
  if(Date.now()<L.until){msg=`${t('locked')} ${fmtMin(Math.ceil((L.until-Date.now())/60000))}.`;return renderAppOrAuth()}
  const a=key?DB.accounts[key]:null;
  /* --- bulut girisi: her cihazda ayni hesap --- */
  if(cloud()&&(!a||!a.pw)){
    try{
      let mail=String(loginDat.e||(a&&a.mail)||(a&&a.email)||'').toLowerCase();
      if(!mail){try{const r=await sb('/rest/v1/rpc/iydu_email',{method:'POST',body:{p_username:u}});if(typeof r==='string'&&r.indexOf('@')>0)mail=r.toLowerCase()}catch(_){}}
      const j=await sbSignIn(u,loginDat.p,mail);
      if(j&&j.access_token){
        const md=(j.user&&j.user.user_metadata)||{};
        if(md.username&&!a){const lu=findUser(md.username);u=lu||md.username}
        if(!mail&&j.user&&j.user.email)mail=String(j.user.email).toLowerCase();
        const data=await sbPull(u);
        const acc=data||norm({u,nick:(j.user&&j.user.user_metadata&&j.user.user_metadata.nick)||u});
        acc.u=u;acc.mail=mail||acc.mail;await setPw(acc,loginDat.p);
        DB.accounts[u]=acc;DB.last=acc.nick||u;DB.lastUser=u;
        DB.lock[k]={f:0,lv:L.lv,until:0};A=norm(acc);loginDat={u:'',p:''};lastSig=signature(acc);
        applyTheme();save();goTo('app','home');greetThen();
        toast(tr()?'Buluttan yüklendi.':'Loaded from the cloud.');return;
      }
    }catch(err){
      if(err.status===400||err.status===401){/* sifre/hesap bulutta yok: yerel yola dus */}
    }
  }
  if(a&&await pwMatch(a,loginDat.p)){
    DB.lock[k]={f:0,lv:L.lv,until:0};A=norm(a);DB.last=a.nick;DB.lastUser=a.u;lastSig=signature(a);loginDat={u:'',p:''};
    applyTheme();save();goTo('app','home');greetThen();return;
  }
  L.f++;
  if(L.f>=5){const long=L.lv>0;L.until=Date.now()+(long?5*3600000:30*60000);L.lv++;L.f=0;msg=long?(tr()?'5 hatalı deneme daha. 5 saat kilitli.':'5 more failed attempts. Locked for 5 hours.'):(tr()?'5 hatalı deneme. 30 dakika kilitli.':'5 failed attempts. Locked for 30 minutes.')}
  else msg=a?t('wrongLoginKnown').replace('{u}',a.nick||a.u)+' '+(5-L.f):`${t('wrongLogin')} ${5-L.f}`+(typedMail?'':(tr()?' — başka cihazda açtığın hesapsa e-postanla giriş yap.':' — if you created it on another device, sign in with your email.'));
  loginDat.e='';
  DB.lock[k]=L;save();renderAppOrAuth();
}

  a.mail=String(e||'').toLowerCase();A0=null;A=a;applyTheme();save();goTo('app','home');greetThen();
  if(cloudOK){sbPush();toast(tr()?'Bulut hesabı oluşturuldu, verilerin eşitleniyor.':'Cloud account created, syncing your data.');}

function repCard(title,per,a,b,pa,pb,key,nk,defs){

<h3 style="margin-top:1.2rem">${t('questionsFor')} ${per} ${ro?'🔒':''}</h3>${cur.length?qb(key,cur,ro)+(ro?'<p class="mut">'+t('answersLocked')+'</p>':`<button class="g s" onclick="lockQ('${key}',this)">${t('lockAnswers')}</button>`):`<p class="mut">${t('noQuestions')}${t('askedNext')} ${per}.</p>`}
<h3 style="margin-top:1.2rem">${tr()?'Sonraki':'Next'} ${per}</h3>${qb(nk,A.qs[nk],false)}<div class="row"><input id="nq-${nk}" maxlength="150" placeholder="${t('addOwnQuestion')}"><button class="s" onclick="addQ('${nk}')">${t('addQuestion')}</button><button class="g s" onclick="addRandQ('${nk}')">${t('randomQuestion')}</button></div></div>`;

function historySection(){
  const td=today();
  // haftalik ozet: bu hafta + gecen hafta
  const wNow=st(mon(td),td),wPrev=st(addD(mon(td),-7),addD(mon(td),-1));
  const wDiff=wNow.p-wPrev.p;
  const wTop=Object.entries(wNow.by).sort((a,b)=>b[1][1]-a[1][1])[0];
  // aylik ozet
  const x=new Date();
  const ma=D(new Date(x.getFullYear(),x.getMonth(),1)),mb=D(new Date(x.getFullYear(),x.getMonth()+1,0));
  const pma=D(new Date(x.getFullYear(),x.getMonth()-1,1)),pmb=D(new Date(x.getFullYear(),x.getMonth(),0));

<div style="margin-top:.6rem"><h3 style="margin:.2rem 0 .4rem">${tr()?'Bu hafta':'This week'} <span class="mut" style="font-size:.8rem">${fmt(mon(td))} – ${fmt(td)}</span></h3>
${briefRow(tr()?'Tamamlanan':'Completed',wNow.d+'/'+wNow.t+' · %'+wNow.p,(tr()?'Geçen hafta':'Last week')+' %'+wPrev.p+' ('+(wDiff>=0?'+':'')+wDiff+')')}
${wTop?briefRow(tr()?'En çok yaptığın':'Most frequent',esc(wTop[0]).slice(0,28),wTop[1][0]+'/'+wTop[1][1]):''}
${briefRow(tr()?'Kayıtlı gün':'Days recorded',weekDone+'/7')}</div>
<div style="margin-top:1.1rem"><h3 style="margin:.2rem 0 .4rem">${tr()?'Bu ay':'This month'} <span class="mut" style="font-size:.8rem">${monthName(x.getMonth())} ${x.getFullYear()}</span></h3>
${briefRow(tr()?'Tamamlanan':'Completed',mNow.d+'/'+mNow.t+' · %'+mNow.p,(tr()?'Geçen ay':'Last month')+' %'+mPrev.p+' ('+(mDiff>=0?'+':'')+mDiff+')')}
${briefRow(tr()?'Kayıtlı gün':'Days recorded',monthDone+'/'+(dd(ma,mb)+1))}</div></div>`;
}
P.rep=()=>{
  const td=today(),wa=mon(td),wb=addD(wa,6),x=new Date();
  const ma=D(new Date(x.getFullYear(),x.getMonth(),1)),mb=D(new Date(x.getFullYear(),x.getMonth()+1,0)),pma=D(new Date(x.getFullYear(),x.getMonth()-1,1)),pmb=D(new Date(x.getFullYear(),x.getMonth(),0));
  const mNext=D(new Date(x.getFullYear(),x.getMonth()+1,1)).slice(0,7);
  M(repCard(t('weeklyReport'),tr()?'hafta':'week',wa,wb,addD(wa,-7),addD(wa,-1),wa,addD(wa,7),defQ('week'))+repCard(t('monthlyReport'),tr()?'ay':'month',ma,mb,pma,pmb,ma.slice(0,7),mNext,defQ('month'))+historySection());
};

let pm={w:25,b:5,ph:'w',left:1500,run:0,end:0,n:0,iv:0,lg:0,sw:0,swT:0,swI:0,swMs:0};
const fmtDuration=m=>{if(m<60)return m+' '+t('minutes');const h=Math.floor(m/60),r=m%60;return r===0?h+(h==1?(tr()?' saat':' hour'):(tr()?' saat':' hours')):h+(tr()?' sa ':' h ')+r+' '+t('minutes')};
const ft=s=>pad(Math.floor(s/60))+':'+pad(s%60);
/* kronometre: milisaniye hassasiyetinde HH:MM:SS.mmm */
/* kronometre: toplam 3 hane (S.dss / SS.dss / M:SS.dss) - bastaki sifir yok */
const fms=ms=>{const h=Math.floor(ms/3600000),m=Math.floor(ms%3600000/60000),s=Math.floor(ms%60000/1000),x=Math.floor((ms%1000)/10);const pad2=n=>String(n).padStart(2,'0');if(h)return h+':'+pad2(m)+':'+pad2(s)+'.'+pad2(x);if(m)return m+':'+pad2(s)+'.'+pad2(x);return s+'.'+pad2(x)};
const clk=ms=>{const d=new Date(Date.now()+ms);return pad(d.getHours())+':'+pad(d.getMinutes())};
function beep(){try{const c=new(window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator();o.connect(c.destination);o.start();o.stop(c.currentTime+.35)}catch(e){}}
P.pomo=()=>{
  editIdx=-1;
  const pr=A.presets.map((p,i)=>`<div class="tag ${pm.w==p.w&&pm.b==p.b?'on':''}"><span role="button" tabindex="0" style="cursor:pointer;flex:1" onclick="setP(${p.w},${p.b})"><b>${fmtDuration(p.w)}</b> ${t('focus')} / <b>${fmtDuration(p.b)}</b> ${t('break')}</span><span class="row" style="gap:.3rem"><button class="g s" onclick="editP(${i})">${tr()?'Düzenle':'Edit'}</button><button class="g s d" onclick="delP(${i})">${t('delete')}</button></span></div>`).join('');
  M(`<div class="card"><div class="mut" style="text-align:center" id="pl"></div><div class="tm" id="pt">${ft(pm.left)}</div><div class="row" style="justify-content:center"><button onclick="pS()">${t('startPause')}</button><button class="g" onclick="pR()">${t('reset')}</button></div><p id="pi" class="mut" style="text-align:center"></p></div><div class="card"><h2>${t('focusAndBreak')}</h2>${pr||'<p class="mut">'+t('addLength')+'</p>'}<div class="row" style="margin-top:.7rem"><input id="cw" type="number" inputmode="numeric" min="1" max="600" placeholder="${t('focus')} (${t('minutes')})"><input id="cb" type="number" inputmode="numeric" min="1" max="600" placeholder="${t('break')} (${t('minutes')})"><button onclick="addP()">${tr()?'Ekle / Güncelle':'Add / Update'}</button></div><p class="mut" style="font-size:.85rem">${t('afterThree')}</p></div><div class="card"><h2>${t('stopwatch')}</h2><div class="tm" id="sw">${fms(pm.swT*1000)}</div><div class="row" style="justify-content:center"><button onclick="swS()">${t('startStop')}</button><button class="g" onclick="swR()">${t('reset')}</button></div></div>`);
  pi();
};
function pi(){
  const e=$('#pi'),l=$('#pl');if(!e)return;
  l.textContent=pm.ph==='w'?`${t('session')} ${pm.n%3+1}/3 · ${fmtDuration(pm.w)}`:(pm.lg?t('longBreak'):t('break'));
  e.textContent=pm.run?`${t('pomoEnds')}: ${clk(pm.left*1000)}`:(pm.w>60&&pm.ph==='w'?`${pm.w} ${t('minutes')} · ${t('alreadyEnds')} ${clk(pm.left*1000)}`:'');
}
function setP(w,b){clearInterval(pm.iv);pm={...pm,w,b,ph:'w',left:w*60,run:0,n:0,lg:0,iv:0};document.title=TITLE;P.pomo()}
let editIdx=-1;
function editP(i){const p=A.presets[i];$('#cw').value=p.w;$('#cb').value=p.b;editIdx=i}
function delP(i){A.presets.splice(i,1);save();P.pomo()}
function addP(){
  const w=Math.round(+$('#cw').value),b=Math.round(+$('#cb').value);
  if(w>0&&b>0&&w<=600&&b<=600){if(editIdx>=0){A.presets[editIdx]={w,b};editIdx=-1}else A.presets.push({w,b});save();setP(w,b)}
}
function pTick(){
  pm.left=Math.max(0,Math.round((pm.end-Date.now())/1000));
  const t2=$('#pt');if(t2)t2.textContent=ft(pm.left);
  if(A)document.title=ft(pm.left)+' · '+TITLE;
  if(pm.left<=0){
    beep();
    if(pm.ph==='w'){pm.n++;pm.ph='b';pm.lg=pm.n%3===0?1:0;pm.left=(pm.lg?Math.max(pm.b,...A.presets.map(p=>p.b)):pm.b)*60}
    else{pm.ph='w';pm.lg=0;pm.left=pm.w*60}
    pm.end=Date.now()+pm.left*1000;
  }
  pi();
}

function switchAcc(i){stopTimers();const k=Object.keys(DB.accounts)[i];A=null;loginDat={u:k,p:''};goTo('login','home')}
/* oturum kapaninca sayac ve kronometre durur, sonraki kullaniciya gecmez */
function stopTimers(){try{clearInterval(pm.iv);clearInterval(pm.swI);pm={...pm,run:0,iv:0,sw:0,swI:0,swT:0,ph:'w',left:pm.w*60,n:0,lg:0};document.title=TITLE}catch(e){}}
function goLogin(){stopTimers();A=null;loginDat={u:'',p:''};goTo('login','home')}
function chg(k){
  const key=k=='u'?'uc':'nc';
  if(left(key)<=0){msg=tr()?'Son 15 gündeki 5 değişiklik hakkının tamamını kullandın.':'You have used all 5 changes for the last 15 days.';return P.set()}
  const v=$(k=='u'?'#su':'#sn').value.trim();if(!v)return;
  if(k=='u'){
    if(!userRe.test(v)){msg=t('usernameRules');return P.set()}
    const ex=findUser(v);if(ex&&ex!==A.u){msg=t('usernameTaken');return P.set()}
    if(v===A.u)return;
    delete DB.accounts[A.u];A.u=v;DB.accounts[v]=A;
  }else{if(v===A.nick)return;A.nick=v}
  A[key].push(Date.now());DB.last=A.nick;save();msg=`${t('saved')} ${left(key)}`+(tr()?' değişiklik hakkı kaldı.':' changes left.');shell();
}
function vSend(k){
  const v=$('#s'+k).value.trim();
  if(k==='phone'&&!/^[0-9]{10,15}$/.test(v)){msg=t('phoneInvalid');return P.set()}
  if(k==='email'&&!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v)){msg=t('emailInvalid');return P.set()}
  A[k]=v;A.ver[k]=false;codes[k]=String(Math.floor(100000+Math.random()*900000));save();
  $('#vz').innerHTML=`<div class="note">${t('sendHint')} <b>${codes[k]}</b></div><div class="row"><input id="vc" inputmode="numeric" placeholder="${t('code')}"><button onclick="vOk('${k}')">${t('verify')}</button></div>`;
}
function vOk(k){if($('#vc').value===codes[k]){A.ver[k]=true;save();msg=t('verified')}else msg=t('wrongCode');P.set()}
async function chPw(){
  if(!await pwMatch(A,$('#op').value)){msg=t('currentWrong');return P.set()}
  const e=pwOk($('#np').value,A.u);if(e){msg=e;return P.set()}
  await setPw(A,$('#np').value);save();msg=t('pwChanged');P.set();
}
async function resetSys(){
  if(!await pwMatch(A,$('#rp').value)){msg=t('wrongPw');return P.set()}
  clearInterval(pm.iv);const a=newAcc(A.u,A.nick,A.bio,A.pw,A.email,A.phone);
  a.ver=A.ver;a.theme=A.theme;a.nc=A.nc;a.uc=A.uc;a.future=A.future;a.fog=A.fog;a.pctFrom=A.pctFrom;DB.accounts[A.u]=a;A=a;
  pm={...pm,w:25,b:5,ph:'w',left:1500,run:0,n:0,lg:0,iv:0};save();msg=t('systemReset');shell();
}
async function delAcc(){

  delete DB.accounts[A.u];A=null;DB.last='';DB.lastUser=Object.keys(DB.accounts)[0]||'';save();view='welcome';goTo('welcome','home');

const CLOUD_KEY='b1cloud', SESS_KEY='b1sb';
const cloud=()=>{try{return localStorage.getItem(CLOUD_KEY)!=='0'}catch(e){return true}};
const sbSession=()=>{try{return JSON.parse(getItem(SESS_KEY)||'null')}catch(e){return null}};
function sbSave(sess){try{setItem(SESS_KEY,JSON.stringify(sess))}catch(e){}}
function sbClear(){try{setItem(SESS_KEY,'')}catch(e){}}
/* tek giris noktasi: token yenileme + hata yonetimi */
async function sb(path,opt){
  opt=opt||{};
  const sess=sbSession();
  const h=Object.assign({'apikey':SUPABASE_KEY,'Content-Type':'application/json'},opt.headers||{});
  if(sess&&sess.access_token&&!/^\/auth\/v1\/(signup|token|otp)/.test(path))h['Authorization']='Bearer '+sess.access_token;
  const r=await fetch(SUPABASE_URL+path,{method:opt.method||'GET',headers:h,body:opt.body?JSON.stringify(opt.body):undefined});
  let j=null;try{j=await r.json()}catch(e){}
  if(!r.ok){
    const em=(j&&(j.msg||j.message||j.error_description||j.error))||('HTTP '+r.status);
    const err=new Error(em);err.status=r.status;err.code=j&&j.code;throw err;
  }
  return j;
}
/* e-posta/telefon -> supabase Auth */
/* e-posta: kullanicinin GERCEK adresi (yoksa kullanici adindan turetilen yerel adres) */
const sbEmail=(u,a)=>((a&&a.email)||(u.u||'')+'@iydu.app').toLowerCase();
async function sbSignUp(u,pass,nick,email){
  return sb('/auth/v1/signup',{method:'POST',body:{email:String(email).toLowerCase(),password:pass,data:{username:u,nick:nick}}});
}
async function sbSignIn(u,pass,email){
  const j=await sb('/auth/v1/token?grant_type=password',{method:'POST',body:{email:String(email||sbEmail(u)).toLowerCase(),password:pass}});
  if(j&&j.access_token)sbSave({access_token:j.access_token,refresh_token:j.refresh_token,user:j.user,at:Date.now()});
  return j;
}
async function sbRefresh(){
  const sess=sbSession();
  if(!sess||!sess.refresh_token)return false;
  try{
    const j=await sb('/auth/v1/token?grant_type=refresh_token',{method:'POST',body:{refresh_token:sess.refresh_token}});
    if(j&&j.access_token){sbSave({access_token:j.access_token,refresh_token:j.refresh_token,user:j.user,at:Date.now()});return true}
  }catch(e){}
  return false;
}
/* bulut kaydi: kullanici basina tek satir (profil + tum uygulama verisi) */

async function sbPull(u){
  if(!cloud()||!sbSession())return null;
  try{
    const rows=await sb('/rest/v1/rpc/iydu_load',{method:'POST',body:{p_username:u}});
