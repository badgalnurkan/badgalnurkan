<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Improvin' your day</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6eee3">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Nunito:wght@400;600;700&display=swap">
<style>
:root{--bg:#FFFAFA;--card:#ffffff;--ink:#542A0C;--mut:#835C3B;--acc:#800000;--acc2:#FDD7E4;--ok:#387C44;--no:#C71585;--ln:#ebd8d4;--sh:0 12px 32px #542A0C13;--on-acc:#fff;--okbg:#eaf4ed;--fs:'Fraunces',Georgia,'Times New Roman',serif;--okbg:#e6f1e6}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;scroll-padding-top:env(safe-area-inset-top,0px);font-size:clamp(16px,.35vw + 11px,24px);overflow-y:scroll}
@media(min-width:1600px){html{font-size:clamp(15.5px,.45vw + 11px,16px)}}
/* mobil: okunakli taban olcu */
@media(max-width:600px){html{font-size:clamp(16px,4.4vw,17.5px)}}
@media(max-width:360px){html{font-size:16px}}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Nunito',system-ui,-apple-system,'Segoe UI',Roboto,Ubuntu,sans-serif;line-height:1.6;transition:background .4s,color .4s;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
#app{display:flex;flex-direction:column;flex:1;width:100%;transition:opacity .22s ease}
#app.soft-out{opacity:0}
button,input,select,textarea{font:inherit;color:inherit}
button{background:var(--acc);color:var(--on-acc,#fff);border:0;border-radius:999px;padding:.6em 1.4em;min-height:2.75rem;font-weight:600;cursor:pointer;box-shadow:0 4px 14px #a9714b33;transition:transform .2s,box-shadow .2s,background .3s;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button:hover{transform:translateY(-1px);box-shadow:0 6px 18px #a9714b44}
button.g{background:transparent;border:1.5px solid var(--ln);color:var(--ink);box-shadow:none}
button.g:hover{border-color:var(--acc)}
button.s{min-height:2.2rem;padding:.25em .9em;font-size:.82rem}
button.d{color:var(--no);border-color:var(--no)}
button:disabled{opacity:.35;cursor:not-allowed;transform:none}
input,select,textarea{background:var(--bg);border:1.5px solid var(--ln);border-radius:16px;padding:.7em 1.1em;width:100%;margin:.3em 0 .8em;font-size:max(16px,1rem);transition:border .3s}
textarea{resize:vertical}
input:focus,textarea:focus{outline:0;border-color:var(--acc)}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
label{font-size:.9rem;font-weight:600}
.shell{display:flex;flex:1;max-width:80rem;margin:0 auto;width:100%;align-items:flex-start;padding:0 1rem;gap:1.2rem}
aside{width:16rem;background:var(--card);margin:1.2rem 0;border-radius:24px;box-shadow:var(--sh);padding:1.4rem 1rem;display:flex;flex-direction:column;gap:.3rem;transition:background .4s;flex-shrink:0;position:sticky;top:1rem}
aside .lg{font-family:var(--fs);font-weight:700;font-size:1.4rem;line-height:1.2;color:var(--acc);margin-bottom:1rem;word-break:break-word;cursor:pointer;padding:0 .5rem}
aside .lg small{display:block;font-family:'Nunito',system-ui,sans-serif;font-size:.8rem;font-weight:600;color:var(--mut);margin-bottom:.2rem}
aside a{padding:.7em 1rem;border-radius:999px;cursor:pointer;color:var(--mut);font-weight:600;font-size:.95rem;transition:all .25s;-webkit-tap-highlight-color:transparent}
aside a:hover{background:var(--bg);color:var(--ink)}
aside a.on{background:var(--acc);color:var(--on-acc,#fff);box-shadow:0 4px 14px #a9714b33}
aside a.press{transform:scale(.96);background:color-mix(in srgb,var(--acc) 22%,transparent)}
aside a{transition:background .22s ease,color .22s ease,transform .16s ease}
aside a.on{font-weight:800;letter-spacing:.005em}
@supports not (background:color-mix(in srgb,red,blue)){aside a.press{background:var(--bg)}}
main{transition:opacity .18s ease}
main.swap{opacity:0}
main.an{animation:pgIn .32s cubic-bezier(.2,.7,.2,1) both}
@keyframes pgIn{from{opacity:0;transform:translate3d(0,var(--pg-dy,8px),0)}to{opacity:1;transform:none}}
@media(max-aspect-ratio:3/4){main{--pg-dy:10px}}
@media(min-aspect-ratio:16/10){main{--pg-dy:6px}}
@media(prefers-reduced-motion:reduce){main.an{animation:none}}
aside a{transition:background .22s ease,color .22s ease,transform .16s ease,box-shadow .22s ease}
main{flex:1;min-width:0;padding:1.2rem 0;max-width:54rem;margin:0 auto;width:100%;animation:fi .3s ease;display:flex;flex-direction:column;gap:1.2rem}
@keyframes fi{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
header.top{display:flex;justify-content:space-between;align-items:center;gap:.6rem;padding:.9rem 1.5rem;background:var(--card);border-bottom:1px solid var(--ln);color:var(--mut);font-size:.95rem;transition:all .4s;position:relative}
header.top b{font-family:var(--fs);font-size:1.15rem;color:var(--acc);cursor:pointer}
.lv2 header.top,.lv3 header.top,.lv4 header.top{background:linear-gradient(90deg,var(--card),var(--bg));border-bottom:2px solid var(--acc)}
.lv3 .card,.lv4 .card{box-shadow:0 14px 40px #8a5a3a2a}
.lv4 aside .lg{letter-spacing:.06em}
.card{background:var(--card);border:1px solid var(--ln);border-radius:24px;box-shadow:var(--sh);padding:1.5rem;transition:all .3s}
h1,h2,h3{font-family:var(--fs);font-weight:600;margin:.2em 0 .5em}
h1,h2{font-size:1.3rem}h3{font-size:1.05rem}
.mut{color:var(--mut)}
.row{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center}
.row>input{flex:1;min-width:8rem;margin:0}
.center{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:clamp(1rem,3vw,1.5rem);width:100%}
.welcome-screen{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;justify-content:space-between;padding:1.5rem;position:relative}
/* ust satir: marka solda, tema sagda — mobilde ust uste binmez */
.welcome-top{display:flex;align-items:center;justify-content:space-between;gap:.6rem;flex-wrap:wrap}
.welcome-top .themebar{margin:0!important;justify-content:flex-end!important}
@media(max-width:600px){
  .welcome-screen{padding:1rem}
  .welcome-top{gap:.35rem}
  .welcome-top .brand-badge{font-size:1.05rem}
  .welcome-top .themebar button{padding:.3em .7em;font-size:.72rem;min-height:2rem}
  .welcome-top .themebar small{display:none}
}
@media(max-width:360px){.welcome-top .themebar button{padding:.28em .55em;font-size:.68rem}}
.brand-badge{font-family:var(--fs);font-weight:700;font-size:1.2rem;color:var(--acc);letter-spacing:.05em}
.welcome-center{display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;margin:auto;max-width:30rem;width:100%;padding:1rem 0}
.welcome-footer-bar{display:flex;justify-content:space-between;align-items:flex-end;width:100%;font-size:.85rem;color:var(--mut);gap:1rem}
.social-links{display:flex;flex-direction:column;text-align:right;gap:.2rem}
.social-links a{color:var(--mut);text-decoration:none;transition:color .2s}
.social-links a:hover{color:var(--acc)}
.box{max-width:26rem;width:100%;text-align:left}
/* giris/kayit kutusu: dengeli en-boy orani (ekrani kaplamaz, kucuk de kalmaz) */
.login-wrap{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:1.2rem;gap:.4rem}
.login-wrap>.langbar,.login-wrap>.themebar{max-width:26rem;margin:0 auto}
.login-wrap .box{max-width:clamp(20rem,34vw,27rem)}
/* ust serit: solda tema, sagda dil; ikisi ayni hizada ve kutu kenarlarina simetrik */
.login-top{width:100%;max-width:clamp(20rem,34vw,27rem);margin:.2rem auto .7rem;display:flex;align-items:center;justify-content:space-between;gap:.6rem}
.login-top .themebar{display:flex;flex-wrap:nowrap;align-items:center;gap:.3rem!important;margin:0!important;justify-content:flex-start!important;width:auto}
.login-top .themebar>small{margin:0 .15rem 0 0!important}
.login-top .themebar button,.login-top .langbar button{min-height:2.1rem;padding:.3em .8em;font-size:.8rem;line-height:1}
.login-top .langbar{display:flex;flex-wrap:nowrap;gap:.3rem;width:auto;margin:0;justify-content:flex-end}
.login-top .langbar button{min-width:2.6rem;padding:.3em .65em}
@media(min-width:901px) and (min-aspect-ratio:1/1){.login-top{max-width:clamp(21rem,26vw,26rem)}}
@media(min-width:601px) and (max-width:1024px){.login-top,.login-wrap .box{max-width:min(26rem,86vw)}}
@media(max-width:600px){.login-top{max-width:100%;margin:.1rem auto .6rem}}
@media(max-width:380px){
  .login-top{gap:.35rem}
  .login-top .themebar>small{display:none}
  .login-top .themebar button,.login-top .langbar button{padding:.28em .6em;font-size:.74rem;min-height:2rem}
  .login-top .langbar button{min-width:2.3rem}
}
@media(max-height:500px) and (orientation:landscape){.login-top{max-width:min(26rem,90vw);margin:.1rem auto .4rem}.login-wrap{padding-top:.5rem}}
@media(min-width:901px) and (min-aspect-ratio:1/1){
  .login-wrap .box{max-width:clamp(21rem,26vw,26rem)}
  .login-wrap .box input{font-size:.98rem;padding:.62em 1em;margin:.25em 0 .7em}
  .login-wrap .box h2{font-size:1.2rem;margin-bottom:.6rem}
}
@media(max-height:640px){.login-wrap{justify-content:flex-start;padding-top:.6rem}}
/* simetri: ust serit ile giris kutusu ayni genislik ve ayni kenar (en-boy oranina gore) */
.login-wrap{--lw:clamp(20rem,34vw,27rem)}
@media(min-width:901px) and (min-aspect-ratio:1/1){.login-wrap{--lw:clamp(21rem,26vw,26rem)}}
@media(min-width:601px) and (max-width:1024px){.login-wrap{--lw:min(26rem,86vw)}}
@media(max-width:600px){.login-wrap{--lw:100%;padding-left:clamp(.75rem,4vw,1.2rem);padding-right:clamp(.75rem,4vw,1.2rem)}}
@media(max-height:500px) and (orientation:landscape){.login-wrap{--lw:min(26rem,90vw)}}
.login-wrap .center{padding:0;min-height:auto;width:100%}
.login-wrap .login-top,.login-wrap .box{width:100%;max-width:var(--lw)!important;box-sizing:border-box}
.big{font-family:var(--fs);font-size:clamp(2.2rem,7vw,4.2rem);font-weight:600;letter-spacing:.04em;line-height:1.1;text-align:center;margin:.2em 0 .4em;color:var(--ink)}
.task{display:flex;align-items:center;gap:.7rem;padding:.8rem 1rem;background:var(--bg);border:1.5px solid var(--ln);border-radius:16px;margin:.5rem 0;transition:all .4s}
.task span{flex:1;min-width:0;overflow-wrap:anywhere;transition:color .4s}
.task.done{background:var(--okbg);border-color:var(--ok)}
@supports(background:color-mix(in srgb,red,blue)){.task.done{background:color-mix(in srgb,var(--ok) 16%,var(--card))}}
.task.done span{color:var(--ok);text-decoration:line-through}
.task.miss{border-color:var(--no);opacity:.85}
.task.shake{animation:sh .45s}
@keyframes sh{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.ck,.xx{width:2.5rem;height:2.5rem;min-height:0;padding:0;border-radius:50%;background:transparent;border:2px solid var(--ln);color:var(--mut);box-shadow:none;transition:all .35s;flex-shrink:0}
.ck.on{background:var(--ok);border-color:var(--ok);color:#fff}
.xx.on{background:var(--no);border-color:var(--no);color:#fff}
.cal{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:1rem;justify-content:center}
.dot{width:3.2rem;height:3.2rem;border-radius:16px;background:var(--ln);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:.65rem;cursor:pointer;transition:all .25s;color:var(--mut);gap:1px;border:0;padding:0;min-height:0;box-shadow:none}
.dot span{font-size:.9rem;font-weight:700}
.dot small{font-size:.55rem;opacity:.85;text-transform:uppercase}
.cal .dot{height:3.75rem}
.dot em.dpct{font-style:normal;font-size:.6rem;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;opacity:.95}
@media(max-aspect-ratio:3/4){.cal .dot{height:calc(clamp(2.2rem,13vw,3rem) + .7rem)}}
.dot.ok{background:var(--ok);color:#fff}
.dot.miss-dot{background:var(--mut);color:#fff;opacity:.75}
.dot.td{outline:2px solid var(--acc);outline-offset:2px}
.dot:hover{transform:scale(1.08)}
.bar{height:.65rem;background:var(--ln);border-radius:10px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);transition:width .6s}
.tm{font-family:var(--fs);font-size:clamp(2.6rem,8vw,5rem);font-weight:600;color:var(--acc);text-align:center;font-variant-numeric:tabular-nums}
.tag{display:flex;align-items:center;justify-content:space-between;gap:.5rem;flex-wrap:wrap;background:var(--bg);border:1.5px solid var(--ln);border-radius:14px;padding:.5rem 1rem;margin:.3rem 0;font-size:.95rem}
.tag.on{border-color:var(--acc)}
.note{background:var(--bg);border:1px dashed var(--acc);border-radius:12px;padding:.6em 1em;margin:.5em 0;font-size:.9rem}
.qa{display:flex;gap:.5rem;align-items:flex-start}
.qa textarea{margin:0;flex:1}
.qcap{text-align:right;font-size:.78rem;margin:.2rem 0 .8rem}
.pct-big{font-family:var(--fs);font-size:clamp(2.4rem,8vw,4rem);font-weight:700;color:var(--acc);line-height:1}
footer{text-align:center;padding:1rem;color:var(--mut);font-size:.8rem;background:var(--card);border-top:1px solid var(--ln);width:100%;margin-top:auto}
#ck[hidden]{display:none}
#ck{position:fixed;left:1rem;right:1rem;bottom:calc(1rem + env(safe-area-inset-bottom,0px));z-index:99;background:var(--card);border:1px solid var(--acc);border-radius:14px;padding:1rem;display:flex;gap:.8rem;flex-wrap:wrap;align-items:center;justify-content:space-between;max-width:42rem;margin:auto;box-shadow:var(--sh)}
.mini-popup{display:none;position:fixed;top:0;left:0;right:auto;background:var(--card);border:1px solid var(--ln);border-radius:18px;padding:clamp(.7rem,2vw,1rem);box-shadow:0 18px 50px #00000055;z-index:99999;width:min(20rem,calc(100vw - 1.2rem));max-height:min(78vh,34rem);overflow:auto;text-align:center;-webkit-overflow-scrolling:touch;touch-action:manipulation}
#mini-backdrop{position:fixed;inset:0;background:transparent;z-index:99998}
#mini-backdrop[hidden]{display:none}
.mini-cal-grid{display:flex;flex-wrap:wrap;gap:.3rem;margin-top:.5rem;justify-content:center}
.mini-dot{position:relative;width:2rem;height:2rem;border-radius:50%;background:var(--ln);display:grid;place-items:center;font-size:.7rem;color:var(--mut)}
.mini-dot.td{outline:2px solid var(--acc);font-weight:700;color:var(--acc)}
.mini-dot::after{content:attr(data-day);position:absolute;bottom:125%;left:50%;transform:translateX(-50%) translateY(4px);background:var(--ink);color:var(--bg);font-size:.65rem;padding:3px 7px;border-radius:6px;white-space:nowrap;opacity:0;visibility:hidden;transition:opacity .25s,transform .25s,visibility .25s;pointer-events:none;z-index:100}
.mini-dot:hover::after{opacity:1;visibility:visible;transform:translateX(-50%)}
/* mini takvim (header sag ust): sayinin uzerine gelince yumusak fade-in / fade-out + acik bej */
.mini-dot{transition:background .45s ease,color .45s ease,box-shadow .45s ease,opacity .45s ease,transform .45s ease,filter .45s ease}
.mini-cal-grid .mini-dot:hover,.mini-cal-grid .mini-dot.lit{background:#f7ecdc;color:#a8845c;box-shadow:0 6px 16px #8a5a3a33;transform:translateY(-1px) scale(1.12)}
.mini-cal-grid .mini-dot span{transition:color .45s ease}
.mini-cal-grid .mini-dot:hover span,.mini-cal-grid .mini-dot.lit span{color:#a8845c}
.mini-dot.future{background:transparent;border:1.5px dashed var(--ln);color:var(--mut);opacity:.6}
.mini-dot.fog{background:var(--ln);color:var(--mut);opacity:.5;filter:blur(.6px) saturate(.4)}
.mini-cal-grid .mini-dot.fog:hover,.mini-cal-grid .mini-dot.fog.lit{filter:none;opacity:1}
.mini-dot.note{position:relative}
.mini-dot span{font-weight:600;font-size:.72rem;line-height:1}
.mini-dot small{display:none}
.mini-dot.note::before{content:'•';position:absolute;top:-2px;right:1px;font-size:.6rem;color:var(--acc)}
#top-date-trigger{transition:color .35s,background .35s,box-shadow .35s,transform .35s;padding:.25em .7em;border-radius:999px;display:inline-flex;align-items:center;gap:.35em}
#top-date-trigger:hover{color:var(--acc);background:var(--bg);transform:translateY(-1px)}
#top-date-trigger.lit{color:#7a5636;background:#f7ecdc;box-shadow:0 6px 18px #8a5a3a2a}
#top-date-trigger small{font-size:.72rem;opacity:.85;font-weight:600}
.mini-popup{animation:mpIn .32s cubic-bezier(.2,.7,.2,1) both}
/* TV / uzaktan kumanda ve klavye: odak gorunur, hedefler buyuk */
aside a:focus-visible,button:focus-visible,.dot:focus-visible,.mini-dot:focus-visible{outline:3px solid var(--acc);outline-offset:3px}
@media(min-width:1700px) and (min-aspect-ratio:16/9){
html{font-size:16px}html{font-size:16px}aside{width:18.5rem}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
/* mobil menu: takilma/jitter yok, dokunma hedefleri buyuk, smooth kaydirma */
aside{-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;touch-action:pan-x;scroll-behavior:smooth;scrollbar-width:none}
aside::-webkit-scrollbar{display:none}
aside a{flex:0 0 auto;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
@media(hover:none),(pointer:coarse){
  aside a:hover{transform:none;background:transparent;color:var(--mut)}
  aside a.on:hover{background:var(--acc);color:var(--on-acc,#fff)}
  aside a{padding:.55em 1.05em;min-height:2.75rem;height:2.75rem;display:flex;align-items:center;justify-content:center;line-height:1;font-size:.92rem}
  aside{gap:.35rem;scroll-padding-inline:.4rem;scroll-snap-type:x proximity}
}
::view-transition-old(root){animation:vtOut .28s ease both}
::view-transition-new(root){animation:vtIn .28s ease both}
@keyframes vtOut{to{opacity:0}}
@keyframes vtIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){::view-transition-new(root){animation:none}}
/* ---- tum cihazlarda ayni gecisler: TV, telefon, tablet, dokunmatik ---- */
.emenv{display:flex;justify-content:center;gap:.5rem;flex-wrap:wrap;margin-bottom:.6rem}
.row{row-gap:.5rem}
.card,.task,.tag,.note{max-width:100%;overflow-wrap:anywhere}
[role=button]{-webkit-user-select:none;user-select:none}
@media(hover:none),(pointer:coarse){
  button,a[role=button],.dot,.mini-dot,.ck,.xx{min-height:2.9rem}
  button.s,.ck,.xx,.dot{min-height:2.6rem}
  button:hover,a[role=button]:hover{transform:none;box-shadow:none}
  aside a:hover{background:transparent;color:var(--mut)}
  aside a.on:hover{background:var(--acc);color:var(--on-acc,#fff)}
  .dot:hover{transform:none}
}
/* telefon */
@media(max-width:600px){
  .shell{padding:0 .6rem}
  .card{padding:1rem;border-radius:18px}
  h1,h2{font-size:1.15rem}
  .pct-big{font-size:clamp(2rem,11vw,3rem)}
  header.top{flex-wrap:wrap;row-gap:.3rem}
  .row>button{flex:1 1 auto}
  .qa{flex-direction:column}.qa button{align-self:flex-end}
  .dot{width:clamp(2.4rem,15vw,3rem);height:clamp(2.4rem,15vw,3rem)}
}
/* tablet: kendi olcusu */
@media(min-width:601px) and (max-width:1024px){
  aside{width:13.5rem}
  main{max-width:44rem}
  html{font-size:16px}
}
/* televizyon / cok genis ekran: uzaktan kumanda icin buyuk hedefler ve odak */
@media(min-width:1700px){
  button{min-height:2.9rem;padding:.6em 1.45em}
  aside a{padding:.75em 1.05em}
  .dot{width:3.2rem;height:3.2rem}
  .shell{max-width:84rem}
  main{max-width:56rem}
}
/* TV: uzaktan kumanda icin buyuk hedefler, ama yazi boyu sabit */
@media(min-height:1000px) and (min-aspect-ratio:16/9) and (pointer:coarse){
  button{min-height:3.25rem;padding:.7em 1.6em}
  aside a{padding:.85em 1.15em}
  .dot{width:3.6rem;height:3.6rem}
}
@media(min-width:2400px){.shell{max-width:92rem}main{max-width:60rem}}
:focus-visible{outline:3px solid var(--acc);outline-offset:3px}
/* ---- cihaza gore ince ayar (data-dev) ---- */
html[data-dev=phone] .shell{padding:0 .55rem}

/* ---- kalici depo: localStorage oncelikli, olmazsa bellek ici yedek (Safari gizli mod / dosya:// ) ---- */
const MEM={};
const store=()=>{try{const t='__t'+Math.random();localStorage.setItem(t,'1');localStorage.removeItem(t);return localStorage}catch(e){return null}};
const LSK='b1', OTURUM='b1s', FEEDB='b1f', LOCAL_OTURUM='b1.this';
function getItem(k){try{const s=store();if(s){const v=s.getItem(k);if(v!==null)return v}}catch(e){}return MEM[k]===undefined?null:MEM[k]}
function setItem(k,v){MEM[k]=v;try{const s=store();if(s){s.setItem(k,v);return true}}catch(e){}return false}
let DB=null;
let DBraw=null;try{DBraw=JSON.parse(getItem(LSK)||'')}catch(e){}
/* veri kaybina karsi yedek: her acilista son iyi kayit ayri tutulur */

if((!DBraw||!DBraw.accounts||!Object.keys(DBraw.accounts).length)&&DBbak&&DBbak.accounts&&Object.keys(DBbak.accounts).length)DBraw=DBbak;
DB=DBraw&&DBraw.accounts?DBraw:{accounts:{},last:'',lastUser:'',lock:{},lang:'en',beige:false};
if(!DB.lang)DB.lang='en';if(DB.beige===undefined)DB.beige=false;if(!DB.lastUser)DB.lastUser='';
document.documentElement.lang=DB.lang;
let pushT=null;
function schedulePush(){clearTimeout(pushT);if(!A?.authUid)return;pushT=setTimeout(()=>{sbPush().then(ok=>{if(!ok&&A)console.warn('Cloud sync could not complete')})},850)}
const save=()=>{
  try{
    if(A)A.updatedAt=Date.now();
    DB.savedAt=Date.now();
    setItem(LSK,JSON.stringify(DB));
    touchSession();
    schedulePush();
  }catch(e){}
};
/* oturum: kullanici bilgisi kucuk ve ayri tutulur -> ana kayit bozulsa da geri donus var */
function touchSession(){
  try{
    const u=A?A.u:(DB.lastUser||'');if(!u)return;
    const body=JSON.stringify({user:u,sig:signature(A||DB.accounts[u]),at:Date.now()});
    setItem(OTURUM,body);setItem(LOCAL_OTURUM,body);

let softPaintTimer=0;
function softPaint(){
  const reduced=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const canVT=document.startViewTransition&&document.visibilityState==='visible'&&!reduced;
  if(canVT){
    clearTimeout(softPaintTimer);softPaintTimer=0;
    const existing=$('#app');if(existing)existing.classList.remove('soft-out');
    try{
      const t=document.startViewTransition(()=>paint());
      if(t&&t.finished&&t.finished.catch)t.finished.catch(()=>{});
      if(t&&t.ready&&t.ready.catch)t.ready.catch(()=>{});
      return;
    }catch(e){}
  }
  const root=$('#app');
  if(!root||reduced){paint();return;}
  clearTimeout(softPaintTimer);
  root.classList.add('soft-out');
  softPaintTimer=setTimeout(()=>{
    paint();
    requestAnimationFrame(()=>{
      const current=$('#app');if(current)current.classList.remove('soft-out');
      softPaintTimer=0;
    });
  },90);
}

function centerNav(){
  const aside=document.querySelector('aside'),on=aside&&aside.querySelector('a.on');
  if(!aside||!on||aside.scrollWidth<=aside.clientWidth+2)return;
  /* Use visible rectangles rather than offsetLeft: mobile browsers can report
     offsetLeft relative to the page when the horizontal nav is not positioned. */
  const navRect=aside.getBoundingClientRect(),itemRect=on.getBoundingClientRect();
  const itemCenter=(itemRect.left-navRect.left)+aside.scrollLeft+(itemRect.width/2);
  const target=itemCenter-(aside.clientWidth/2);
  const max=Math.max(0,aside.scrollWidth-aside.clientWidth);
  const left=Math.max(0,Math.min(max,target));
  const reduced=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  try{aside.scrollTo({left,behavior:reduced?'auto':'smooth'})}catch(e){aside.scrollLeft=left}
}

const rndHex=n=>{const a=new Uint8Array(n);if(window.crypto&&crypto.getRandomValues)crypto.getRandomValues(a);else for(let i=0;i<n;i++)a[i]=Math.floor(Math.random()*256);return[...a].map(x=>x.toString(16).padStart(2,'0')).join('')};
/* sifre: PBKDF2 + tuz (yeni kayitlar), eski kayitlar icin geriye donuk dogrulama */
async function hashPw(p,salt){
  salt=salt||rndHex(16);
  try{
    const key=await crypto.subtle.importKey('raw',new TextEncoder().encode(p),'PBKDF2',false,['deriveBits']);
    const bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt:new TextEncoder().encode(salt),iterations:120000,hash:'SHA-256'},key,256);
    return {pw:'p2$'+salt+'$'+[...new Uint8Array(bits)].map(x=>x.toString(16).padStart(2,'0')).join(''),salt};
  }catch(e){return {pw:'p1$'+salt+'$'+await sha(salt+'|'+p),salt}}
}
async function pwMatch(a,p){
  if(!a||!a.pw)return false;
  const v=String(a.pw);
  if(v.indexOf('p2$')===0||v.indexOf('p1$')===0){const r=await hashPw(p,v.split('$')[1]);return r.pw===v}
  return v===await sha(p);
}

/* BEGIN CORE LOGIC: tested with Node's built-in test runner */
/* Legacy percentage compatibility (2026-11-13 cutover): prior releases awarded
   +1 for each calendar day since pctFrom. Preserve that already-displayed value,
   then award additional points only for meaningful activity AFTER the cutover.
   This is read-only: never rewrite or discard the user's historical data. */
const PROGRESS_CUTOVER='2026-11-13';
function validProgressDate(value){
  if(typeof value!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(value))return false;
  const date=new Date(value+'T00:00:00Z');
  return Number.isFinite(date.getTime())&&date.toISOString().slice(0,10)===value;
}
function progressDayDistance(from,to){
  return Math.round((Date.parse(to+'T00:00:00Z')-Date.parse(from+'T00:00:00Z'))/86400000);
}
function progressPercent(activeDays,pctFrom,asOf){
  const days=activeDays&&typeof activeDays==='object'&&!Array.isArray(activeDays)?activeDays:{};
  const current=validProgressDate(asOf)?asOf:new Date().toISOString().slice(0,10);
  const cutoff=current<PROGRESS_CUTOVER?current:PROGRESS_CUTOVER;
  const isLegacy=validProgressDate(pctFrom)&&pctFrom<=PROGRESS_CUTOVER;
  const baseline=isLegacy?Math.max(1,progressDayDistance(pctFrom,cutoff)+1):0;
  const recent=Object.keys(days).filter(day=>
    validProgressDate(day)&&day<=current&&days[day]===true&&(!isLegacy||day>cutoff)
  ).length;
  return Math.max(1,baseline+recent);
}
function stopwatchFormat(ms){
  const v=Number.isFinite(ms)?Math.max(0,ms):0;
  const total=Math.floor(v/10);
  const minute=Math.floor(total/6000);
  const second=Math.floor(total%6000/100);
  const cs=total%100;
  return String(minute).padStart(2,'0')+':'+String(second).padStart(2,'0')+','+String(cs).padStart(2,'0');
}
function usernameSuggestions(name,used=[]){
  const base=String(name||'').replace(/[^a-zA-ZçÇğĞıİöÖşŞüÜ]/g,'').slice(0,16)||'kullanici';
  const endings=['yeni','gün','artı','genç','odak','aktif','not'];
  const taken=new Set(used.map(x=>String(x).toLocaleLowerCase('tr-TR')));
  return endings.map(s=>(base.slice(0,20-s.length)+s).slice(0,20))
    .filter((x,i,arr)=>x.length>=3&&arr.indexOf(x)===i&&!taken.has(x.toLocaleLowerCase('tr-TR'))).slice(0,5);
}

function detectDevice(){
  const w=innerWidth,h=innerHeight,coarse=window.matchMedia('(pointer:coarse)').matches||(navigator.maxTouchPoints||0)>1;
  const short=Math.min(w,h),long=Math.max(w,h);
  let dev='desktop';
  /* telefon/tablet: kisa kenar + dokunmatik; TV: buyuk ekran; masaustu: geri kalan */
  if(short<=600&&(coarse||short<=480))dev='phone';
  else if(short<=900&&coarse)dev='tablet';
  else if(short<=1024&&long<=1400)dev='tablet';
  else if(coarse&&long>1024)dev='tv';
  else if(long>=1700)dev='desktop-xl';
  else if(long<=900)dev='mobile-narrow';
  document.documentElement.dataset.dev=dev;
  document.documentElement.dataset.orient=h>=w?'portrait':'landscape';
  return dev;
}

async function activateCloudUser(j,preferredName='',method='password',options={}){
  const uid=j&&j.user&&j.user.id;
  if(!uid||!j.access_token)throw new Error('Missing authenticated session');
  sbSave({access_token:j.access_token,refresh_token:j.refresh_token,user:j.user,at:Date.now()});
  const meta=j.user.user_metadata||{};
  const fromCloud=await sbPull(); // may throw, never replace cloud data with empty after a failure
  const fromLocal=Object.values(DB.accounts).find(x=>x.authUid===uid);
  const username=String((fromCloud&&fromCloud.u)||meta.username||preferredName||(fromLocal&&fromLocal.u)||j.user.email.split('@')[0]);
  const a=norm(fromCloud||fromLocal||{u:username,nick:meta.nick||username,email:j.user.email});
  a.u=username;a.authUid=uid;a.accountOrigin='cloud';a.email=String(j.user.email||a.email||'').toLowerCase();a.mail=a.email;
  a.pw='';delete a.salt; // Cloud passwords are checked by Supabase, never stored in user_data.
  a.loginMethod=method==='google'?'google':'password';
  if(method==='google'||j.user.app_metadata?.providers?.includes('google'))a.googleConnected=true;
  v13ProtectLegacyCollision(a.u,uid,options.allowLegacyReplacement===true);
  DB.accounts[a.u]=a;DB.last=a.nick||a.u;DB.lastUser=a.u;A=a;
  restorePomodoroState();applyTheme();save();loginDat={u:'',p:''};
  goTo('app','home');
  if(!fromCloud)await sbPush();
  return a;
}
async function login(){
  if(authBusy)return;
  const raw=String($('#u')?.value||loginDat.u||'').trim();
  const password=String($('#p')?.value||loginDat.p||'');
  if(!raw){msg=tr()?'E-posta veya kullanıcı adını gir.':'Enter email or username.';return renderAppOrAuth()}
  if(!password){msg=tr()?'Şifreni gir.':'Enter your password.';return renderAppOrAuth()}
  const localKey=findUser(raw);
  const matchingMail=Object.values(DB.accounts).find(a=>String(a.email||a.mail||'').toLowerCase()===raw.toLowerCase());
  const localAcc=localKey?DB.accounts[localKey]:matchingMail;
  const email=raw.includes('@')?raw.toLowerCase():localAcc&&String(localAcc.email||localAcc.mail||'').toLowerCase();
  loginBusy(true);
  try{
    if(email){
      try{
        const j=await sbSignIn(raw,password,email);
        await activateCloudUser(j,raw,'password');
        greetThen();return;
      }catch(e){
        if(localAcc&&!accountCloudHints(localAcc)&&await pwMatch(localAcc,password)){
          sbClear();A=norm(localAcc);A.accountOrigin='local';DB.lastUser=A.u;restorePomodoroState();applyTheme();save();goTo('app','home');greetThen();
          toast(tr()?'Eski yerel hesabın açıldı; başka cihazlarla eşitlenmez.':'Legacy local account: no cross-device sync.');return;
        }
        loginDat.p='';
        msg=authErrorMessage(e)==='email-unconfirmed'?(tr()?'E-posta doğrulaması gerekiyor. Demo için Supabase ayarını kontrol et.':'Email confirmation required. Check Supabase demo settings.'):
          (tr()?'Giriş başarısız. E-posta ve şifreni kontrol et.':'Sign-in failed. Check email and password.');
        if(authErrorMessage(e)==='credentials'&&localAcc?.googleConnected)msg=tr()?'Bu hesap Google ile açılmış olabilir. Google ile devam et; manuel giriş için önce Ayarlar’da uygulama şifresi belirle.':'This account may use Google sign-in. Continue with Google, or set an app password in Settings first.';
        if(e.name==='AbortError')msg=tr()?'Bağlantı zaman aşımına uğradı.':'Connection timed out.';
        return renderAppOrAuth();
      }
    }
    if(localAcc&&!accountCloudHints(localAcc)&&await pwMatch(localAcc,password)){
      sbClear();A=norm(localAcc);A.accountOrigin='local';restorePomodoroState();applyTheme();save();goTo('app','home');greetThen();
      toast(tr()?'Bu yalnızca yerel eski hesap. Diğer cihazlarda e-posta ile bulut hesabına giriş yapmalısın.':'Legacy local account only.');return;
    }
    msg=tr()?'Başka cihazda kayıtlıysan kullanıcı adı yerine e-posta adresinle giriş yap.':'Sign in with email on a new device.';
    renderAppOrAuth();
  }finally{loginBusy(false)}
}
async function setup(){
  if(authBusy)return;
  const u=String($('#u')?.value||'').trim(),n=String($('#n')?.value||'').trim();
  const e=String($('#e')?.value||'').trim().toLowerCase(),p=String($('#p')?.value||'');
  formDat={u,n,b:String($('#b')?.value||'').slice(0,160),e,t:'',p};
  if(!userRe.test(u))msg=t('usernameRules');
  else if(!n)msg=t('displayRequired');
  else if(findUser(u))msg=t('usernameTaken');
  else if(!emailPattern.test(e))msg=t('emailInvalid');
  else msg=pwOk(p,u);
  if(msg){renderAppOrAuth();if(msg===t('usernameTaken'))debounceNameCheck();return}
  if(Object.values(DB.accounts).some(a=>String(a.email||a.mail||'').toLowerCase()===e)){goExistingEmail(e);return}
  loginBusy(true);
  try{
    const available=await sb('/rest/v1/rpc/iydu_username_available',{method:'POST',body:{p_username:u}});
    if(available!==true){msg=t('usernameTaken');renderAppOrAuth();debounceNameCheck();return}
    const j=await sbSignUp(u,p,n,e);
    if(!j||!j.access_token){
      msg=tr()?'Bulut kaydı oluştu ancak oturum açılmadı. Supabase e-posta doğrulaması gerektiriyor olabilir.':'Cloud signup requires email confirmation; no session returned.';
      renderAppOrAuth();return;
    }
    await activateCloudUser(j,u);
    formDat={u:'',n:'',b:'',e:'',t:'',p:''};greetThen();
    toast(tr()?'Bulut hesabın oluşturuldu. E-posta sahipliği kontrol edilmedi (demo).':'Cloud account created. Email ownership was not checked (demo).');
  }catch(err){
    const cause=authErrorMessage(err);
    if(cause==='already-email'){goExistingEmail(e);return}
    if(cause==='username'){msg=t('usernameTaken');renderAppOrAuth();debounceNameCheck();return}
    msg=(tr()?'Bulut kaydı tamamlanamadı. Ağ veya Supabase ayarlarını kontrol et.':'Could not register. Check network and Supabase configuration.');
    if(err.name==='AbortError')msg=tr()?'İstek zaman aşımına uğradı.':'Request timed out.';
    renderAppOrAuth();
  }finally{loginBusy(false)}
}

const ISTANBUL_DAY_FORMATTER=new Intl.DateTimeFormat('en-US',{

/* Return one month of header buttons without rebuilding the page or any draft inputs. */
function miniCalendarData(dayKey){
  const [y,month]=dayKey.split('-').map(Number),mo=month-1;
  const days=new Date(y,mo+1,0).getDate();
  let mc='';
  for(let d=1;d<=days;d++){
    const k=`${y}-${pad(month)}-${pad(d)}`,its=items(k),future=k>dayKey;
    let cls=future?'future':(k<dayKey&&A.fog&&!(its.length>0&&its.every(x=>x.done))?'fog':'');
    if(!future&&its.length>0)cls=its.every(x=>x.done)?'ok':'miss-dot';
    if(hasNote(k))cls+=' note';
    mc+=`<button class="mini-dot ${cls} ${k===dayKey?'td':''}" title="${fmt(k)}" ${k<dayKey&&!A.fog?'disabled aria-disabled="true"':''} onclick="miniClick(event,'${k}')"><span>${d}</span></button>`;
  }
  return {y,mo,mc};
}

let swipeStart=null;

  if(!A||view!=='app'||innerWidth>900||ev.touches.length!==1)return;
  if(!ev.target.closest('main')||ev.target.closest('input,textarea,select,button,a,[contenteditable],.laps,.cal,[data-swipe-stopwatch]'))return;
  const p=ev.touches[0];swipeStart={x:p.clientX,y:p.clientY,at:Date.now()};
},{passive:true});

  if(!swipeStart||!A||view!=='app')return;
  const start=swipeStart;swipeStart=null;const p=ev.changedTouches[0];
  if(!p)return;const dx=p.clientX-start.x,dy=p.clientY-start.y;
  if(Math.abs(dx)<48||Math.abs(dx)<Math.abs(dy)*1.25||Date.now()-start.at>950)return;
  const idx=NAV.findIndex(v=>v[0]===pg),next=idx+(dx<0?1:-1);

function fixTodoData(){
  const txt=x=>typeof x==='string'?x:(x&&typeof x==='object'?String(x.t||x.text||x.title||''):String(x==null?'':x));
  if(!Array.isArray(A.tasks))A.tasks=A.tasks&&typeof A.tasks==='object'?Object.values(A.tasks):[];
  A.tasks=A.tasks.filter(x=>x!=null).map(x=>typeof x==='object'?{...x,t:txt(x),s:(x.s==='done'||x.s==='miss')?x.s:(x.done?'done':'')}:{t:txt(x),s:''}).filter(x=>x.t);
  if(!Array.isArray(A.backlog))A.backlog=A.backlog&&typeof A.backlog==='object'?Object.values(A.backlog):[];
  A.backlog=A.backlog.map(txt).filter(Boolean).slice(-10);
  if(!A.hist||typeof A.hist!=='object')A.hist={};
}

function saveNote(k){
  const v=String(document.getElementById('dn')?.value||'').trim().slice(0,500);
  if(!A.future||typeof A.future!=='object')A.future={};
  if(!A.futureMeta||typeof A.futureMeta!=='object')A.futureMeta={};
  const previous=String(A.future[k]||''),meta=A.futureMeta[k]||{},now=Date.now();
  if(v){
    A.future[k]=v;
    A.futureMeta[k]={createdAt:meta.createdAt||now,editedAt:previous&&previous!==v?now:(meta.editedAt||null)};
    if(previous!==v)recordActivity();else save();
  }else{delete A.future[k];delete A.futureMeta[k];save()}
  closeModal('day-modal');toast(t('noteSaved'));if(pg==='pc')P.pc();else renderPage();
}
P.pc=()=>{

/* Pure date gates: a report is available only on the day after the completed period. */
function reportPeriodEnded(now,end){return /^\d{4}-\d{2}-\d{2}$/.test(String(now))&&/^\d{4}-\d{2}-\d{2}$/.test(String(end))&&now>end}
function answerArchiveUnlocked(now,periodKey){return /^\d{4}-\d{2}-\d{2}$/.test(String(now))&&/^\d{4}-\d{2}(?:-\d{2})?$/.test(String(periodKey))&&Number(now.slice(0,4))>Number(periodKey.slice(0,4))}
function repCard(title,per,a,b,pa,pb,key,nk,defs){
  const td=today();
  if(!reportPeriodEnded(td,b)){
    const tot=dd(a,b)+1,pass=dd(a,td)+1;
    return`<div class="card"><h2>🔒 ${title}</h2><p class="mut">${t('opensOn')} ${fmt(b)} — ${dd(td,b)} ${t('daysLeft')}</p><div class="bar"><i style="width:${Math.min(100,pass/tot*100)}%"></i></div></div>`;
  }
  if(!A.qs[nk])A.qs[nk]=defs.map(q=>({q,a:''}));
  if(!A.qs[key])A.qs[key]=defs.map(q=>({q,a:''}));
  const s=st(a,b),pv=st(pa,pb),df=s.p-pv.p,cur=A.qs[key]||[],ro=!!A.ql[key];
  const rows=Object.entries(s.by).map(([k,v])=>`<div class="task"><span>${esc(k)}</span><b>${v[0]}/${v[1]}</b></div>`).join('');
  return`<div class="card"><h2>${title}</h2><p>${s.d}/${s.t} ${t('tasksDone')} — <b>%${s.p}</b> <span class="mut">(${t('previous')} ${per}: %${pv.p}, ${t('change')} ${df>=0?'+':''}${df})</span></p><div class="bar"><i style="width:${s.p}%"></i></div>${rows}
<h3 style="margin-top:1.2rem">${t('questionsFor')} ${per} ${ro?'🔒':''}</h3>${cur.length?(ro?`<p class="mut">🔒 ${tr()?'Yanıtların kilitlendi. Yıl bitene kadar Yanıt arşivinde gizli kalacak.':'Your answers are locked and will stay hidden in the answer archive until the end of the year.'}</p>`:qb(key,cur,false)+`<button class="g s" onclick="lockQ('${key}',this)">${t('lockAnswers')}</button>`):`<p class="mut">${t('noQuestions')}${t('askedNext')} ${per}.</p>`}
<h3 style="margin-top:1.2rem">${tr()?'Sonraki':'Next'} ${per}</h3>${qb(nk,A.qs[nk],false)}<div class="row"><input id="nq-${nk}" maxlength="150" placeholder="${t('addOwnQuestion')}"><button class="s" onclick="addQ('${nk}')">${t('addQuestion')}</button><button class="g s" onclick="addRandQ('${nk}')">${t('randomQuestion')}</button></div></div>`;
}
/* ---- gecmis raporlar: kisa ozet (haftalik / aylik) ---- */
function briefRow(label,val,sub){
  return`<div class="task"><span><b>${label}</b>${sub?`<small class="mut" style="display:block;font-size:.78rem">${sub}</small>`:''}</span><b style="color:var(--acc)">${val}</b></div>`;
}
function historySection(){
  const td=today();
  // haftalik ozet: bu hafta + gecen hafta
  const wNow=st(mon(td),td),wPrev=st(addD(mon(td),-7),addD(mon(td),-1));
  const wDiff=wNow.p-wPrev.p;
  const wTop=Object.entries(wNow.by).sort((a,b)=>b[1][1]-a[1][1])[0];
  // aylik ozet
  const x=new Date();
  const ma=D(new Date(x.getFullYear(),x.getMonth(),1)),mb=D(new Date(x.getFullYear(),x.getMonth()+1,0));
  const pma=D(new Date(x.getFullYear(),x.getMonth()-1,1)),pmb=D(new Date(x.getFullYear(),x.getMonth(),0));
  const mNow=st(ma,mb),mPrev=st(pma,pmb),mDiff=mNow.p-mPrev.p;
  const weekDone=dd(mon(td),td)+1,monthDone=dd(ma,td)+1;
  return`<div class="card"><div class="row report-heading"><h2>${tr()?'Geçmiş özet':'Past summary'}</h2><button class="g s report-more" onclick="showReportDetail('summary')">${tr()?'Daha fazlası':'More details'} →</button></div>
<div style="margin-top:.6rem"><h3 style="margin:.2rem 0 .4rem">${tr()?'Bu hafta':'This week'} <span class="mut" style="font-size:.8rem">${fmt(mon(td))} – ${fmt(td)}</span></h3>
${briefRow(tr()?'Tamamlanan':'Completed',wNow.d+'/'+wNow.t+' · %'+wNow.p,(tr()?'Geçen hafta':'Last week')+' %'+wPrev.p+' ('+(wDiff>=0?'+':'')+wDiff+')')}
${wTop?briefRow(tr()?'En çok yaptığın':'Most frequent',esc(wTop[0]).slice(0,28),wTop[1][0]+'/'+wTop[1][1]):''}
${briefRow(tr()?'Kayıtlı gün':'Days recorded',weekDone+'/7')}</div>
<div style="margin-top:1.1rem"><h3 style="margin:.2rem 0 .4rem">${tr()?'Bu ay':'This month'} <span class="mut" style="font-size:.8rem">${monthName(x.getMonth())} ${x.getFullYear()}</span></h3>
${briefRow(tr()?'Tamamlanan':'Completed',mNow.d+'/'+mNow.t+' · %'+mNow.p,(tr()?'Geçen ay':'Last month')+' %'+mPrev.p+' ('+(mDiff>=0?'+':'')+mDiff+')')}
${briefRow(tr()?'Kayıtlı gün':'Days recorded',monthDone+'/'+(dd(ma,mb)+1))}</div><div style="margin-top:1.2rem"><div class="row report-heading"><h3>${tr()?'Günlükler':'Daily journals'}</h3><button class="g s report-more" onclick="showReportDetail('journals')">${tr()?'Daha fazlası':'More details'} →</button></div><div class="journal-grid">${Object.entries(A.journal||{}).sort((a,b)=>b[0].localeCompare(a[0])).slice(0,90).map(([k,v])=>`<div class="note-tile"><b>${journalEntryStamp(v)}</b><p>${esc(v.text||'')}</p><button class="g s" onclick="openJournalEntry('${k}')">${tr()?'Aç':'Open'}</button></div>`).join('')||'<p class="mut">'+(tr()?'Henüz günlük yok.':'No journals yet.')+'</p>'}</div></div></div>`;
}
let reportDetail='';
function showReportDetail(key){if(!['summary','journals','answers'].includes(key))return;reportDetail=key;P.rep();window.scrollTo({top:0,behavior:window.matchMedia('(prefers-reduced-motion:reduce)').matches?'instant':'smooth'})}
function reportBack(){reportDetail='';P.rep()}
function reportDetailView(){
  const header=`<div class="card"><div class="row report-heading"><h2>${reportDetail==='summary'?(tr()?'Geçmiş özetler':'Past summaries'):reportDetail==='journals'?(tr()?'Günlük arşivi':'Journal archive'):(tr()?'Yanıt arşivi':'Answer archive')}</h2><button class="g s" onclick="reportBack()">← ${t('back')}</button></div></div>`;
  if(reportDetail==='journals'){
    const entries=Object.entries(A.journal||{}).filter(([k,v])=>/^\d{4}-\d{2}-\d{2}$/.test(k)&&v&&typeof v==='object').sort((a,b)=>b[0].localeCompare(a[0]));
    return header+`<div class="card"><div class="journal-grid">${entries.map(([k,v])=>`<article class="note-tile"><b>${journalEntryStamp(v)}</b><p>${esc(v.text||'')}</p><button class="g s" onclick="openJournalEntry('${k}')">${tr()?'Görüntüle / düzenle':'View / edit'}</button></article>`).join('')||`<p class="mut">${tr()?'Henüz günlük yok.':'No journal entries yet.'}</p>`}</div></div>`;
  }
  if(reportDetail==='answers'){
    const keys=Object.keys(A.qs||{}).filter(k=>/^\d{4}-(\d{2}(-\d{2})?)$/.test(k)).sort().reverse();
    const rows=keys.filter(k=>A.ql&&A.ql[k]).map(k=>{
      const year=Number(k.slice(0,4)),locked=!answerArchiveUnlocked(today(),k),qs=Array.isArray(A.qs[k])?A.qs[k]:[];
      return `<article class="note-tile"><b>${esc(k)} ${locked?'🔒':''}</b>${locked?`<p class="mut">${tr()?`Yanıtlar ${year+1} yılının başında açılır.`:`Answers unlock at the beginning of ${year+1}.`}</p>`:qs.map(q=>`<div><b>${esc(q.q||'')}</b><p>${esc(q.a||'')}</p></div>`).join('')}</article>`;
    });
    return header+`<div class="card"><div class="note-grid">${rows.join('')||`<p class="mut">${tr()?'Henüz kilitli yanıt bulunmuyor.':'No locked answers yet.'}</p>`}</div></div>`;
  }
  const byDay=Object.keys(A.hist||{}).filter(k=>/^\d{4}-\d{2}-\d{2}$/.test(k)&&Array.isArray(A.hist[k])).sort().reverse();
  const groups=new Map();for(const day of byDay){const month=day.slice(0,7);if(!groups.has(month))groups.set(month,[]);groups.get(month).push(day)}
  const cards=[...groups].map(([month,days])=>{
    const lines=days.map(d=>{const it=items(d),done=it.filter(x=>x&&x.done).length;return `<div class="task"><span>${esc(d)} — ${done}/${it.length} ${t('tasksDone')}</span><button class="g s" onclick="openDay('${d}',true)">${tr()?'İncele':'Review'}</button></div>`}).join('');
    return `<section class="card"><h3>${esc(month)}</h3>${lines}</section>`;
  }).join('');
  return header+`<div class="card"><button class="g s" onclick="showReportDetail('answers')">${tr()?'🔒 Yıl sonu yanıt arşivi':'🔒 Year-end answer archive'}</button><p class="mut">${tr()?'Yanıtlar kilitlendikten sonra yıl bitene kadar gizli kalır.':'Locked answers stay hidden until the year ends.'}</p></div>${cards||`<div class="card"><p class="mut">${tr()?'Henüz geçmiş kayıt yok.':'No past records yet.'}</p></div>`}`;
}
P.rep=()=>{
  if(reportDetail){M(reportDetailView());return}
  const td=today(),wa=mon(td),wb=addD(wa,6),x=new Date();
  const ma=D(new Date(x.getFullYear(),x.getMonth(),1)),mb=D(new Date(x.getFullYear(),x.getMonth()+1,0)),pma=D(new Date(x.getFullYear(),x.getMonth()-1,1)),pmb=D(new Date(x.getFullYear(),x.getMonth(),0));
  const mNext=D(new Date(x.getFullYear(),x.getMonth()+1,1)).slice(0,7);
  M(repCard(t('weeklyReport'),tr()?'hafta':'week',wa,wb,addD(wa,-7),addD(wa,-1),wa,addD(wa,7),defQ('week'))+repCard(t('monthlyReport'),tr()?'ay':'month',ma,mb,pma,pmb,ma.slice(0,7),mNext,defQ('month'))+historySection());
};

let pm={w:25,b:5,ph:'w',left:1500,run:0,end:0,n:0,iv:0,lg:0,sw:0,swT:0,swI:0,swMs:0};
function persistPomodoroState(){
  if(!A)return;
  A.pomo={
    w:pm.w,b:pm.b,ph:pm.ph,
    left:pm.run?Math.max(0,Math.ceil((pm.end-Date.now())/1000)):pm.left,
    run:!!pm.run,end:pm.run?pm.end:0,n:pm.n,lg:pm.lg,updatedAt:Date.now()
  };
  save();
}
function restorePomodoroState(){
  if(pm.iv)clearInterval(pm.iv);
  pm.iv=0;
  const saved=A&&A.pomo;
  const first=(A&&Array.isArray(A.presets)&&A.presets.length)?A.presets[0]:{w:25,b:5};
  const defaultW=Number(first.w)>0&&Number(first.w)<=600?Number(first.w):25;
  const defaultB=Number(first.b)>0&&Number(first.b)<=600?Number(first.b):5;
  if(!saved||typeof saved!=='object'){
    if(A?.stopwatch?.running){clearInterval(pm.swI);pm.swI=setInterval(swRender,40)}
    pm={...pm,w:defaultW,b:defaultB,ph:'w',left:defaultW*60,run:0,end:0,n:0,lg:0,iv:0};
    return;
  }
  const w=Number(saved.w),b=Number(saved.b),left=Number(saved.left),end=Number(saved.end);
  pm={...pm,
    w:Number.isFinite(w)&&w>0&&w<=600?w:defaultW,
    b:Number.isFinite(b)&&b>0&&b<=600?b:defaultB,
    ph:saved.ph==='b'?'b':'w',
    left:Number.isFinite(left)&&left>=0?left:defaultW*60,
    run:saved.run?1:0,
    end:Number.isFinite(end)&&end>0?end:0,
    n:Number.isFinite(Number(saved.n))?Math.max(0,Math.floor(Number(saved.n))):0,
    lg:saved.lg?1:0,iv:0
  };
  if(A?.stopwatch?.running){clearInterval(pm.swI);pm.swI=setInterval(swRender,40)}
  if(pm.run&&pm.end){
    pTick(true);
    if(pm.run)pm.iv=setInterval(pTick,500);
  }else{
    pm.run=0;pm.end=0;
  }
}
const fmtDuration=m=>{if(m<60)return m+' '+t('minutes');const h=Math.floor(m/60),r=m%60;return r===0?h+(h==1?(tr()?' saat':' hour'):(tr()?' saat':' hours')):h+(tr()?' sa ':' h ')+r+' '+t('minutes')};
const ft=s=>pad(Math.floor(s/60))+':'+pad(s%60);
/* kronometre: milisaniye hassasiyetinde HH:MM:SS.mmm */
/* kronometre: toplam 3 hane (S.dss / SS.dss / M:SS.dss) - bastaki sifir yok */
const fms=stopwatchFormat;
const clk=ms=>{const d=new Date(Date.now()+ms);return pad(d.getHours())+':'+pad(d.getMinutes())};
let audioCtx=null;
function prepareAudio(){
  try{
    const Ctx=window.AudioContext||window.webkitAudioContext;
    if(!Ctx)return;
    if(!audioCtx)audioCtx=new Ctx();
    if(audioCtx.state==='suspended')audioCtx.resume().catch(()=>{});
  }catch(_){}
}
function beep(){
  try{
    if(!audioCtx||audioCtx.state!=='running')return;
    const at=audioCtx.currentTime;
    for(const [i,frequency] of [523.25,659.25].entries()){
      const osc=audioCtx.createOscillator(),gain=audioCtx.createGain();
      osc.type='sine';osc.frequency.value=frequency;
      osc.connect(gain);gain.connect(audioCtx.destination);
      const start=at+i*.16;
      gain.gain.setValueAtTime(.0001,start);
      gain.gain.exponentialRampToValueAtTime(.055,start+.035);
      gain.gain.exponentialRampToValueAtTime(.0001,start+.38);
      osc.start(start);osc.stop(start+.4);
    }
  }catch(_){}
}
function pomoPhaseLabel(){return pm.ph==='w'?(tr()?'Odak zamanı':'Focus time'):(pm.lg?t('longBreak'):t('break'))}
function closePomoOverlay(){const el=$('#pomo-overlay');if(el)el.remove()}
function updatePomoOverlay(){
  const el=$('#pomo-overlay');if(!el)return;
  const total=Math.max(1,(pm.ph==='w'?pm.w:(pm.lg?Math.max(pm.b,...(A?.presets||[]).map(p=>Number(p.b)||0)):pm.b))*60);
  const pctRemain=Math.min(100,Math.max(0,pm.left/total*100));
  const ring=$('#pomo-ring');if(ring)ring.style.setProperty('--ring',pctRemain+'%');
  const value=$('#pomo-overlay-time');if(value)value.textContent=ft(pm.left);
  const label=$('#pomo-overlay-phase');if(label)label.textContent=pomoPhaseLabel();
  const toggle=$('#pomo-overlay-toggle');if(toggle)toggle.textContent=pm.run?(tr()?'Duraklat':'Pause'):(tr()?'Devam et':'Resume');
}
function openPomoOverlay(){
  if($('#pomo-overlay')){updatePomoOverlay();return}
  const overlay=document.createElement('div');overlay.id='pomo-overlay';overlay.className='pomo-overlay';
  overlay.innerHTML=`<div class="pomo-panel" role="dialog" aria-label="Pomodoro"><div class="pomo-ring" id="pomo-ring"><div class="pomo-ring-inner"><div id="pomo-overlay-phase" class="pomo-meta">${pomoPhaseLabel()}</div><div class="tm" id="pomo-overlay-time">${ft(pm.left)}</div><div class="pomo-meta">${tr()?'Improvin’ your day.':'Improvin’ your day.'}</div></div></div><div class="row pomo-actions" style="justify-content:center"><button id="pomo-overlay-toggle" onclick="pS()">${tr()?'Duraklat':'Pause'}</button><button class="g" onclick="closePomoOverlay()">${tr()?'Küçült':'Minimize'}</button></div><small class="mut">${tr()?'Küçülttikten sonra sayaç çalışmaya devam eder.':'Timer keeps running when minimized.'}</small></div>`;
  document.body.appendChild(overlay);updatePomoOverlay();
}
let stopwatchView='timer',swTouchX=null,swLapFlashUntil=0;
function swElapsed(){
  const st=A?.stopwatch||{elapsed:0,started:0,running:false};
  return Math.max(0,Number(st.elapsed)||0)+(st.running?Math.max(0,Date.now()-Number(st.started||Date.now())):0);
}
function swRender(){
  const ms=swElapsed(),formatted=stopwatchFormat(ms);
  const e=document.getElementById('sw');if(e){e.textContent=formatted;e.classList.toggle('lap-italic',Date.now()<swLapFlashUntil)}
  const chrono=document.getElementById('chrono-digital');if(chrono){chrono.textContent=formatted;chrono.classList.toggle('lap-italic',Date.now()<swLapFlashUntil)}
  if(stopwatchView==='clock')updateClockFace();
}
function chronographTicks(){
  let output='';
  for(let i=0;i<300;i++)output+=`<i class="chrono-mark ${i%25===0?'major':''}" style="--a:${i*1.2}deg;--h:${i%5===0?'3.2%':'1.45%'}"></i>`;
  for(let v=0;v<60;v+=5){
    const angle=v*Math.PI/30,position=38.5;
    const x=50+position*Math.sin(angle),y=50-position*Math.cos(angle);
    output+=`<span class="chrono-number" style="left:${x}%;top:${y}%">${v}</span>`;
  }
  return output;
}
const CHRONO_TICKS=chronographTicks();
function updateClockFace(){
  const ms=swElapsed(),hand=document.getElementById('chrono-hand');
  if(hand)hand.style.setProperty('--deg',(ms%60000)/60000*360+'deg');
  const sub=document.getElementById('chrono-sub-hand');
  if(sub)sub.style.setProperty('--deg',(ms%1800000)/1800000*360+'deg');
}
function swMode(mode){
  stopwatchView=mode==='clock'?'clock':'timer';
  if(pg==='pomo')P.pomo();
}
function swTouchStart(ev){swTouchX=null;if(ev.target.closest('button,input,textarea'))return;swTouchX=ev.touches?.[0]?.clientX??null}
function swTouchEnd(ev){if(swTouchX==null)return;const delta=(ev.changedTouches?.[0]?.clientX??swTouchX)-swTouchX;swTouchX=null;if(delta>43)swMode('timer');else if(delta< -43)swMode('clock')}
function lap(){
  if(!A?.stopwatch?.running)return;
  if(!Array.isArray(A.laps))A.laps=[];
  A.laps.push(swElapsed());A.laps=A.laps.slice(-100);swLapFlashUntil=Date.now()+820;save();P.pomo();
}
P.pomo=()=>{
  editIdx=-1;
  if(!A.stopwatch||typeof A.stopwatch!=='object')A.stopwatch={elapsed:0,started:0,running:false};
  const pr=A.presets.map((p,i)=>`<div class="tag ${pm.w===p.w&&pm.b===p.b?'on':''}"><span role="button" tabindex="0" style="cursor:pointer;flex:1" onclick="setP(${Number(p.w)},${Number(p.b)})"><b>${fmtDuration(p.w)}</b> ${t('focus')} / <b>${fmtDuration(p.b)}</b> ${t('break')}</span><span class="row"><button class="g s" onclick="editP(${i})">${tr()?'Düzenle':'Edit'}</button><button class="g s d" onclick="delP(${i})">${t('delete')}</button></span></div>`).join('');
  const laps=(A.laps||[]).map((x,i)=>`<div class="lap-row"><span>Lap ${i+1}</span><b>${stopwatchFormat(x)}</b></div>`).reverse().join('');
  M(`<div class="card"><div class="mut" style="text-align:center" id="pl"></div><div class="tm" id="pt">${ft(pm.left)}</div><div class="row" style="justify-content:center"><button onclick="pS()">${pm.run?(tr()?'Duraklat':'Pause'):t('startPause')}</button><button class="g" onclick="pR()">${t('reset')}</button><button class="g" onclick="openPomoOverlay()">${tr()?'Odak ekranı':'Focus screen'}</button></div><p id="pi" class="mut" style="text-align:center"></p></div>
  <div class="card"><h2>${t('focusAndBreak')}</h2>${pr||'<p class="mut">'+t('addLength')+'</p>'}<div class="row"><input id="cw" type="number" min="1" max="600" placeholder="${t('focus')} (${t('minutes')})"><input id="cb" type="number" min="1" max="600" placeholder="${t('break')} (${t('minutes')})"><button onclick="addP()">${tr()?'Ekle / Güncelle':'Add / Update'}</button></div><p class="mut">${t('afterFive')}</p></div>
  <div class="card" data-swipe-stopwatch="true" ontouchstart="swTouchStart(event)" ontouchend="swTouchEnd(event)"><h2>${t('stopwatch')}</h2><div class="row" style="justify-content:center"><button class="${stopwatchView==='timer'?'':'g'} s" onclick="swMode('timer')">${tr()?'Kronometre':'Stopwatch'}</button><button class="${stopwatchView==='clock'?'':'g'} s" onclick="swMode('clock')">${tr()?'Saat':'Clock'}</button></div>
  ${stopwatchView==='timer'?`<div id="sw" class="sw-display">${stopwatchFormat(swElapsed())}</div><div class="row" style="justify-content:center"><button onclick="swS()">${A.stopwatch.running?(tr()?'Duraklat':'Pause'):(tr()?'Başlat':'Start')}</button><button class="g" onclick="lap()" ${A.stopwatch.running?'':'disabled'}>Lap</button><button class="g" onclick="swR()">${t('reset')}</button></div><div class="laps">${laps}</div>`:`<div class="chrono-dial" role="img" aria-label="${tr()?'Analog kronometre':'Analog stopwatch'}">${CHRONO_TICKS}<div class="chrono-mini">${[0,10,20].map(v=>{const a=v*Math.PI/15;return `<span class="chrono-number" style="left:${50+37*Math.sin(a)}%;top:${50-37*Math.cos(a)}%">${v}</span>`}).join('')}<div id="chrono-sub-hand" class="chrono-hand" style="top:12%;height:40%"></div></div><div id="chrono-hand" class="chrono-hand"></div><div class="chrono-pivot"></div><div id="chrono-digital" class="chrono-digital">${stopwatchFormat(swElapsed())}</div></div><div class="chrono-controls"><button onclick="lap()" ${A.stopwatch.running?'':'disabled'}>Lap</button><button class="stop" onclick="swS()">${A.stopwatch.running?(tr()?'Dur':'Stop'):(tr()?'Başlat':'Start')}</button></div><div class="laps">${laps}</div>`}
  <p class="mut" style="text-align:center">${tr()?'Sağa/sola kaydırarak kronometre ile saat arasında geçebilirsin.':'Swipe horizontally to switch between stopwatch and clock.'}</p></div>`);
  pi();swRender();
};

function pi(){
  const e=$('#pi'),l=$('#pl');if(!e)return;
  l.textContent=pm.ph==='w'?`${t('session')} ${pm.n%5+1}/5 · ${fmtDuration(pm.w)}`:(pm.lg?t('longBreak'):t('break'));
  e.textContent=pm.run?`${t('pomoEnds')}: ${clk(pm.left*1000)}`:(pm.w>60&&pm.ph==='w'?`${pm.w} ${t('minutes')} · ${t('alreadyEnds')} ${clk(pm.left*1000)}`:'');updatePomoOverlay();
}
function setP(w,b){clearInterval(pm.iv);pm={...pm,w,b,ph:'w',left:w*60,run:0,end:0,n:0,lg:0,iv:0};persistPomodoroState();document.title=TITLE;closePomoOverlay();P.pomo()}
let editIdx=-1;
function editP(i){const p=A.presets[i];$('#cw').value=p.w;$('#cb').value=p.b;editIdx=i}
function delP(i){A.presets.splice(i,1);save();P.pomo()}
function addP(){
  const w=Math.round(+$('#cw').value),b=Math.round(+$('#cb').value);
  if(w>0&&b>0&&w<=600&&b<=600){if(editIdx>=0){A.presets[editIdx]={w,b};editIdx=-1}else A.presets.push({w,b});save();setP(w,b)}
}
function pTick(silent=false){
  if(!pm.run||!pm.end)return;
  const now=Date.now();let transitions=0,changed=false;
  while(pm.end<=now&&transitions<10000){
    if(!silent&&transitions===0&&document.visibilityState==='visible')beep();
    let nextMinutes;
    if(pm.ph==='w'){
      pm.n++;pm.ph='b';pm.lg=pm.n%5===0?1:0;
      const breaks=Array.isArray(A&&A.presets)?A.presets.map(p=>Number(p.b)).filter(v=>Number.isFinite(v)&&v>0):[];
      nextMinutes=pm.lg?Math.max(pm.b,...breaks):pm.b;
    }else{
      pm.ph='w';pm.lg=0;nextMinutes=pm.w;
    }
    pm.end+=Math.max(1,nextMinutes)*60000;
    transitions++;changed=true;
  }
  if(pm.end<=now)pm.end=now+1000;
  pm.left=Math.max(0,Math.ceil((pm.end-now)/1000));
  const t2=$('#pt');if(t2)t2.textContent=ft(pm.left);
  if(A)document.title=ft(pm.left)+' · '+TITLE;
  if(changed)persistPomodoroState();
  pi();swRender();
}
function pS(){
  prepareAudio();
  if(pm.run){
    pTick(true);clearInterval(pm.iv);pm.iv=0;pm.run=0;pm.end=0;
  }else{
    pm.run=1;pm.end=Date.now()+Math.max(1,pm.left)*1000;
    if(document.visibilityState==='visible')requestAnimationFrame(()=>beep());
    clearInterval(pm.iv);pm.iv=setInterval(()=>pTick(),500);
    recordActivity();openPomoOverlay();
  }
  persistPomodoroState();pi();updatePomoOverlay();
}

// V11: evidence of cloud history is never silently downgraded to a local account.
// A copied browser profile is NOT proof of an active authenticated cloud session.
function accountCloudHints(account){
  return !!(account && (account.authUid || account.accountOrigin==='cloud' ||
    account.googleConnected===true || account.loginMethod==='google' || account.loginMethod==='password'));
}
function accountConnection(account=A){
  if(!account)return 'unknown';
  if(accountCloudHints(account)){
    const session=sbSession();
    return account.authUid && session?.access_token && session.user?.id===account.authUid ? 'cloud' : 'unknown';
  }
  return account.accountOrigin==='local' && typeof account.pw==='string' && account.pw.length>0
    ? 'local' : 'unknown';
}

let settingGooglePassword=false;
async function setGoogleAccountPassword(){
  if(settingGooglePassword||!A?.authUid||A.loginMethod!=='google')return;
  const passEl=document.getElementById('google-app-pass');
  const confirmEl=document.getElementById('google-app-pass-confirm');
  const password=String(passEl?.value||''),confirm=String(confirmEl?.value||'');
  const error=pwOk(password,A.u);
  if(error){toast(error);return}
  if(password!==confirm){toast(tr()?'Şifreler eşleşmiyor.':'Passwords do not match.');return}
  settingGooglePassword=true;
  const button=document.getElementById('google-app-pass-submit');
  if(button)button.disabled=true;
  try{
    // Local profile metadata is NOT proof of identity. Revalidate the Auth user.
    const user=await sbCurrentUser();
    if(!user?.id||user.id!==A.authUid)throw new Error('Identity mismatch');
    const updated=await sb('/auth/v1/user',{method:'PUT',body:{password}});
    if(!updated?.id||updated.id!==A.authUid)throw new Error('Password update unverified');
    // Do not cache or sync the password. Supabase Auth owns it.
    if(passEl)passEl.value='';
    if(confirmEl)confirmEl.value='';
    msg=tr()?'Uygulama şifresi belirlendi. Artık aynı e-posta ve yeni şifreyle manuel giriş yapabilirsin. Google girişi de çalışır.':'App password saved. You can now sign in with your email and new password. Google sign-in still works.';
    P.set();
  }catch(e){
    if(passEl)passEl.value='';
    if(confirmEl)confirmEl.value='';
    toast(tr()?'Şifre kaydedilemedi. Google ile yeniden giriş yapıp tekrar dene; güvenlik doğrulaması isteniyor olabilir.':'Could not save the password. Sign in with Google again and retry; additional verification may be required.');
  }finally{
    settingGooglePassword=false;
    const submit=document.getElementById('google-app-pass-submit');
    if(submit)submit.disabled=false;
  }
}
async function chPw(){
  const oldPass=String($('#op')?.value||''),newPass=String($('#np')?.value||'');
  const problem=pwOk(newPass,A.u);if(problem){msg=problem;return P.set()}
  if(A.authUid){
    try{
      const email=A.email;const j=await sbSignIn(A.u,oldPass,email);
      if(!j?.user?.id||j.user.id!==A.authUid)throw new Error('Identity mismatch');
      sbSave({...j,at:Date.now()});
      await sb('/auth/v1/user',{method:'PUT',body:{password:newPass}});
      msg=t('pwChanged');P.set();
    }catch(_){msg=tr()?'Mevcut şifre yanlış veya sunucuya ulaşılamadı.':'Current password invalid or server unavailable.';P.set()}
    return;
  }
  if(!await pwMatch(A,oldPass)){msg=t('currentWrong');return P.set()}
  await setPw(A,newPass);save();msg=t('pwChanged');P.set();
}

// V10: export only the current signed-in app snapshot, never credentials or other accounts.
function exportDataSnapshot(account){
  if(!account||typeof account!=='object')throw new Error('No active account');
  const copy=JSON.parse(JSON.stringify(account));
  for(const field of ['pw','salt','pwAt','authUid','access_token','refresh_token','token','loginMethod','googleConnected','accountOrigin'])delete copy[field];
  return {
    format:'improvin-your-day-export',version:1,exportedAt:new Date().toISOString(),
    scope:'Loaded application account on this device; not a full Supabase service export',
    account:copy
  };
}
function exportMyData(){
  if(!A)return;
  try{
    const snapshot=exportDataSnapshot(A);
    const bytes=new Blob([JSON.stringify(snapshot,null,2)],{type:'application/json;charset=utf-8'});
    const url=URL.createObjectURL(bytes),a=document.createElement('a');
    const safeName=String(A.u||'account').replace(/[^a-zA-Z0-9_-]/g,'-').slice(0,35)||'account';
    a.href=url;a.download=`improvin-${safeName}-${new Date().toISOString().slice(0,10)}.json`;
    document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);
    toast(tr()?'JSON dosyası hazır. Gizli notlar içerebilir.':'JSON export prepared. It may contain private notes.');
    return true;
  }catch(e){toast(tr()?'Dosya oluşturulamadı. Tarayıcı indirme izinlerini kontrol et.':'Could not create the file. Check your browser download settings.');return false}
}

let accountDeletionBusy=false;
let pendingDeleteUid=null;
function accountDeletionMessage(code){
  const messages={
    UNAUTHORIZED:["Oturum doğrulanamadı. Hesabından çıkıp yeniden giriş yap.","Session could not be verified. Sign out and sign in again."],
    DELETION_DISABLED:["Hesap silme sunucuda henüz etkin değil. Şimdilik indirme özelliğini kullanabilirsin.","Server-side account deletion is not yet enabled. You can download your data."],
    RECENT_SIGN_IN_REQUIRED:["Güvenlik için yeniden giriş yapıp ardından işlemi tekrarla.","For security, sign in again before trying this action."],
    CONFIRMATION_REQUIRED:["Onay metni veya e-posta eşleşmedi.","The confirmation phrase or email did not match."],
    DELETE_FAILED:["Hesap silinemedi. Sunucu günlükleri kontrol edilmeli; Storage sahipliği de engel olabilir.","Account deletion failed. Check server logs; Storage ownership may block it."],
    ORIGIN_NOT_ALLOWED:["Bu site adresi sunucu izin listesinde değil.","This site origin is not allowed by the server."],
    SERVER_CONFIGURATION_ERROR:["Sunucu yapılandırması eksik; hiçbir hesap silinmedi.","The server is not configured; no account was deleted."],
    TIMEOUT:["İstek zaman aşımına uğradı. Hesap durumunu kontrol etmeden tekrar silmeyi deneme.","Request timed out. Verify account state before retrying deletion."],
    NETWORK:["Bağlantı kurulamadı. Daha sonra yeniden kontrol et.","Could not connect. Check again later."]
  };
  return (messages[code]||["İşlem doğrulanamadı. Hesap durumunu kontrol et.","Could not verify the action. Check account state."])[tr()?0:1];
}
async function accountFunction(action,fields={},retry=true){
  const session=sbSession();
  if(accountConnection(A)!=='cloud'||!session?.access_token||session?.user?.id!==A.authUid){
    const error=new Error('UNAUTHORIZED');error.code='UNAUTHORIZED';throw error;
  }
  const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),12000);
  try{
    const response=await fetch(SUPABASE_URL+'/functions/v1/delete-account',{
      method:'POST',headers:{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+session.access_token,'Content-Type':'application/json'},
      body:JSON.stringify({action,...fields}),signal:controller.signal,cache:'no-store'
    });
    let result=null;try{result=await response.json()}catch(_){}
    if(!response.ok){
      if(response.status===401&&retry&&await sbRefresh())return accountFunction(action,fields,false);
      const error=new Error(String(result?.code||'HTTP_'+response.status));error.code=result?.code||(response.status===401?'UNAUTHORIZED':'HTTP_'+response.status);throw error;
    }
    return result;
  }catch(e){
    if(e.name==='AbortError'){const error=new Error('TIMEOUT');error.code='TIMEOUT';throw error}
    if(e.code)throw e;
    const error=new Error('NETWORK');error.code='NETWORK';throw error;
  }finally{clearTimeout(timer)}
}
async function delAcc(){
  if(!A||accountDeletionBusy)return;
  pendingDeleteUid=null;
  const connection=accountConnection(A);
  if(connection==='unknown'){
    openModal('account-deletion-unknown',`<h2>${tr()?'Hesap bağlantısı doğrulanamadı':'Account connection unverified'}</h2><p class="account-data-alert">${tr()?'Bu profili yanlışlıkla yalnızca yerel saymayacağız. Hiçbir hesap veya veri silinmedi. Önce verilerini indir, sonra çıkış yapıp Google ya da e-posta/şifreyle yeniden giriş yap.':'We will not assume this is a local-only profile. No account or data was deleted. Export your data, sign out, then sign in again with Google or email/password.'}</p><button onclick="closeModal('account-deletion-unknown')">${tr()?'Anladım':'Got it'}</button>`);
    return;

  try{rows=await sb('/rest/v1/rpc/iydu_load',{method:'POST',body:{p_username:''}})}
  catch(e){if(e.status===401&&await sbRefresh())rows=await sb('/rest/v1/rpc/iydu_load',{method:'POST',body:{p_username:''}});else throw e}
  const row=Array.isArray(rows)?rows[0]:rows;
  if(row?.data&&(!row.data||typeof row.data!=='object'||Array.isArray(row.data)))throw new Error('Invalid cloud data');
  return row?.data||null;
}
async function restoreCloudOnLoad(){
  if(!sbSession()?.access_token){if(sbSession()?.refresh_token&&!await sbRefresh())return;else if(!sbSession()?.access_token)return}
  try{
    const user=await sbCurrentUser();
    if(!user?.id)return;
    const session=sbSession();if(!session)return;
    sbSave({...session,user});
    const remote=await sbPull();
    const local=Object.values(DB.accounts).find(a=>a.authUid===user.id);
    const meta=user.user_metadata||{};
    const a=norm(remote||local||{u:meta.username||user.email?.split('@')[0]||'user',nick:meta.nick||meta.username||'User'});
    a.authUid=user.id;a.accountOrigin='cloud';a.email=user.email||a.email;a.mail=a.email;a.pw='';delete a.salt;
    if(user.app_metadata?.providers?.includes('google'))a.googleConnected=true;
    v13ProtectLegacyCollision(a.u,user.id);
    DB.accounts[a.u]=a;DB.lastUser=a.u;DB.last=a.nick;A=a;
    view='app';pg='home';restorePomodoroState();applyTheme();save();renderAppOrAuth();
    if(!remote)await sbPush();
  }catch(e){
    // Do not auto-login from unverified localStorage contents.
    if(e.status===401)sbClear();
    if(e.message==='V13_LOCAL_USERNAME_COLLISION'){
      sbClear();msg=tr()?'Bulut kullanıcı adı bu cihazdaki eski yerel hesapla çakışıyor. Eski veri korunuyor. Yerel hesabından JSON yedeği al ve aktarım adımını kullan.':'A cloud username conflicts with a legacy profile on this device. Local data was preserved. Export it and use the migration flow.';
    }
    if(!A){view='login';renderAppOrAuth()}
  }
}

function toggleBeige(){setTheme(curTheme()==='cacao'?'porcelain':'cacao')}

view='welcome';pg='home';A=null;
applyTheme();renderAppOrAuth();
bootstrapCloudAuth();
window.addEventListener('pageshow',e=>{if(e.persisted&&A){pg='home';renderAppOrAuth()}else if(e.persisted&&!A)restoreCloudOnLoad()});
