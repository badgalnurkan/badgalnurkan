<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Improvin' your day</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6eee3">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Nunito:wght@400;600;700&display=swap">
<style>
:root{--bg:#f6eee3;--card:#fffaf3;--ink:#4a3426;--mut:#9a8068;--acc:#a9714b;--acc2:#e3c3a1;--ok:#6fa876;--no:#c76b5a;--ln:#ecdcc8;--sh:0 12px 32px #8a5a3a16;--fs:'Fraunces',Georgia,'Times New Roman',serif;--okbg:#e6f1e6}
:root[data-t=dark]{--bg:#221914;--card:#2e221b;--ink:#f3e8da;--mut:#b09a84;--acc:#d2a074;--acc2:#6b4a33;--ok:#7bbd83;--no:#d7796a;--ln:#40302a;--sh:0 12px 32px #0006;--okbg:#2a3a2c}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;scroll-padding-top:env(safe-area-inset-top,0px);font-size:clamp(16px,.35vw + 11px,24px);overflow-y:scroll}
@media(min-width:1600px){html{font-size:clamp(15.5px,.45vw + 11px,16px)}}
/* mobil: okunakli taban olcu */
@media(max-width:600px){html{font-size:clamp(16px,4.4vw,17.5px)}}
@media(max-width:360px){html{font-size:16px}}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Nunito',system-ui,-apple-system,'Segoe UI',Roboto,Ubuntu,sans-serif;line-height:1.6;transition:background .4s,color .4s;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
#app{display:flex;flex-direction:column;flex:1;width:100%;transition:opacity .22s ease}
#app.soft-out{opacity:0}
button,input,select,textarea{font:inherit;color:inherit}
button{background:var(--acc);color:#fff;border:0;border-radius:999px;padding:.6em 1.4em;min-height:2.75rem;font-weight:600;cursor:pointer;box-shadow:0 4px 14px #a9714b33;transition:transform .2s,box-shadow .2s,background .3s;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button:hover{transform:translateY(-1px);box-shadow:0 6px 18px #a9714b44}
button.g{background:transparent;border:1.5px solid var(--ln);color:var(--ink);box-shadow:none}
button.g:hover{border-color:var(--acc)}
button.s{min-height:2.2rem;padding:.25em .9em;font-size:.82rem}
button.d{color:var(--no);border-color:var(--no)}
button:disabled{opacity:.35;cursor:not-allowed;transform:none}
input,select,textarea{background:var(--bg);border:1.5px solid var(--ln);border-radius:16px;padding:.7em 1.1em;width:100%;margin:.3em 0 .8em;font-size:max(16px,1rem);transition:border .3s}
textarea{resize:vertical}
input:focus,textarea:focus{outline:0;border-color:var(--acc)}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
label{font-size:.9rem;font-weight:600}
.shell{display:flex;flex:1;max-width:80rem;margin:0 auto;width:100%;align-items:flex-start;padding:0 1rem;gap:1.2rem}
aside{width:16rem;background:var(--card);margin:1.2rem 0;border-radius:24px;box-shadow:var(--sh);padding:1.4rem 1rem;display:flex;flex-direction:column;gap:.3rem;transition:background .4s;flex-shrink:0;position:sticky;top:1rem}
aside .lg{font-family:var(--fs);font-weight:700;font-size:1.4rem;line-height:1.2;color:var(--acc);margin-bottom:1rem;word-break:break-word;cursor:pointer;padding:0 .5rem}
aside .lg small{display:block;font-family:'Nunito',system-ui,sans-serif;font-size:.8rem;font-weight:600;color:var(--mut);margin-bottom:.2rem}
aside a{padding:.7em 1rem;border-radius:999px;cursor:pointer;color:var(--mut);font-weight:600;font-size:.95rem;transition:all .25s;-webkit-tap-highlight-color:transparent}
aside a:hover{background:var(--bg);color:var(--ink)}
aside a.on{background:var(--acc);color:#fff;box-shadow:0 4px 14px #a9714b33}
aside a.press{transform:scale(.96);background:color-mix(in srgb,var(--acc) 22%,transparent)}
aside a{transition:background .22s ease,color .22s ease,transform .16s ease}
aside a.on{font-weight:800;letter-spacing:.005em}
@supports not (background:color-mix(in srgb,red,blue)){aside a.press{background:var(--bg)}}
main{transition:opacity .18s ease}
main.swap{opacity:0}
main.an{animation:pgIn .32s cubic-bezier(.2,.7,.2,1) both}
@keyframes pgIn{from{opacity:0;transform:translate3d(0,var(--pg-dy,8px),0)}to{opacity:1;transform:none}}
@media(max-aspect-ratio:3/4){main{--pg-dy:10px}}
@media(min-aspect-ratio:16/10){main{--pg-dy:6px}}
@media(prefers-reduced-motion:reduce){main.an{animation:none}}
aside a{transition:background .22s ease,color .22s ease,transform .16s ease,box-shadow .22s ease}
main{flex:1;min-width:0;padding:1.2rem 0;max-width:54rem;margin:0 auto;width:100%;animation:fi .3s ease;display:flex;flex-direction:column;gap:1.2rem}
@keyframes fi{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
header.top{display:flex;justify-content:space-between;align-items:center;gap:.6rem;padding:.9rem 1.5rem;background:var(--card);border-bottom:1px solid var(--ln);color:var(--mut);font-size:.95rem;transition:all .4s;position:relative}
header.top b{font-family:var(--fs);font-size:1.15rem;color:var(--acc);cursor:pointer}
.lv2 header.top,.lv3 header.top,.lv4 header.top{background:linear-gradient(90deg,var(--card),var(--bg));border-bottom:2px solid var(--acc)}
.lv3 .card,.lv4 .card{box-shadow:0 14px 40px #8a5a3a2a}
.lv4 aside .lg{letter-spacing:.06em}
.card{background:var(--card);border:1px solid var(--ln);border-radius:24px;box-shadow:var(--sh);padding:1.5rem;transition:all .3s}
h1,h2,h3{font-family:var(--fs);font-weight:600;margin:.2em 0 .5em}
h1,h2{font-size:1.3rem}h3{font-size:1.05rem}
.mut{color:var(--mut)}
.row{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center}
.row>input{flex:1;min-width:8rem;margin:0}
.center{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:clamp(1rem,3vw,1.5rem);width:100%}
.welcome-screen{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;justify-content:space-between;padding:1.5rem;position:relative}
/* ust satir: marka solda, tema sagda — mobilde ust uste binmez */
.welcome-top{display:flex;align-items:center;justify-content:space-between;gap:.6rem;flex-wrap:wrap}
.welcome-top .themebar{margin:0!important;justify-content:flex-end!important}
@media(max-width:600px){
  .welcome-screen{padding:1rem}
  .welcome-top{gap:.35rem}
  .welcome-top .brand-badge{font-size:1.05rem}
  .welcome-top .themebar button{padding:.3em .7em;font-size:.72rem;min-height:2rem}
  .welcome-top .themebar small{display:none}
}
@media(max-width:360px){.welcome-top .themebar button{padding:.28em .55em;font-size:.68rem}}
.brand-badge{font-family:var(--fs);font-weight:700;font-size:1.2rem;color:var(--acc);letter-spacing:.05em}
.welcome-center{display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;margin:auto;max-width:30rem;width:100%;padding:1rem 0}
.welcome-footer-bar{display:flex;justify-content:space-between;align-items:flex-end;width:100%;font-size:.85rem;color:var(--mut);gap:1rem}
.social-links{display:flex;flex-direction:column;text-align:right;gap:.2rem}
.social-links a{color:var(--mut);text-decoration:none;transition:color .2s}
.social-links a:hover{color:var(--acc)}
.box{max-width:26rem;width:100%;text-align:left}
/* giris/kayit kutusu: dengeli en-boy orani (ekrani kaplamaz, kucuk de kalmaz) */
.login-wrap{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:1.2rem;gap:.4rem}
.login-wrap>.langbar,.login-wrap>.themebar{max-width:26rem;margin:0 auto}
.login-wrap .box{max-width:clamp(20rem,34vw,27rem)}
/* ust serit: solda tema, sagda dil; ikisi ayni hizada ve kutu kenarlarina simetrik */
.login-top{width:100%;max-width:clamp(20rem,34vw,27rem);margin:.2rem auto .7rem;display:flex;align-items:center;justify-content:space-between;gap:.6rem}
.login-top .themebar{display:flex;flex-wrap:nowrap;align-items:center;gap:.3rem!important;margin:0!important;justify-content:flex-start!important;width:auto}
.login-top .themebar>small{margin:0 .15rem 0 0!important}
.login-top .themebar button,.login-top .langbar button{min-height:2.1rem;padding:.3em .8em;font-size:.8rem;line-height:1}
.login-top .langbar{display:flex;flex-wrap:nowrap;gap:.3rem;width:auto;margin:0;justify-content:flex-end}
.login-top .langbar button{min-width:2.6rem;padding:.3em .65em}
@media(min-width:901px) and (min-aspect-ratio:1/1){.login-top{max-width:clamp(21rem,26vw,26rem)}}
@media(min-width:601px) and (max-width:1024px){.login-top,.login-wrap .box{max-width:min(26rem,86vw)}}
@media(max-width:600px){.login-top{max-width:100%;margin:.1rem auto .6rem}}
@media(max-width:380px){
  .login-top{gap:.35rem}
  .login-top .themebar>small{display:none}
  .login-top .themebar button,.login-top .langbar button{padding:.28em .6em;font-size:.74rem;min-height:2rem}
  .login-top .langbar button{min-width:2.3rem}
}
@media(max-height:500px) and (orientation:landscape){.login-top{max-width:min(26rem,90vw);margin:.1rem auto .4rem}.login-wrap{padding-top:.5rem}}
@media(min-width:901px) and (min-aspect-ratio:1/1){
  .login-wrap .box{max-width:clamp(21rem,26vw,26rem)}
  .login-wrap .box input{font-size:.98rem;padding:.62em 1em;margin:.25em 0 .7em}
  .login-wrap .box h2{font-size:1.2rem;margin-bottom:.6rem}
}
@media(max-height:640px){.login-wrap{justify-content:flex-start;padding-top:.6rem}}
/* simetri: ust serit ile giris kutusu ayni genislik ve ayni kenar (en-boy oranina gore) */
.login-wrap{--lw:clamp(20rem,34vw,27rem)}
@media(min-width:901px) and (min-aspect-ratio:1/1){.login-wrap{--lw:clamp(21rem,26vw,26rem)}}
@media(min-width:601px) and (max-width:1024px){.login-wrap{--lw:min(26rem,86vw)}}
@media(max-width:600px){.login-wrap{--lw:100%;padding-left:clamp(.75rem,4vw,1.2rem);padding-right:clamp(.75rem,4vw,1.2rem)}}
@media(max-height:500px) and (orientation:landscape){.login-wrap{--lw:min(26rem,90vw)}}
.login-wrap .center{padding:0;min-height:auto;width:100%}
.login-wrap .login-top,.login-wrap .box{width:100%;max-width:var(--lw)!important;box-sizing:border-box}
.big{font-family:var(--fs);font-size:clamp(2.2rem,7vw,4.2rem);font-weight:600;letter-spacing:.04em;line-height:1.1;text-align:center;margin:.2em 0 .4em;color:var(--ink)}
.task{display:flex;align-items:center;gap:.7rem;padding:.8rem 1rem;background:var(--bg);border:1.5px solid var(--ln);border-radius:16px;margin:.5rem 0;transition:all .4s}
.task span{flex:1;min-width:0;overflow-wrap:anywhere;transition:color .4s}
.task.done{background:var(--okbg);border-color:var(--ok)}
@supports(background:color-mix(in srgb,red,blue)){.task.done{background:color-mix(in srgb,var(--ok) 16%,var(--card))}}
.task.done span{color:var(--ok);text-decoration:line-through}
.task.miss{border-color:var(--no);opacity:.85}
.task.shake{animation:sh .45s}
@keyframes sh{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.ck,.xx{width:2.5rem;height:2.5rem;min-height:0;padding:0;border-radius:50%;background:transparent;border:2px solid var(--ln);color:var(--mut);box-shadow:none;transition:all .35s;flex-shrink:0}
.ck.on{background:var(--ok);border-color:var(--ok);color:#fff}
.xx.on{background:var(--no);border-color:var(--no);color:#fff}
.cal{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:1rem;justify-content:center}
.dot{width:3.2rem;height:3.2rem;border-radius:16px;background:var(--ln);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:.65rem;cursor:pointer;transition:all .25s;color:var(--mut);gap:1px;border:0;padding:0;min-height:0;box-shadow:none}
.dot span{font-size:.9rem;font-weight:700}
.dot small{font-size:.55rem;opacity:.85;text-transform:uppercase}
.cal .dot{height:3.75rem}
.dot em.dpct{font-style:normal;font-size:.6rem;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;opacity:.95}
@media(max-aspect-ratio:3/4){.cal .dot{height:calc(clamp(2.2rem,13vw,3rem) + .7rem)}}
.dot.ok{background:var(--ok);color:#fff}
.dot.miss-dot{background:var(--mut);color:#fff;opacity:.75}
.dot.td{outline:2px solid var(--acc);outline-offset:2px}
.dot:hover{transform:scale(1.08)}
.bar{height:.65rem;background:var(--ln);border-radius:10px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);transition:width .6s}
.tm{font-family:var(--fs);font-size:clamp(2.6rem,8vw,5rem);font-weight:600;color:var(--acc);text-align:center;font-variant-numeric:tabular-nums}
.tag{display:flex;align-items:center;justify-content:space-between;gap:.5rem;flex-wrap:wrap;background:var(--bg);border:1.5px solid var(--ln);border-radius:14px;padding:.5rem 1rem;margin:.3rem 0;font-size:.95rem}
.tag.on{border-color:var(--acc)}
.note{background:var(--bg);border:1px dashed var(--acc);border-radius:12px;padding:.6em 1em;margin:.5em 0;font-size:.9rem}
.qa{display:flex;gap:.5rem;align-items:flex-start}
.qa textarea{margin:0;flex:1}
.qcap{text-align:right;font-size:.78rem;margin:.2rem 0 .8rem}
.pct-big{font-family:var(--fs);font-size:clamp(2.4rem,8vw,4rem);font-weight:700;color:var(--acc);line-height:1}
footer{text-align:center;padding:1rem;color:var(--mut);font-size:.8rem;background:var(--card);border-top:1px solid var(--ln);width:100%;margin-top:auto}
#ck[hidden]{display:none}
#ck{position:fixed;left:1rem;right:1rem;bottom:calc(1rem + env(safe-area-inset-bottom,0px));z-index:99;background:var(--card);border:1px solid var(--acc);border-radius:14px;padding:1rem;display:flex;gap:.8rem;flex-wrap:wrap;align-items:center;justify-content:space-between;max-width:42rem;margin:auto;box-shadow:var(--sh)}
.mini-popup{display:none;position:fixed;top:0;left:0;right:auto;background:var(--card);border:1px solid var(--ln);border-radius:18px;padding:clamp(.7rem,2vw,1rem);box-shadow:0 18px 50px #00000055;z-index:99999;width:min(20rem,calc(100vw - 1.2rem));max-height:min(78vh,34rem);overflow:auto;text-align:center;-webkit-overflow-scrolling:touch;touch-action:manipulation}
#mini-backdrop{position:fixed;inset:0;background:transparent;z-index:99998}
#mini-backdrop[hidden]{display:none}
.mini-cal-grid{display:flex;flex-wrap:wrap;gap:.3rem;margin-top:.5rem;justify-content:center}
.mini-dot{position:relative;width:2rem;height:2rem;border-radius:50%;background:var(--ln);display:grid;place-items:center;font-size:.7rem;color:var(--mut)}
.mini-dot.td{outline:2px solid var(--acc);font-weight:700;color:var(--acc)}
.mini-dot::after{content:attr(data-day);position:absolute;bottom:125%;left:50%;transform:translateX(-50%) translateY(4px);background:var(--ink);color:var(--bg);font-size:.65rem;padding:3px 7px;border-radius:6px;white-space:nowrap;opacity:0;visibility:hidden;transition:opacity .25s,transform .25s,visibility .25s;pointer-events:none;z-index:100}
.mini-dot:hover::after{opacity:1;visibility:visible;transform:translateX(-50%)}
/* mini takvim (header sag ust): sayinin uzerine gelince yumusak fade-in / fade-out + acik bej */
.mini-dot{transition:background .45s ease,color .45s ease,box-shadow .45s ease,opacity .45s ease,transform .45s ease,filter .45s ease}
.mini-cal-grid .mini-dot:hover,.mini-cal-grid .mini-dot.lit{background:#f7ecdc;color:#a8845c;box-shadow:0 6px 16px #8a5a3a33;transform:translateY(-1px) scale(1.12)}
.mini-cal-grid .mini-dot span{transition:color .45s ease}
.mini-cal-grid .mini-dot:hover span,.mini-cal-grid .mini-dot.lit span{color:#a8845c}
.mini-dot.future{background:transparent;border:1.5px dashed var(--ln);color:var(--mut);opacity:.6}
.mini-dot.fog{background:var(--ln);color:var(--mut);opacity:.5;filter:blur(.6px) saturate(.4)}
.mini-cal-grid .mini-dot.fog:hover,.mini-cal-grid .mini-dot.fog.lit{filter:none;opacity:1}
.mini-dot.note{position:relative}
.mini-dot span{font-weight:600;font-size:.72rem;line-height:1}
.mini-dot small{display:none}
.mini-dot.note::before{content:'•';position:absolute;top:-2px;right:1px;font-size:.6rem;color:var(--acc)}
#top-date-trigger{transition:color .35s,background .35s,box-shadow .35s,transform .35s;padding:.25em .7em;border-radius:999px;display:inline-flex;align-items:center;gap:.35em}
#top-date-trigger:hover{color:var(--acc);background:var(--bg);transform:translateY(-1px)}
#top-date-trigger.lit{color:#7a5636;background:#f7ecdc;box-shadow:0 6px 18px #8a5a3a2a}
#top-date-trigger small{font-size:.72rem;opacity:.85;font-weight:600}
.mini-popup{animation:mpIn .32s cubic-bezier(.2,.7,.2,1) both}
/* TV / uzaktan kumanda ve klavye: odak gorunur, hedefler buyuk */
aside a:focus-visible,button:focus-visible,.dot:focus-visible,.mini-dot:focus-visible{outline:3px solid var(--acc);outline-offset:3px}
@media(min-width:1700px) and (min-aspect-ratio:16/9){
html{font-size:16px}html{font-size:16px}aside{width:18.5rem}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
/* mobil menu: takilma/jitter yok, dokunma hedefleri buyuk, smooth kaydirma */
aside{-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;touch-action:pan-x;scroll-behavior:smooth;scrollbar-width:none}
aside::-webkit-scrollbar{display:none}
aside a{flex:0 0 auto;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
@media(hover:none),(pointer:coarse){
  aside a:hover{transform:none;background:transparent;color:var(--mut)}
  aside a.on:hover{background:var(--acc);color:#fff}
  aside a{padding:.55em 1.05em;min-height:2.75rem;height:2.75rem;display:flex;align-items:center;justify-content:center;line-height:1;font-size:.92rem}
  aside{gap:.35rem;scroll-padding-inline:.4rem;scroll-snap-type:x proximity}
}
::view-transition-old(root){animation:vtOut .28s ease both}
::view-transition-new(root){animation:vtIn .28s ease both}
@keyframes vtOut{to{opacity:0}}
@keyframes vtIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){::view-transition-new(root){animation:none}}
/* ---- tum cihazlarda ayni gecisler: TV, telefon, tablet, dokunmatik ---- */
.emenv{display:flex;justify-content:center;gap:.5rem;flex-wrap:wrap;margin-bottom:.6rem}
.row{row-gap:.5rem}
.card,.task,.tag,.note{max-width:100%;overflow-wrap:anywhere}
[role=button]{-webkit-user-select:none;user-select:none}
@media(hover:none),(pointer:coarse){
  button,a[role=button],.dot,.mini-dot,.ck,.xx{min-height:2.9rem}
  button.s,.ck,.xx,.dot{min-height:2.6rem}
  button:hover,a[role=button]:hover{transform:none;box-shadow:none}
  aside a:hover{background:transparent;color:var(--mut)}
  aside a.on:hover{background:var(--acc);color:#fff}
  .dot:hover{transform:none}
}
/* telefon */
@media(max-width:600px){
  .shell{padding:0 .6rem}
  .card{padding:1rem;border-radius:18px}
  h1,h2{font-size:1.15rem}
  .pct-big{font-size:clamp(2rem,11vw,3rem)}
  header.top{flex-wrap:wrap;row-gap:.3rem}
  .row>button{flex:1 1 auto}
  .qa{flex-direction:column}.qa button{align-self:flex-end}
  .dot{width:clamp(2.4rem,15vw,3rem);height:clamp(2.4rem,15vw,3rem)}
}
/* tablet: kendi olcusu */
@media(min-width:601px) and (max-width:1024px){
  aside{width:13.5rem}

}
/* televizyon / cok genis ekran: uzaktan kumanda icin buyuk hedefler ve odak */
@media(min-width:1700px){
  button{min-height:2.9rem;padding:.6em 1.45em}
  aside a{padding:.75em 1.05em}
  .dot{width:3.2rem;height:3.2rem}
  .shell{max-width:84rem}
  main{max-width:56rem}
}
/* TV: uzaktan kumanda icin buyuk hedefler, ama yazi boyu sabit */
@media(min-height:1000px) and (min-aspect-ratio:16/9) and (pointer:coarse){
  button{min-height:3.25rem;padding:.7em 1.6em}

  .dot{width:3.6rem;height:3.6rem}
}
@media(min-width:2400px){.shell{max-width:92rem}main{max-width:60rem}}
:focus-visible{outline:3px solid var(--acc);outline-offset:3px}
/* ---- cihaza gore ince ayar (data-dev) ---- */
html[data-dev=phone] .shell{padding:0 .55rem}
html[data-dev=phone] .card{padding:.95rem;border-radius:18px}
html[data-dev=phone] .big{font-size:clamp(2rem,9vw,3rem)}
html[data-dev=phone] .dot{width:clamp(2.3rem,14vw,2.9rem);height:clamp(2.3rem,14vw,2.9rem)}
html[data-dev=phone] header.top{padding:.7rem .8rem;font-size:.9rem}
html[data-dev=tablet] .shell{padding:0 .9rem;gap:.9rem}
html[data-dev=tablet] aside{width:14rem}
html[data-dev=tv] .shell{max-width:96rem}
html[data-dev=desktop-xl] main{max-width:58rem}
html[data-dev=desktop-xl] .shell{max-width:84rem}
html[data-orient=landscape][data-dev=phone] .welcome-screen{min-height:auto}
html[data-orient=landscape][data-dev=phone] .center{min-height:auto;padding:1rem}
/* ---- telefonda sayi kaymasi yok: rakamlar sabit genislikte ---- */
.tm,.pct-big,.dot span,.mini-dot,.qcap,#sync,.bar,.tag b,aside a{font-variant-numeric:tabular-nums;font-feature-settings:'tnum' 1}
.dot span,.mini-dot{display:inline-block;min-width:1.35em;text-align:center;line-height:1.05}
.dot small{display:block;line-height:1}
/* ---- dokunmatikte "geri atma" (sayfa ziplamasi) engeli ---- */
html,body{overscroll-behavior-y:auto;overflow-x:clip}
body{-webkit-overflow-scrolling:touch}
aside a,button,.dot,.mini-dot{touch-action:pan-y pinch-zoom}
aside{-webkit-overflow-scrolling:touch;overscroll-behavior:contain;touch-action:pan-x pan-y;scroll-behavior:smooth}
main{scroll-margin-top:.5rem}
/* mobil: dengeli satir araligi ve okunakli kucuk metin */
@media(max-width:600px){
  body{line-height:1.55}
  .mut,small,.qcap{font-size:max(.82rem,12.5px)}
  button{font-size:1rem}
  input,textarea,select{font-size:16px}
  h1,h2{font-size:1.18rem}
  h3{font-size:1.02rem}
  .card{gap:.2rem}
  .row{gap:.5rem}
}
.mini-popup::before{content:'';position:absolute;top:-6px;right:1.6rem;width:12px;height:12px;background:var(--card);border-left:1px solid var(--ln);border-top:1px solid var(--ln);transform:rotate(45deg)}
@media(max-width:560px){.mini-popup{width:calc(100vw - 1rem);border-radius:16px}}
@media(max-height:520px){.mini-popup{max-height:88vh}}
.ft-link{display:inline-flex;align-items:center;gap:.4em;min-height:2.4rem;padding:.45em 1.1em;border-radius:999px;border:1.5px solid var(--ln);background:transparent;color:var(--acc);font-weight:600;font-size:.85rem;cursor:pointer;transition:transform .25s,border-color .25s,background .25s,color .25s}
.ft-link:hover{border-color:var(--acc);background:var(--card);transform:translateY(-1px) scale(1.04)}
.ft-link:active{transform:scale(.97)}
@keyframes mpIn{from{opacity:0;transform:translateY(-8px) scale(.98)}to{opacity:1;transform:none}}
.mini-cal-grid .mini-dot{cursor:pointer;border:0;padding:0;font:inherit;min-height:0;box-shadow:none;display:grid;place-items:center;width:2rem;height:2rem;border-radius:50%}
:root[data-t=beige] #top-date-trigger.lit{background:#efe0c9!important;color:#5c3f28!important}
:root[data-t=beige] .mini-cal-grid .mini-dot:hover,:root[data-t=beige] .mini-cal-grid .mini-dot.lit{background:#fff6e9!important;color:#a8845c!important;box-shadow:0 6px 16px #8a5a3a2e}
:root[data-t=beige] .mini-cal-grid .mini-dot:hover span,:root[data-t=beige] .mini-cal-grid .mini-dot.lit span{color:#a8845c!important}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:grid;place-items:center;z-index:9999;padding:1rem;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
@media(max-width:900px){
.shell{flex-direction:column;padding:0 .8rem;gap:0}
aside{width:100%;margin:.8rem 0 0;flex-direction:row;overflow-x:auto;padding:.5rem;align-items:center;gap:.3rem;position:static;-webkit-overflow-scrolling:touch;scrollbar-width:none}
aside::-webkit-scrollbar{display:none}
aside .lg{display:none}
aside a{white-space:nowrap;padding:.55em .95em;font-size:.9rem}
main{padding:1rem 0}
.card{padding:1.2rem}
header.top{padding:.8rem 1rem}
.welcome-footer-bar{flex-direction:column;align-items:center;text-align:center;gap:.8rem}
.social-links{text-align:center}
}
@media(max-width:480px){.task{flex-wrap:wrap}.dot{width:2.8rem;height:2.8rem}.qa{flex-direction:column}.qa button{align-self:flex-end}}
@media(max-height:480px) and (orientation:landscape){.welcome-screen,.center{min-height:auto}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ==== i18n / theme switch / motion ==== */
.langbar{display:flex;gap:.45rem;justify-content:flex-end;width:100%;margin-bottom:.4rem}
.langbar button{padding:.35em 1em;font-size:.8rem;min-height:2.2rem;background:transparent;border:1.5px solid var(--ln);color:var(--mut);box-shadow:none}
.langbar button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.welcome-center .langbar{justify-content:center;margin-bottom:.8rem}
.toast{position:fixed;left:50%;bottom:calc(1.4rem + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(10px);background:var(--ink);color:var(--bg);padding:.7em 1.2em;border-radius:999px;font-size:.85rem;z-index:10000;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
a.lg-link{color:var(--acc);font-weight:600;text-decoration:none;font-size:.9rem;cursor:pointer;padding:.4em .8em;border-radius:999px;border:1.5px solid var(--ln);transition:all .25s}
a.lg-link:hover{border-color:var(--acc);transform:translateY(-1px)}
/* nav hover: buyume/kuculme */
aside a{transition:background .25s,color .25s,transform .25s,box-shadow .25s}
aside a:hover{transform:scale(1.05)}
aside a:active{transform:scale(.97)}
/* sayfa icerigi yukaridan asagiya yavasca siralanir */
main .card{animation:slIn .5s cubic-bezier(.2,.7,.2,1) both}
main .card:nth-child(1){animation-delay:.02s}
main .card:nth-child(2){animation-delay:.09s}
main .card:nth-child(3){animation-delay:.16s}
main .card:nth-child(4){animation-delay:.23s}
main .card:nth-child(5){animation-delay:.3s}
main .card:nth-child(6){animation-delay:.37s}
main .card:nth-child(n+7){animation-delay:.44s}
@keyframes slIn{from{opacity:0;transform:translateY(-18px)}to{opacity:1;transform:none}}
/* menu alttan yukari gelir */
aside.intro{animation:navIn .55s cubic-bezier(.2,.7,.2,1) both}
@media(max-width:900px){aside.intro{animation:navIn .4s cubic-bezier(.2,.7,.2,1) both}}
@media(prefers-reduced-motion:reduce){aside{animation:none}}
@keyframes navIn{from{opacity:0;transform:translateY(42px)}to{opacity:1;transform:none}}
header.top{animation:hdrIn .5s ease both}
@keyframes hdrIn{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:none}}
/* giris gecis ekrani: gunaydin / tunaydin / iyi geceler */
.greet-screen{position:fixed;inset:0;z-index:9998;display:grid;place-items:center;background:var(--bg);color:var(--ink);font-family:var(--fs);font-size:clamp(1.8rem,6vw,3.4rem);font-weight:600;text-align:center;padding:1.5rem;animation:grIn .45s ease both;cursor:pointer}
.greet-screen.out{animation:grOut .55s ease forwards}
@keyframes grIn{from{opacity:0;letter-spacing:.35em}to{opacity:1;letter-spacing:.02em}}
@keyframes grOut{to{opacity:0;transform:scale(1.04);letter-spacing:.3em}}
/* takvim: sisli gecmis, bugun, secili, gelecege not */
.dot{transition:background .35s,color .35s,box-shadow .35s,outline-color .35s,opacity .35s,transform .25s,filter .35s}
.dot.future{background:transparent;border:1.5px dashed var(--ln);color:var(--mut);opacity:.6}
.dot.fog{background:var(--ln);color:var(--mut);opacity:.5;filter:blur(.7px) saturate(.4)}
.dot.fog:hover,.dot.future:hover,.dot.ok:hover,.dot.miss-dot:hover{filter:none;opacity:1}
.dot.note::after{content:'•';position:absolute;top:1px;right:5px;font-size:.7rem;color:var(--acc);font-weight:700}
.dot{position:relative}
/* 10.11 : tum arayuzde bej tema + koyu bej sayilar */
:root[data-t=beige]{--bg:#f3e6d2;--card:#fbf3e6;--ink:#4a3426;--mut:#a68b70;--acc:#c09062;--acc2:#e6cfae;--ok:#8fae7e;--no:#c07a5f;--ln:#e5d3ba;--sh:0 12px 32px #8a5a3a1f;--okbg:#eaf0e0}
:root[data-t=beige] body{background:#f3e6d2}
:root[data-t=beige] .dot,:root[data-t=beige] .mini-dot{background:#e8d5bb;color:#6b4a33}
:root[data-t=beige] .dot.ok{background:#c9a37a;color:#3a2718}
:root[data-t=beige] .dot.miss-dot{background:#c8b096;color:#4a3426}
:root[data-t=beige] .dot.fog{background:#e3cfb3;color:#8a6b4f}
:root[data-t=beige] .dot.future{background:transparent;border-color:#dcc6a8;color:#9c7d5e}
:root[data-t=beige] .dot.td,:root[data-t=beige] .mini-dot.td{outline-color:#a9714b;color:#4a3426}


/* ==== tum isletim sistemleri + en/boy oranlari: duyarli ve simetrik duzen ==== */
.shell{padding-inline:clamp(.7rem,2.4vw,2rem);gap:clamp(.9rem,1.6vw,1.6rem)}
main{padding-block:clamp(.9rem,1.6vw,1.6rem);gap:clamp(.9rem,1.4vw,1.4rem)}
.card{padding:clamp(1rem,2vw,1.6rem);border-radius:clamp(18px,2vw,26px)}
header.top{padding:clamp(.6rem,1.2vw,1rem) clamp(.8rem,2vw,1.8rem);gap:.5rem;flex-wrap:wrap;row-gap:.4rem}
header.top b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:min(46vw,22rem)}
.row{row-gap:.5rem}
input,select,textarea{max-width:100%}
.tm{font-size:clamp(2rem,7.2vw,4.6rem);letter-spacing:.02em;overflow-wrap:anywhere}
.pct-big{font-size:clamp(2.1rem,7vw,4rem)}
.big{font-size:clamp(1.9rem,7vw,4rem)}
.dot{width:clamp(2.4rem,5.2vw,3.2rem);height:clamp(2.4rem,5.2vw,3.2rem);border-radius:clamp(12px,1.6vw,16px)}
.cal{gap:clamp(.3rem,1vw,.55rem)}
.task{gap:clamp(.4rem,.9vw,.7rem);padding:clamp(.6rem,1.2vw,.9rem) clamp(.7rem,1.4vw,1rem)}
footer{display:flex;flex-direction:column;align-items:center;gap:.5rem;padding:clamp(.8rem,1.6vw,1.2rem)}
.qa{flex-wrap:wrap}
.qa textarea{min-width:min(100%,12rem)}
/* footer: giris ekranina don */
#back-login{display:inline-flex;align-items:center;gap:.4em;min-height:2.4rem;padding:.45em 1.1em;border-radius:999px;border:1.5px solid var(--ln);background:transparent;color:var(--acc);font-weight:600;font-size:.85rem;cursor:pointer;transition:transform .25s,border-color .25s,background .25s,color .25s}
#back-login:hover{border-color:var(--acc);background:var(--card);transform:translateY(-1px) scale(1.04)}
#back-login:active{transform:scale(.97)}
/* hatirlanan kullanici karti */
.remember{display:flex;align-items:center;gap:.7rem;background:var(--bg);border:1.5px solid var(--ln);border-radius:18px;padding:.7rem .9rem;margin-bottom:.9rem;transition:border-color .3s,transform .3s}
.remember:hover{border-color:var(--acc)}
.remember .av{width:2.4rem;height:2.4rem;border-radius:50%;display:grid;place-items:center;background:var(--acc);color:#fff;font-family:var(--fs);font-weight:700;flex-shrink:0}
.remember b{display:block;line-height:1.2;overflow-wrap:anywhere}
.remember small{color:var(--mut);font-size:.75rem}
.remember .sp{flex:1;min-width:0}
.saved-list{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.4rem}
.saved-list button{background:transparent;border:1.5px solid var(--ln);color:var(--ink);box-shadow:none;min-height:2.2rem;padding:.3em .9em;font-size:.82rem}
.saved-list button:hover{border-color:var(--acc)}
/* yuzdelik: gun sayisi karti */
.stat{display:flex;flex-wrap:wrap;align-items:baseline;gap:.5rem 1rem}
.stat b{font-family:var(--fs);font-size:clamp(1.6rem,4vw,2.4rem);color:var(--acc);line-height:1}
@media(max-width:900px){
  aside{overflow-x:auto;justify-content:flex-start;padding:.45rem;scroll-snap-type:x proximity}
  aside a{scroll-snap-align:center}
  .shell{gap:0}
  .welcome-footer-bar{gap:.6rem}
}
@media(max-width:560px){
  .remember{flex-wrap:wrap}
  .card{padding:1rem}
  .row>button{flex:1 1 auto}
  aside a{min-height:2.9rem;height:auto;padding:.6em 1em}
  .stat{gap:.3rem .8rem}
  #top-date-trigger{font-size:.85rem}
}
@media(min-width:1400px){main{max-width:60rem}}
@media(min-aspect-ratio:16/9) and (min-width:1200px){aside{width:17.5rem}}
@media(max-aspect-ratio:3/4){.cal{justify-content:flex-start}.dot{width:clamp(2.2rem,13vw,3rem);height:clamp(2.2rem,13vw,3rem)}}


/* ==== mobile polish: compact typography, smooth horizontal navigation, month and brand fit ==== */
.top-brand{min-width:0;max-width:none}
.month-title{min-width:0;white-space:nowrap;word-break:normal;overflow-wrap:normal;hyphens:none}
@media(max-width:900px){
  .shell{padding-inline:clamp(.55rem,2.8vw,.85rem)}
  .shell aside{
    width:100%;max-width:100%;margin:.65rem 0 .25rem;padding:.4rem;
    display:flex;flex-wrap:nowrap;justify-content:flex-start;align-items:center;
    gap:.35rem;overflow-x:auto;overflow-y:hidden;
    -webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;
    scroll-behavior:smooth;scroll-snap-type:x proximity;
    scroll-padding-inline:.5rem;scrollbar-width:none;
    border:1px solid var(--ln);box-shadow:0 5px 18px #8a5a3a10;
  }
  .shell aside::-webkit-scrollbar{display:none}
  .shell aside a{
    flex:0 0 auto;scroll-snap-align:center;white-space:nowrap;
    min-height:2.55rem;height:auto;padding:.55rem .82rem;
    font-size:clamp(.78rem,2.6vw,.9rem);line-height:1.15;
    transition:background .28s ease,color .28s ease,transform .28s cubic-bezier(.2,.7,.2,1),box-shadow .28s ease;
  }
  .shell aside a.on{transform:translateY(-1px);box-shadow:0 4px 12px #a9714b2b}
  main{gap:clamp(.75rem,2.4vw,1rem)}
  .card{padding:clamp(.9rem,3.8vw,1.15rem);border-radius:clamp(16px,4vw,20px)}
  .card h2{font-size:clamp(1.02rem,4.2vw,1.18rem);line-height:1.25;letter-spacing:0}
  .card h3{font-size:clamp(.94rem,3.8vw,1.04rem);line-height:1.3}
  .mut,small,.qcap{font-size:clamp(.76rem,2.9vw,.84rem)}
  .row{gap:.45rem}
  .month-nav{flex-wrap:nowrap;gap:clamp(.25rem,1.5vw,.5rem)}
  .month-nav>button{flex:0 0 auto;min-width:2.45rem;padding:.35rem .72rem}
  .month-title{flex:1 1 auto;font-size:clamp(.92rem,4.3vw,1.12rem);line-height:1.15;letter-spacing:0;text-align:center;overflow:visible}
  header.top{
    display:flex;flex-wrap:nowrap;align-items:center;gap:.4rem;
    padding:.68rem clamp(.65rem,3vw,.9rem);
  }
  header.top .top-brand{
    flex:1 1 auto;min-width:0;max-width:none!important;
    overflow:visible!important;text-overflow:clip!important;white-space:nowrap;
    font-size:clamp(.82rem,4.05vw,1.04rem)!important;
    line-height:1.2;letter-spacing:0;
  }
  #top-date-trigger{flex:0 0 auto;font-size:clamp(.72rem,3vw,.84rem);padding:.22em .48em;gap:.22em}
  #top-date-trigger small{font-size:.68rem}
  .pct-big{font-size:clamp(2rem,9vw,2.8rem)}
  .tm{font-size:clamp(2.3rem,10vw,3.8rem)}
}
@media(max-width:380px){
  header.top{gap:.28rem;padding-inline:.55rem}
  header.top .top-brand{font-size:clamp(.78rem,3.9vw,.92rem)!important}
  #top-date-trigger{font-size:.7rem;padding:.2em .38em}
  .month-nav>button{min-width:2.25rem;padding:.3rem .6rem}
  .month-title{font-size:clamp(.86rem,4vw,1rem)}
  .shell aside a{padding:.52rem .72rem;font-size:.78rem}
}
@media(prefers-reduced-motion:reduce){
  .shell aside{scroll-behavior:auto;scroll-snap-type:none}
  .shell aside a{transition:none}
}

/* ==== mobile nav: native horizontal swipe, no snap resistance ==== */
@media(max-width:900px){
  .shell aside{
    overflow-x:auto!important;overflow-y:hidden!important;
    touch-action:pan-x pan-y pinch-zoom!important;
    -webkit-overflow-scrolling:touch;
    overscroll-behavior-x:contain;
    scroll-snap-type:none!important;
    scroll-behavior:smooth;
    scrollbar-width:none;
    cursor:grab;
  }
  .shell aside:active{cursor:grabbing}
  .shell aside a{
    touch-action:pan-x pan-y pinch-zoom!important;
    scroll-snap-align:none!important;
    -webkit-tap-highlight-color:transparent;
    user-select:none;-webkit-user-select:none;
  }
}
@media(prefers-reduced-motion:reduce){
  .shell aside{scroll-behavior:auto}
}


/* ===== Improvin v2: responsive interactive UI ===== */
:root{--font-scale:1;--motion-ms:280ms}
html{font-size:clamp(15px,1.05vw + 11px,17px)}
body{font-size:calc(1rem * var(--font-scale))}
button,input,textarea,select,.task,.note{font-size:1rem}
button{transition:background .25s,transform .18s,box-shadow .22s}
.card{overflow-wrap:anywhere}
.note-grid,.journal-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,17rem),1fr));gap:.8rem;align-items:stretch}
.note-tile{background:var(--bg);border:1px solid var(--ln);padding:1rem;border-radius:18px;display:flex;flex-direction:column;justify-content:space-between;gap:.5rem;min-width:0;overflow-wrap:anywhere}
.note-tile p{white-space:pre-wrap;overflow-wrap:anywhere;margin:0;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.note-tile .row{margin-top:auto}
.top-tools{display:flex;align-items:center;gap:.5rem;margin-left:auto}
.top-clock{font-size:.85rem;color:var(--mut);font-variant-numeric:tabular-nums;white-space:nowrap}
.account-chip{background:var(--acc);border:1px solid var(--acc2);color:#fff;display:inline-flex;align-items:center;gap:.45rem;padding:.35rem .7rem;box-shadow:none;max-width:12rem}
.account-chip .avatar{background:#ffffff30;border-radius:50%;width:2rem;height:2rem;display:grid;place-items:center;flex-shrink:0}
.account-chip .account-name{min-width:0;text-overflow:ellipsis;overflow:hidden;white-space:nowrap;font-size:.85rem}
.login-busy-overlay{position:fixed;inset:0;z-index:20010;display:grid;place-items:center;background:color-mix(in srgb,var(--bg) 96%,transparent);backdrop-filter:blur(8px);animation:fi .18s ease both}
.login-busy-orbit{width:min(78vw,19rem);aspect-ratio:1;border-radius:50%;border:2px solid var(--acc2);display:grid;place-items:center;padding:1.5rem;text-align:center;font-family:var(--fs);font-size:clamp(1.2rem,5vw,1.8rem);color:var(--acc);animation:breath 1.65s ease-in-out infinite;box-shadow:0 0 0 16px color-mix(in srgb,var(--acc) 9%,transparent)}
@keyframes breath{0%,100%{opacity:.65;transform:scale(.94)}50%{opacity:1;transform:scale(1.04)}}
.pomo-overlay{position:fixed;inset:0;z-index:20000;background:color-mix(in srgb,var(--bg) 91%,transparent);-webkit-backdrop-filter:blur(22px);backdrop-filter:blur(22px);display:flex;align-items:center;justify-content:center;padding:clamp(1rem,4vw,3rem);animation:overlayIn .38s cubic-bezier(.18,.77,.23,1) both}
@keyframes overlayIn{from{opacity:0;transform:scale(1.05)}to{opacity:1;transform:scale(1)}}
.pomo-panel{display:flex;flex-direction:column;align-items:center;gap:1rem;width:100%;max-width:40rem;text-align:center}
.pomo-ring{width:min(74vw,62vh,25rem);height:min(74vw,62vh,25rem);border-radius:50%;padding:clamp(.6rem,3vw,1rem);background:conic-gradient(var(--acc) var(--ring,0%),var(--ln) 0);box-shadow:0 18px 65px #00000012;transition:background .4s}
.pomo-ring-inner{width:100%;height:100%;border-radius:50%;background:color-mix(in srgb,var(--card) 90%,transparent);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:.3rem;padding:1rem}
.pomo-ring-inner .tm{font-size:clamp(2.7rem,10vw,5rem);line-height:1.2}
.pomo-meta{font-size:.9rem;color:var(--mut)}
.sw-display{font-family:var(--fs);font-size:clamp(2.4rem,8vw,4.6rem);font-variant-numeric:tabular-nums;text-align:center;color:var(--acc)}
.laps{max-height:12rem;overflow:auto;margin-top:.6rem}
.lap-row{display:flex;justify-content:space-between;border-bottom:1px solid var(--ln);padding:.5rem}
.clock-face{width:min(62vw,16rem);aspect-ratio:1;border:3px solid var(--acc2);border-radius:50%;position:relative;display:grid;place-items:center;margin:1rem auto;background:var(--bg)}
.clock-face:after{content:'';width:.65rem;height:.65rem;background:var(--acc);border-radius:50%;position:absolute}
.clock-face .hand{position:absolute;bottom:50%;left:calc(50% - 2px);height:33%;width:4px;transform-origin:bottom;background:var(--acc);border-radius:4px;transform:rotate(var(--degrees,0deg))}

.future-note-tile>small{grid-column:2;grid-row:1;text-align:right;max-width:9rem;justify-self:end;font-size:.72rem;line-height:1.35}
.future-note-tile>p,.future-note-tile>.row{grid-column:1/-1}
.future-note-tile>.row{margin-top:.3rem;gap:.5rem}
.future-add-row{margin-top:.8rem;display:grid;gap:.25rem}
.future-add-row label{margin-top:0!important}
.future-add-row .row{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center}
.future-add-row input{margin:0;max-width:100%!important;min-width:0}
.report-heading{justify-content:space-between;align-items:center;gap:.65rem}
.report-heading h2,.report-heading h3{margin:0}
.report-heading button{margin-left:auto}
@media(max-width:480px){.future-note-tile>small{max-width:none;grid-column:1/-1;grid-row:auto;justify-self:start;text-align:left}.future-add-row .row{grid-template-columns:minmax(0,1fr)}.future-add-row button{width:100%}.report-heading button{font-size:.78rem}}
@media(prefers-reduced-motion:reduce){#login-portal .portal-disc,#login-portal .portal-ring,.modal[data-kind=day] .card{animation:none!important}.mini-popup{transition:none}.modal.is-closing{transition:none}}

</style>

function softPaint(){
  const reduced=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const canVT=document.startViewTransition&&document.visibilityState==='visible'&&!reduced;
  if(canVT){
    clearTimeout(softPaintTimer);softPaintTimer=0;
    const existing=$('#app');if(existing)existing.classList.remove('soft-out');
    try{
      const t=document.startViewTransition(()=>paint());
      if(t&&t.finished&&t.finished.catch)t.finished.catch(()=>{});

    }catch(e){}

function centerNav(){
  const aside=document.querySelector('aside'),on=aside&&aside.querySelector('a.on');
  if(!aside||!on||aside.scrollWidth<=aside.clientWidth+2)return;
  /* Use visible rectangles rather than offsetLeft: mobile browsers can report
     offsetLeft relative to the page when the horizontal nav is not positioned. */
  const navRect=aside.getBoundingClientRect(),itemRect=on.getBoundingClientRect();
  const itemCenter=(itemRect.left-navRect.left)+aside.scrollLeft+(itemRect.width/2);
  const target=itemCenter-(aside.clientWidth/2);
  const max=Math.max(0,aside.scrollWidth-aside.clientWidth);
  const left=Math.max(0,Math.min(max,target));
  const reduced=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  try{aside.scrollTo({left,behavior:reduced?'auto':'smooth'})}catch(e){aside.scrollLeft=left}
}

/* Legacy percentage compatibility (2026-11-13 cutover): prior releases awarded
   +1 for each calendar day since pctFrom. Preserve that already-displayed value,
   then award additional points only for meaningful activity AFTER the cutover.
   This is read-only: never rewrite or discard the user's historical data. */
const PROGRESS_CUTOVER='2026-11-13';
function validProgressDate(value){
  if(typeof value!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(value))return false;
  const date=new Date(value+'T00:00:00Z');
  return Number.isFinite(date.getTime())&&date.toISOString().slice(0,10)===value;
}
function progressDayDistance(from,to){
  return Math.round((Date.parse(to+'T00:00:00Z')-Date.parse(from+'T00:00:00Z'))/86400000);
}
function progressPercent(activeDays,pctFrom,asOf){
  const days=activeDays&&typeof activeDays==='object'&&!Array.isArray(activeDays)?activeDays:{};
  const current=validProgressDate(asOf)?asOf:new Date().toISOString().slice(0,10);
  const cutoff=current<PROGRESS_CUTOVER?current:PROGRESS_CUTOVER;
  const isLegacy=validProgressDate(pctFrom)&&pctFrom<=PROGRESS_CUTOVER;
  const baseline=isLegacy?Math.max(1,progressDayDistance(pctFrom,cutoff)+1):0;
  const recent=Object.keys(days).filter(day=>
    validProgressDate(day)&&day<=current&&days[day]===true&&(!isLegacy||day>cutoff)
  ).length;
  return Math.max(1,baseline+recent);
}
function stopwatchFormat(ms){
  const v=Number.isFinite(ms)?Math.max(0,ms):0;
  const total=Math.floor(v/10);
  const minute=Math.floor(total/6000);
  const second=Math.floor(total%6000/100);
  const cs=total%100;
  return String(minute).padStart(2,'0')+':'+String(second).padStart(2,'0')+','+String(cs).padStart(2,'0');

function detectDevice(){
  const w=innerWidth,h=innerHeight,coarse=window.matchMedia('(pointer:coarse)').matches||(navigator.maxTouchPoints||0)>1;
  const short=Math.min(w,h),long=Math.max(w,h);
  let dev='desktop';
  /* telefon/tablet: kisa kenar + dokunmatik; TV: buyuk ekran; masaustu: geri kalan */
  if(short<=600&&(coarse||short<=480))dev='phone';
  else if(short<=900&&coarse)dev='tablet';
  else if(short<=1024&&long<=1400)dev='tablet';
  else if(coarse&&long>1024)dev='tv';
  else if(long>=1700)dev='desktop-xl';
  else if(long<=900)dev='mobile-narrow';
  document.documentElement.dataset.dev=dev;
  document.documentElement.dataset.orient=h>=w?'portrait':'landscape';
  return dev;
}

        msg=authErrorMessage(e)==='email-unconfirmed'?(tr()?'E-posta doğrulaması gerekiyor. Demo için Supabase ayarını kontrol et.':'Email confirmation required. Check Supabase demo settings.'):

        if(e.name==='AbortError')msg=tr()?'Bağlantı zaman aşımına uğradı.':'Connection timed out.';
        return renderAppOrAuth();
      }
    }
    if(localAcc&&!localAcc.authUid&&await pwMatch(localAcc,password)){
      sbClear();A=norm(localAcc);restorePomodoroState();applyTheme();save();goTo('app','home');greetThen();
      toast(tr()?'Bu yalnızca yerel eski hesap. Diğer cihazlarda e-posta ile bulut hesabına giriş yapmalısın.':'Legacy local account only.');return;
    }

    renderAppOrAuth();

}
async function setup(){
  if(authBusy)return;
  const u=String($('#u')?.value||'').trim(),n=String($('#n')?.value||'').trim();
  const e=String($('#e')?.value||'').trim().toLowerCase(),p=String($('#p')?.value||'');
  formDat={u,n,b:String($('#b')?.value||'').slice(0,160),e,t:'',p};
  if(!userRe.test(u))msg=t('usernameRules');
  else if(!n)msg=t('displayRequired');
  else if(findUser(u))msg=t('usernameTaken');
  else if(!emailPattern.test(e))msg=t('emailInvalid');
  else msg=pwOk(p,u);
  if(msg){renderAppOrAuth();if(msg===t('usernameTaken'))debounceNameCheck();return}
  if(Object.values(DB.accounts).some(a=>String(a.email||a.mail||'').toLowerCase()===e)){goExistingEmail(e);return}
  loginBusy(true);
  try{
    const available=await sb('/rest/v1/rpc/iydu_username_available',{method:'POST',body:{p_username:u}});
    if(available!==true){msg=t('usernameTaken');renderAppOrAuth();debounceNameCheck();return}
    const j=await sbSignUp(u,p,n,e);
    if(!j||!j.access_token){
      msg=tr()?'Bulut kaydı oluştu ancak oturum açılmadı. Supabase e-posta doğrulaması gerektiriyor olabilir.':'Cloud signup requires email confirmation; no session returned.';
      renderAppOrAuth();return;
    }
    await activateCloudUser(j,u);
    formDat={u:'',n:'',b:'',e:'',t:'',p:''};greetThen();
    toast(tr()?'Bulut hesabın oluşturuldu. E-posta sahipliği kontrol edilmedi (demo).':'Cloud account created. Email ownership was not checked (demo).');
  }catch(err){
    const cause=authErrorMessage(err);
    if(cause==='already-email'){goExistingEmail(e);return}
    if(cause==='username'){msg=t('usernameTaken');renderAppOrAuth();debounceNameCheck();return}
    msg=(tr()?'Bulut kaydı tamamlanamadı. Ağ veya Supabase ayarlarını kontrol et.':'Could not register. Check network and Supabase configuration.');
    if(err.name==='AbortError')msg=tr()?'İstek zaman aşımına uğradı.':'Request timed out.';
    renderAppOrAuth();
  }finally{loginBusy(false)}
}

function fixTodoData(){
  const txt=x=>typeof x==='string'?x:(x&&typeof x==='object'?String(x.t||x.text||x.title||''):String(x==null?'':x));
  if(!Array.isArray(A.tasks))A.tasks=A.tasks&&typeof A.tasks==='object'?Object.values(A.tasks):[];
  A.tasks=A.tasks.filter(x=>x!=null).map(x=>typeof x==='object'?{...x,t:txt(x),s:(x.s==='done'||x.s==='miss')?x.s:(x.done?'done':'')}:{t:txt(x),s:''}).filter(x=>x.t);
  if(!Array.isArray(A.backlog))A.backlog=A.backlog&&typeof A.backlog==='object'?Object.values(A.backlog):[];
  A.backlog=A.backlog.map(txt).filter(Boolean).slice(-10);

  <div class="card"><h2>${tr()?'Yarın için planlama':'Plan for tomorrow'} · ${fmt(next)}</h2><p class="mut">${tr()?'Bugünün görevlerini değerlendirdikten sonra yarının görevlerini buraya ekleyebilirsin.':'Plan tomorrow after reviewing today\'s tasks.'}</p><div id="tomorrow-plans">${planned||'<p class="mut">'+(tr()?'Henüz plan yok.':'No plans yet.')+'</p>'}</div><div class="tomorrow-plan-add"><input id="plan-input" maxlength="120" placeholder="${tr()?'Yarın ne yapacaksın?':'Tomorrow\'s task'}" onkeydown="if(event.key==='Enter'){event.preventDefault();addTomorrowPlan()}"><button onclick="addTomorrowPlan()" ${acted?'':'disabled'}>${tr()?'Yarına ekle':'Add tomorrow'}</button></div>${acted?'':`<small class="mut">${tr()?'Önce bugünden bir görevi ✓ veya ✕ ile değerlendir.':'Mark one task ✓ or ✕ first.'}</small>`}</div>
  <div class="card"><h2>${t('backlog')} (${A.backlog.length}/10)</h2>${bl||'<p class="mut">'+t('noRecords')+'</p>'}</div>`);
};
function vibrateTask(){try{if(navigator.vibrate)navigator.vibrate(12)}catch(_){}}
const tk=(x,i)=>`<div class="task ${x.s}" id="t${i}"><span>${esc(x.t)}</span><button class="ck ${x.s==='done'?'on':''}" aria-label="${t('done')}" onclick="mk(${i},'done')">✓</button><button class="xx ${x.s==='miss'?'on':''}" aria-label="${t('notDone')}" onclick="mk(${i},'miss')">✕</button>${x.s?`<button class="g s" onclick="planFromTask(${i})">${tr()?'Yarına planla':'Plan tomorrow'}</button>`:''}<button class="g s" onclick="delT(${i})">${t('delete')}</button></div>`;
function fromBack(i){if(!A.backlog[i])return;A.tasks.push({t:A.backlog[i],s:''});A.backlog.splice(i,1);recordActivity();P.todo()}
function delT(i){if(!A.tasks[i])return;A.tasks.splice(i,1);vibrateTask();recordActivity();P.todo()}
function addT(){const v=String($('#nt')?.value||'').trim().slice(0,120);if(v){A.tasks.push({t:v,s:''});recordActivity();P.todo()}}
function mk(i,status){const x=A.tasks[i];if(!x)return;x.s=x.s===status?'':status;vibrateTask();recordActivity();P.todo()}
function ensurePlans(){if(!A.plans||typeof A.plans!=='object')A.plans={}}
function addTomorrowPlan(text){
  const v=String(text||$('#plan-input')?.value||'').trim().slice(0,120);if(!v)return;
  ensurePlans();const next=addD(today(),1);if(!Array.isArray(A.plans[next]))A.plans[next]=[];
  if(A.plans[next].length>=100){toast(tr()?'En fazla 100 plan.':'Up to 100 plans.');return}
  A.plans[next].push(v);recordActivity();P.todo();
}
function planFromTask(i){const x=A.tasks[i];if(x&&x.s)addTomorrowPlan(x.t)}
function removePlan(i){ensurePlans();const next=addD(today(),1);if(A.plans[next])A.plans[next].splice(i,1);save();P.todo()}

/* sis: tamamlanmamis gecmis gunler */
function dayFog(k){if(!A||!A.fog)return false;if(k>=today())return false;const its=items(k);return !(its.length>0&&its.every(x=>x.done))}
function hasNote(k){return !!(A.future&&A.future[k])}
function openDay(k){
  closeMiniCal();
  if(k<today()&&!A.fog){toast(tr()?'Geçmiş günü açmak için Önceki günler görünümünü etkinleştir.':'Turn Fog past days on to open past dates.');return}
  selDay=k;
  const its=items(k),note=(A.future&&A.future[k])||'',future=k>today();
  openModal('day-modal',`<h2>${fmt(k)}${future?' · '+t('futureNotes'):''}</h2>${its.length?its.map(x=>`<div class="task ${x.done?'done':'miss'}"><span>${esc(x.t)}</span><b>${x.done?'✓ '+t('done'):'✕ '+t('notDone')}</b></div>`).join(''):'<p class="mut">'+t('noRecords')+'</p>'}
<div style="margin-top:1rem"><h3>${t('yourNote')}</h3>${A.futureMeta?.[k]?.editedAt?`<small class="mut">${tr()?'Düzenlendi:':'Edited:'} ${journalDate(A.futureMeta[k].editedAt)}</small>`:''}<textarea id="dn" rows="3" maxlength="500" placeholder="${t('notePlaceholder')}">${esc(note)}</textarea><div class="row" style="justify-content:flex-end"><button class="g" onclick="closeModal('day-modal')">${t('cancel')}</button><button onclick="saveNote('${k}')">${t('save')}</button></div></div>`);
}
function saveNote(k){
  const v=String(document.getElementById('dn')?.value||'').trim().slice(0,500);
  if(!A.future||typeof A.future!=='object')A.future={};
  if(!A.futureMeta||typeof A.futureMeta!=='object')A.futureMeta={};
  const previous=String(A.future[k]||''),meta=A.futureMeta[k]||{},now=Date.now();
  if(v){
    A.future[k]=v;
    A.futureMeta[k]={createdAt:meta.createdAt||now,editedAt:previous&&previous!==v?now:(meta.editedAt||null)};
    if(previous!==v)recordActivity();else save();
  }else{delete A.future[k];delete A.futureMeta[k];save()}
  closeModal('day-modal');toast(t('noteSaved'));if(pg==='pc')P.pc();else renderPage();
}
P.pc=()=>{
  const n=new Date(),mn=(2026-n.getFullYear())*12+10-n.getMonth();
  if(calOff<mn)calOff=mn;
  const base=new Date(n.getFullYear(),n.getMonth()+calOff,1),y=base.getFullYear(),mo=base.getMonth(),days=new Date(y,mo+1,0).getDate();
  let c='';
  for(let d=1;d<=days;d++){
    const k=`${y}-${pad(mo+1)}-${pad(d)}`,its=items(k),future=k>today();
    let cls=future?'future':(dayFog(k)?'fog':'');
    if(!future&&its.length>0)cls=its.every(x=>x.done)?'ok':'miss-dot';
    if(hasNote(k))cls+=' note';
    const dp=(!future&&its.length)?Math.round(its.filter(x=>x.done).length/its.length*100):null;
    c+=`<button class="dot ${cls} ${k==today()?'td':''}" title="${fmt(k)}${dp!==null?' — %'+dp:''}" onmouseenter="fadeDot(this,1)" onmouseleave="fadeDot(this,0)" ${k<today()&&!A.fog?'disabled aria-disabled="true"':''} onclick="openDay('${k}')"><small>${dayName(new Date(y,mo,d).getDay())}</small><span>${d}</span><em class="dpct">${dp!==null?'%'+dp:'&nbsp;'}</em></button>`;
  }
  const monthKey=`${y}-${pad(mo+1)}`;
  const noteList=Object.keys(A.future||{}).filter(k=>/^\d{4}-\d{2}-\d{2}$/.test(k)&&k.slice(0,7)===monthKey).sort().map(k=>`<article class="note-tile future-note-tile"><b class="note-date">${fmt(k)}</b>${A.futureMeta?.[k]?.editedAt?`<small class="mut">${tr()?'Düzenlendi:':'Edited:'} ${journalDate(A.futureMeta[k].editedAt)}</small>`:''}<p>${esc(A.future[k])}</p><div class="row"><button class="g s" onclick="openDay('${k}')">${t('editNote')}</button><button class="g s" onclick="delNote('${k}')">${t('delete')}</button></div></article>`).join('');
  M(`<div class="card"><div class="row" style="align-items:baseline;gap:1.2rem"><span class="pct-big">%${pct()}</span><span class="mut" style="font-size:1rem">${fmt(today())}</span></div><p class="mut" style="margin:.4rem 0 0;font-size:.82rem">${t('pctTitle')}</p><div class="row" style="margin-top:.8rem"><button class="g s ${A.fog?'':'on'}" onclick="A.fog=!A.fog;save();shell()">${t('fogToggle')}: ${A.fog?t('on'):t('off')}</button><button class="g s" onclick="toggleBeige()">${tr()?'Bej görünüm':'Beige look'}: ${DB.beige?t('on'):t('off')}</button></div></div><div class="card"><div class="row month-nav"><button class="g" ${calOff<=mn?'disabled':''} aria-label="${tr()?'Önceki ay':'Previous month'}" onclick="calOff--;P.pc()">‹</button><h2 class="month-title" style="margin:0;flex:1;text-align:center">${monthName(mo)} ${y}</h2><button class="g" aria-label="${tr()?'Sonraki ay':'Next month'}" onclick="calOff++;P.pc()">›</button></div><div class="cal">${c}</div><p class="mut" style="font-size:.82rem;margin:.8rem 0 0">${t('pastDaysFog')} ${t('futureDays')}</p></div><div class="card"><h2>${t('futureNotes')}</h2><p class="mut">${t('futureNoteHint')}</p><div class="note-grid">${noteList||'<p class="mut">'+t('noNote')+'</p>'}</div><div class="future-add-row"><label for="fnd">${tr()?'Not tarihi seç':'Choose a note date'}</label><div class="row"><input id="fnd" type="date" aria-label="${tr()?'Not tarihi':'Note date'}"><button onclick="newNote()">${t('addFutureNote')}</button></div></div></div>`);
};
function newNote(){const d=$('#fnd').value;if(!d){toast(tr()?'Bir tarih seç.':'Pick a date.');return}openDay(d)}
function delNote(k){delete A.future[k];if(A.futureMeta)delete A.futureMeta[k];save();P.pc()}
function st(a,b){let t=0,d=0,by={};for(let x=a;x<=b;x=addD(x,1)){items(x).forEach(i=>{t++;by[i.t]=by[i.t]||[0,0];by[i.t][1]++;if(i.done){d++;by[i.t][0]++}})}return{t,d,p:t?Math.round(d/t*100):0,by}}
const qb=(k,arr,ro)=>arr.map((x,i)=>`<label>${esc(x.q)}</label><div class="qa"><textarea rows="2" maxlength="400" ${ro?'readonly':''} placeholder="${tr()?'Kısa cevap (en fazla 400 karakter)':'Short answer (max 400 characters)'}" oninput="qa('${k}',${i},this)">${esc(x.a)}</textarea>${ro?'':`<button class="g s d" onclick="delQ('${k}',${i})">${t('delete')}</button>`}</div><div class="qcap mut">${x.a.length}/400</div>`).join('');
function qa(k,i,el){A.qs[k][i].a=el.value.slice(0,400);save();el.parentElement.nextElementSibling.textContent=el.value.length+'/400'}
function delQ(k,i){A.qs[k].splice(i,1);save();P.rep()}
function addRandQ(k){const R=rqFor();A.qs[k].push({q:R[Math.floor(Math.random()*R.length)],a:''});save();P.rep()}
function addQ(k){const e=$('#nq-'+k),v=e.value.trim().slice(0,150);if(v){A.qs[k].push({q:v,a:''});save();P.rep()}}
function lockQ(k,b){if(b.dataset.c!=='1'){b.dataset.c='1';b.textContent=tr()?'Emin misin? Bu işlem geri alınamaz':'Are you sure? This cannot be undone';return}A.ql[k]=1;save();P.rep()}

/* Pure date gates: a report is available only on the day after the completed period. */
function reportPeriodEnded(now,end){return /^\d{4}-\d{2}-\d{2}$/.test(String(now))&&/^\d{4}-\d{2}-\d{2}$/.test(String(end))&&now>end}
function answerArchiveUnlocked(now,periodKey){return /^\d{4}-\d{2}-\d{2}$/.test(String(now))&&/^\d{4}-\d{2}(?:-\d{2})?$/.test(String(periodKey))&&Number(now.slice(0,4))>Number(periodKey.slice(0,4))}
function repCard(title,per,a,b,pa,pb,key,nk,defs){
  const td=today();
  if(!reportPeriodEnded(td,b)){
    const tot=dd(a,b)+1,pass=dd(a,td)+1;
    return`<div class="card"><h2>🔒 ${title}</h2><p class="mut">${t('opensOn')} ${fmt(b)} — ${dd(td,b)} ${t('daysLeft')}</p><div class="bar"><i style="width:${Math.min(100,pass/tot*100)}%"></i></div></div>`;
  }
  if(!A.qs[nk])A.qs[nk]=defs.map(q=>({q,a:''}));
  if(!A.qs[key])A.qs[key]=defs.map(q=>({q,a:''}));
  const s=st(a,b),pv=st(pa,pb),df=s.p-pv.p,cur=A.qs[key]||[],ro=!!A.ql[key];
  const rows=Object.entries(s.by).map(([k,v])=>`<div class="task"><span>${esc(k)}</span><b>${v[0]}/${v[1]}</b></div>`).join('');
  return`<div class="card"><h2>${title}</h2><p>${s.d}/${s.t} ${t('tasksDone')} — <b>%${s.p}</b> <span class="mut">(${t('previous')} ${per}: %${pv.p}, ${t('change')} ${df>=0?'+':''}${df})</span></p><div class="bar"><i style="width:${s.p}%"></i></div>${rows}
<h3 style="margin-top:1.2rem">${t('questionsFor')} ${per} ${ro?'🔒':''}</h3>${cur.length?(ro?`<p class="mut">🔒 ${tr()?'Yanıtların kilitlendi. Yıl bitene kadar Yanıt arşivinde gizli kalacak.':'Your answers are locked and will stay hidden in the answer archive until the end of the year.'}</p>`:qb(key,cur,false)+`<button class="g s" onclick="lockQ('${key}',this)">${t('lockAnswers')}</button>`):`<p class="mut">${t('noQuestions')}${t('askedNext')} ${per}.</p>`}
<h3 style="margin-top:1.2rem">${tr()?'Sonraki':'Next'} ${per}</h3>${qb(nk,A.qs[nk],false)}<div class="row"><input id="nq-${nk}" maxlength="150" placeholder="${t('addOwnQuestion')}"><button class="s" onclick="addQ('${nk}')">${t('addQuestion')}</button><button class="g s" onclick="addRandQ('${nk}')">${t('randomQuestion')}</button></div></div>`;
}
/* ---- gecmis raporlar: kisa ozet (haftalik / aylik) ---- */
function briefRow(label,val,sub){
  return`<div class="task"><span><b>${label}</b>${sub?`<small class="mut" style="display:block;font-size:.78rem">${sub}</small>`:''}</span><b style="color:var(--acc)">${val}</b></div>`;
}
function historySection(){
  const td=today();
  // haftalik ozet: bu hafta + gecen hafta
  const wNow=st(mon(td),td),wPrev=st(addD(mon(td),-7),addD(mon(td),-1));
  const wDiff=wNow.p-wPrev.p;
  const wTop=Object.entries(wNow.by).sort((a,b)=>b[1][1]-a[1][1])[0];
  // aylik ozet
  const x=new Date();
  const ma=D(new Date(x.getFullYear(),x.getMonth(),1)),mb=D(new Date(x.getFullYear(),x.getMonth()+1,0));
  const pma=D(new Date(x.getFullYear(),x.getMonth()-1,1)),pmb=D(new Date(x.getFullYear(),x.getMonth(),0));
  const mNow=st(ma,mb),mPrev=st(pma,pmb),mDiff=mNow.p-mPrev.p;
  const weekDone=dd(mon(td),td)+1,monthDone=dd(ma,td)+1;
  return`<div class="card"><div class="row report-heading"><h2>${tr()?'Geçmiş özet':'Past summary'}</h2><button class="g s" onclick="showReportDetail('summary')">${tr()?'Daha fazlası':'More details'} →</button></div>
<div style="margin-top:.6rem"><h3 style="margin:.2rem 0 .4rem">${tr()?'Bu hafta':'This week'} <span class="mut" style="font-size:.8rem">${fmt(mon(td))} – ${fmt(td)}</span></h3>
${briefRow(tr()?'Tamamlanan':'Completed',wNow.d+'/'+wNow.t+' · %'+wNow.p,(tr()?'Geçen hafta':'Last week')+' %'+wPrev.p+' ('+(wDiff>=0?'+':'')+wDiff+')')}
${wTop?briefRow(tr()?'En çok yaptığın':'Most frequent',esc(wTop[0]).slice(0,28),wTop[1][0]+'/'+wTop[1][1]):''}
${briefRow(tr()?'Kayıtlı gün':'Days recorded',weekDone+'/7')}</div>
<div style="margin-top:1.1rem"><h3 style="margin:.2rem 0 .4rem">${tr()?'Bu ay':'This month'} <span class="mut" style="font-size:.8rem">${monthName(x.getMonth())} ${x.getFullYear()}</span></h3>
${briefRow(tr()?'Tamamlanan':'Completed',mNow.d+'/'+mNow.t+' · %'+mNow.p,(tr()?'Geçen ay':'Last month')+' %'+mPrev.p+' ('+(mDiff>=0?'+':'')+mDiff+')')}
${briefRow(tr()?'Kayıtlı gün':'Days recorded',monthDone+'/'+(dd(ma,mb)+1))}</div><div style="margin-top:1.2rem"><div class="row report-heading"><h3>${tr()?'Günlükler':'Daily journals'}</h3><button class="g s" onclick="showReportDetail('journals')">${tr()?'Daha fazlası':'More details'} →</button></div><div class="journal-grid">${Object.entries(A.journal||{}).sort((a,b)=>b[0].localeCompare(a[0])).slice(0,90).map(([k,v])=>`<div class="note-tile"><b>${journalEntryStamp(v)}</b><p>${esc(v.text||'')}</p><button class="g s" onclick="openJournalEntry('${k}')">${tr()?'Aç':'Open'}</button></div>`).join('')||'<p class="mut">'+(tr()?'Henüz günlük yok.':'No journals yet.')+'</p>'}</div></div></div>`;
}
let reportDetail='';
function showReportDetail(key){if(!['summary','journals','answers'].includes(key))return;reportDetail=key;P.rep();window.scrollTo({top:0,behavior:window.matchMedia('(prefers-reduced-motion:reduce)').matches?'instant':'smooth'})}
function reportBack(){reportDetail='';P.rep()}
function reportDetailView(){
  const header=`<div class="card"><div class="row report-heading"><h2>${reportDetail==='summary'?(tr()?'Geçmiş özetler':'Past summaries'):reportDetail==='journals'?(tr()?'Günlük arşivi':'Journal archive'):(tr()?'Yanıt arşivi':'Answer archive')}</h2><button class="g s" onclick="reportBack()">← ${t('back')}</button></div></div>`;
  if(reportDetail==='journals'){
    const entries=Object.entries(A.journal||{}).filter(([k,v])=>/^\d{4}-\d{2}-\d{2}$/.test(k)&&v&&typeof v==='object').sort((a,b)=>b[0].localeCompare(a[0]));
    return header+`<div class="card"><div class="journal-grid">${entries.map(([k,v])=>`<article class="note-tile"><b>${journalEntryStamp(v)}</b><p>${esc(v.text||'')}</p><button class="g s" onclick="openJournalEntry('${k}')">${tr()?'Görüntüle / düzenle':'View / edit'}</button></article>`).join('')||`<p class="mut">${tr()?'Henüz günlük yok.':'No journal entries yet.'}</p>`}</div></div>`;
  }
  if(reportDetail==='answers'){
    const keys=Object.keys(A.qs||{}).filter(k=>/^\d{4}-(\d{2}(-\d{2})?)$/.test(k)).sort().reverse();
    const rows=keys.filter(k=>A.ql&&A.ql[k]).map(k=>{
      const year=Number(k.slice(0,4)),locked=!answerArchiveUnlocked(today(),k),qs=Array.isArray(A.qs[k])?A.qs[k]:[];
      return `<article class="note-tile"><b>${esc(k)} ${locked?'🔒':''}</b>${locked?`<p class="mut">${tr()?`Yanıtlar ${year+1} yılının başında açılır.`:`Answers unlock at the beginning of ${year+1}.`}</p>`:qs.map(q=>`<div><b>${esc(q.q||'')}</b><p>${esc(q.a||'')}</p></div>`).join('')}</article>`;
    });
    return header+`<div class="card"><div class="note-grid">${rows.join('')||`<p class="mut">${tr()?'Henüz kilitli yanıt bulunmuyor.':'No locked answers yet.'}</p>`}</div></div>`;
  }
  const byDay=Object.keys(A.hist||{}).filter(k=>/^\d{4}-\d{2}-\d{2}$/.test(k)&&Array.isArray(A.hist[k])).sort().reverse();
  const groups=new Map();for(const day of byDay){const month=day.slice(0,7);if(!groups.has(month))groups.set(month,[]);groups.get(month).push(day)}
  const cards=[...groups].map(([month,days])=>{
    const lines=days.map(d=>{const it=items(d),done=it.filter(x=>x&&x.done).length;return `<div class="task"><span>${esc(d)} — ${done}/${it.length} ${t('tasksDone')}</span><button class="g s" onclick="openDay('${d}')">${tr()?'İncele':'Review'}</button></div>`}).join('');
    return `<section class="card"><h3>${esc(month)}</h3>${lines}</section>`;
  }).join('');
  return header+`<div class="card"><button class="g s" onclick="showReportDetail('answers')">${tr()?'🔒 Yıl sonu yanıt arşivi':'🔒 Year-end answer archive'}</button><p class="mut">${tr()?'Yanıtlar kilitlendikten sonra yıl bitene kadar gizli kalır.':'Locked answers stay hidden until the year ends.'}</p></div>${cards||`<div class="card"><p class="mut">${tr()?'Henüz geçmiş kayıt yok.':'No past records yet.'}</p></div>`}`;
}
P.rep=()=>{
  if(reportDetail){M(reportDetailView());return}
  const td=today(),wa=mon(td),wb=addD(wa,6),x=new Date();
  const ma=D(new Date(x.getFullYear(),x.getMonth(),1)),mb=D(new Date(x.getFullYear(),x.getMonth()+1,0)),pma=D(new Date(x.getFullYear(),x.getMonth()-1,1)),pmb=D(new Date(x.getFullYear(),x.getMonth(),0));
  const mNext=D(new Date(x.getFullYear(),x.getMonth()+1,1)).slice(0,7);
  M(repCard(t('weeklyReport'),tr()?'hafta':'week',wa,wb,addD(wa,-7),addD(wa,-1),wa,addD(wa,7),defQ('week'))+repCard(t('monthlyReport'),tr()?'ay':'month',ma,mb,pma,pmb,ma.slice(0,7),mNext,defQ('month'))+historySection());
};

let pm={w:25,b:5,ph:'w',left:1500,run:0,end:0,n:0,iv:0,lg:0,sw:0,swT:0,swI:0,swMs:0};
function persistPomodoroState(){
  if(!A)return;
  A.pomo={
    w:pm.w,b:pm.b,ph:pm.ph,
    left:pm.run?Math.max(0,Math.ceil((pm.end-Date.now())/1000)):pm.left,
    run:!!pm.run,end:pm.run?pm.end:0,n:pm.n,lg:pm.lg,updatedAt:Date.now()
  };
  save();
}
function restorePomodoroState(){
  if(pm.iv)clearInterval(pm.iv);
  pm.iv=0;
  const saved=A&&A.pomo;
  const first=(A&&Array.isArray(A.presets)&&A.presets.length)?A.presets[0]:{w:25,b:5};
  const defaultW=Number(first.w)>0&&Number(first.w)<=600?Number(first.w):25;
  const defaultB=Number(first.b)>0&&Number(first.b)<=600?Number(first.b):5;
  if(!saved||typeof saved!=='object'){
    if(A?.stopwatch?.running){clearInterval(pm.swI);pm.swI=setInterval(swRender,40)}
    pm={...pm,w:defaultW,b:defaultB,ph:'w',left:defaultW*60,run:0,end:0,n:0,lg:0,iv:0};
    return;
  }
  const w=Number(saved.w),b=Number(saved.b),left=Number(saved.left),end=Number(saved.end);

// Public publishable key is intended for browsers. Never place secret/service_role here.
const SUPABASE_KEY='sb_publishable_4QTEEc6tSYV2QtNhmeP6Iw_B3sM6dtm';
const SESS_KEY='b1sb', CLOUD_KEY='b1cloud';

function signInWithGoogle(){
  const redirect=location.origin+location.pathname;
  if(!redirect.startsWith('https://')&&!redirect.startsWith('http://localhost')){
    toast(tr()?'Google girişi güvenli HTTPS adresinde kullanılabilir.':'Google sign-in requires HTTPS.');return;
  }
  const url=new URL(SUPABASE_URL+'/auth/v1/authorize');
  url.searchParams.set('provider','google');url.searchParams.set('redirect_to',redirect);
  location.assign(url.toString());
}
async function bootstrapCloudAuth(){
  const frag=new URLSearchParams(location.hash.replace(/^#/,''));
  const at=frag.get('access_token'),rt=frag.get('refresh_token');
  const error=frag.get('error_description')||frag.get('error');
  if(at||error){try{history.replaceState(history.state||{},'',location.pathname+location.search)}catch(_){}}
  if(error){msg=tr()?'Google ile giriş tamamlanamadı. Lütfen tekrar dene.':'Google sign-in failed. Please try again.';view='login';renderAppOrAuth();return}
  if(at&&rt){
    try{
      const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),12000);
      let response;
      try{response=await fetch(SUPABASE_URL+'/auth/v1/user',{headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+at},signal:controller.signal,cache:'no-store'})}
      finally{clearTimeout(timer)}
      if(!response.ok)throw new Error('OAuth verification failed');
      const user=await response.json();if(!user?.id)throw new Error('Invalid OAuth user');
      await activateCloudUser({user,access_token:at,refresh_token:rt});greetThen();return;
    }catch(err){sbClear();msg=tr()?'Google oturumu doğrulanamadı. Lütfen tekrar dene.':'Google session could not be verified.';view='login';renderAppOrAuth();return}
  }
  await restoreCloudOnLoad();
}

const sbSession=()=>{try{return JSON.parse(getItem(SESS_KEY)||'null')}catch(e){return null}};
function sbSave(session){if(session&&session.user&&session.access_token)setItem(SESS_KEY,JSON.stringify(session))}
function sbClear(){setItem(SESS_KEY,'')}
async function sb(path,opt={}){
  const session=sbSession();
  const headers={'apikey':SUPABASE_KEY,'Content-Type':'application/json',...(opt.headers||{})};
  const isLogin=/^\/auth\/v1\/(signup|token|recover|resend)/.test(path);
  if(!isLogin&&session?.access_token)headers['Authorization']='Bearer '+session.access_token;
  const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),12000);
  try{
    const response=await fetch(SUPABASE_URL+path,{method:opt.method||'GET',headers,body:opt.body===undefined?undefined:JSON.stringify(opt.body),signal:controller.signal,cache:'no-store'});
    let data=null;try{data=await response.json()}catch(_){data=null}
    if(!response.ok){const err=new Error(String(data?.msg||data?.message||data?.error_description||data?.error||'HTTP '+response.status));err.status=response.status;err.code=data?.code;throw err}
    return data;
  }finally{clearTimeout(timer)}
}
async function sbSignUp(username,password,nick,email){
  return sb('/auth/v1/signup',{method:'POST',body:{email,password,data:{username,nick}}});
}
async function sbSignIn(_username,password,email){
  return sb('/auth/v1/token?grant_type=password',{method:'POST',body:{email,password}});
}
async function sbRefresh(){
  const session=sbSession();if(!session?.refresh_token)return false;
  try{
    const j=await sb('/auth/v1/token?grant_type=refresh_token',{method:'POST',body:{refresh_token:session.refresh_token}});
    if(!j?.access_token||!j?.user?.id)return false;
    sbSave({...j,at:Date.now()});return true;
  }catch(_){sbClear();return false}
}
async function sbCurrentUser(){
  try{return await sb('/auth/v1/user')}
  catch(e){if(e.status===401&&await sbRefresh())return sb('/auth/v1/user');throw e}
}
async function sbPush(){
  const session=sbSession();
  if(!A?.authUid||!session?.user?.id||A.authUid!==session.user.id)return false;
  const sanitized=JSON.parse(JSON.stringify(A));sanitized.pw='';delete sanitized.salt;
  try{
    await sb('/rest/v1/rpc/iydu_save',{method:'POST',body:{p_username:A.u,p_nick:A.nick||A.u,p_data:sanitized}});return true;
  }catch(e){
    if(e.status===401&&await sbRefresh()){
      const current=sbSession();if(current?.user?.id!==A.authUid)return false;
      try{await sb('/rest/v1/rpc/iydu_save',{method:'POST',body:{p_username:A.u,p_nick:A.nick||A.u,p_data:sanitized}});return true}catch(_){return false}
    }
    return false;
  }
}
async function sbPull(){
  const session=sbSession();if(!session?.user?.id)throw new Error('Not authenticated');
  let rows;
  try{rows=await sb('/rest/v1/rpc/iydu_load',{method:'POST',body:{p_username:''}})}
  catch(e){if(e.status===401&&await sbRefresh())rows=await sb('/rest/v1/rpc/iydu_load',{method:'POST',body:{p_username:''}});else throw e}
  const row=Array.isArray(rows)?rows[0]:rows;
  if(row?.data&&(!row.data||typeof row.data!=='object'||Array.isArray(row.data)))throw new Error('Invalid cloud data');
  return row?.data||null;
}
async function restoreCloudOnLoad(){
  if(!sbSession()?.access_token){if(sbSession()?.refresh_token&&!await sbRefresh())return;else if(!sbSession()?.access_token)return}
  try{
    const user=await sbCurrentUser();
    if(!user?.id)return;
    const session=sbSession();if(!session)return;
    sbSave({...session,user});
    const remote=await sbPull();
    const local=Object.values(DB.accounts).find(a=>a.authUid===user.id);
    const meta=user.user_metadata||{};
    const a=norm(remote||local||{u:meta.username||user.email?.split('@')[0]||'user',nick:meta.nick||meta.username||'User'});
    a.authUid=user.id;a.email=user.email||a.email;a.mail=a.email;a.pw='';delete a.salt;
    DB.accounts[a.u]=a;DB.lastUser=a.u;DB.last=a.nick;A=a;
    view='app';pg='home';restorePomodoroState();applyTheme();save();renderAppOrAuth();
    if(!remote)await sbPush();
  }catch(e){
    // Do not auto-login from unverified localStorage contents.
    if(e.status===401)sbClear();
    if(!A){view='login';renderAppOrAuth()}
  }
}

function th(t){setTheme(t)}
