  if(v13HasMigrationMarker()){
    v13ClearMigration();sbClear();
    msg=tr()?'Google aktarımı yarıda kesildi. Eski profilin korunuyor. Yeniden denemeden önce bulut hesabının durumunu kontrol et.':'Google migration was interrupted. Your legacy profile remains intact. Check your cloud account before trying again.';
    view='login';renderAppOrAuth();return;
  }
  // An existing session is a candidate for Continue, never an automatic entry.
  return;
}

const sbSession=()=>{try{return JSON.parse(getItem(SESS_KEY)||'null')}catch(e){return null}};
function sbSave(session){if(session&&session.user&&session.access_token)setItem(SESS_KEY,JSON.stringify(session))}
function sbClear(){setItem(SESS_KEY,'');syncStop()}
async function sb(path,opt={}){
  const session=sbSession();
  const headers={'apikey':SUPABASE_KEY,'Content-Type':'application/json',...(opt.headers||{})};
  const isLogin=/^\/auth\/v1\/(signup|token|recover|resend|verify)/.test(path);
  if(!isLogin&&session?.access_token)headers['Authorization']='Bearer '+session.access_token;
  const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),12000);
  try{
    const response=await fetch(SUPABASE_URL+path,{method:opt.method||'GET',headers,body:opt.body===undefined?undefined:JSON.stringify(opt.body),signal:controller.signal,cache:'no-store'});
    let data=null;try{data=await response.json()}catch(_){data=null}
    if(!response.ok){const err=new Error(String(data?.msg||data?.message||data?.error_description||data?.error||'HTTP '+response.status));err.status=response.status;err.code=data?.code;throw err}
    return data;
  }finally{clearTimeout(timer)}
}
async function sbSignUp(username,password,nick,email){
  return sb('/auth/v1/signup?redirect_to='+encodeURIComponent('https://badgalnurkan.com/'),{method:'POST',body:{email,password,data:{username,nick}}});
}
async function sbSignIn(_username,password,email){
  return sb('/auth/v1/token?grant_type=password',{method:'POST',body:{email,password}});
}
async function sbRefresh(){
  const session=sbSession();if(!session?.refresh_token)return false;
  try{
    const j=await sb('/auth/v1/token?grant_type=refresh_token',{method:'POST',body:{refresh_token:session.refresh_token}});
    if(!j?.access_token||!j?.user?.id)return false;
    sbSave({...j,at:Date.now()});return true;
  }catch(_){sbClear();return false}
}
async function sbCurrentUser(){
  try{return await sb('/auth/v1/user')}
  catch(e){if(e.status===401&&await sbRefresh())return sb('/auth/v1/user');throw e}
}
async function sbPush(){
  const uid=A?.authUid;
  if(!uid||sbSession()?.user?.id!==uid||!activeSync)return false;
  return activeSync.flush();
}
async function sbPull(){
  const session=sbSession();if(!session?.user?.id)throw new Error('Not authenticated');
  let rows;
  try{rows=await sb('/rest/v1/rpc/iydu_load',{method:'POST',body:{p_username:''}})}
  catch(e){if(e.status===401&&await sbRefresh())rows=await sb('/rest/v1/rpc/iydu_load',{method:'POST',body:{p_username:''}});else throw e}
  const row=Array.isArray(rows)?rows[0]:rows;
  if(row?.data&&(!row.data||typeof row.data!=='object'||Array.isArray(row.data)))throw new Error('Invalid cloud data');
  return row?.data&&Object.keys(row.data).length?row.data:null;
}

// === Durable, account-scoped cross-device synchronization ===
function syncAccountSnapshot(account){
  const value=JSON.parse(JSON.stringify(account));
  value.pw='';delete value.salt;
  return value;
}
function syncTabId(){
  const key='iydu.sync.tab.v2';
  let id=sessionStorage.getItem(key);
  if(!id){
    if(!globalThis.crypto?.randomUUID)throw Error('SYNC_SECURE_ID_UNAVAILABLE');
    id=crypto.randomUUID();
    sessionStorage.setItem(key,id);
  }
  return id;
}
function syncStop(){
  syncGeneration++;
  clearTimeout(pushT);pushT=null;
  clearInterval(syncTimer);syncTimer=0;
  activeSync=null;syncStatus='idle';syncLegacyBackup=false;
}
function syncStart(uid,remote){
  syncStop();
  const persistent=store();
  if(!persistent||!window.IYSync)throw Error('SYNC_DURABLE_STORAGE_REQUIRED');
  const generation=++syncGeneration;
  const engine=IYSync.create({
    uid,tabId:syncTabId(),storage:persistent,
    load:async()=>await sbPull()||{},
    cas:async(expected,next)=>{
      try{
        return await sb('/rest/v1/rpc/iydu_save_cas',{method:'POST',
          body:{p_expected_data:expected,p_data:next}});
      }catch(e){
        if(e.status===401&&await sbRefresh()&&sbSession()?.user?.id===uid)
          return sb('/rest/v1/rpc/iydu_save_cas',{method:'POST',
            body:{p_expected_data:expected,p_data:next}});
        throw e;
      }
    },
    onRemote:value=>syncReceiveRemote(uid,value),
    onStatus:status=>{
      if(generation!==syncGeneration)return;
      syncStatus=status;syncNotice();
    }
  });
  activeSync=engine;
  const pending=engine.initialize(remote);
  syncStatus=engine.getStatus();
  syncTimer=setInterval(syncCheck,12000);
  return pending;
}
function syncEditing(){
  const el=document.activeElement;
  return !!(el&&el.closest?.('#app,[role="dialog"]')&&
    (el.matches?.('input:not([type="hidden"]),textarea,select')||el.isContentEditable));
}
function syncReceiveRemote(uid,remote){
  if(A?.authUid!==uid||sbSession()?.user?.id!==uid||syncEditing())return false;
  if(IYSync.equal(syncAccountSnapshot(A),remote))return true;
  const next=norm(JSON.parse(JSON.stringify(remote)));
  const previous=A, oldName=previous.u;
  const newName=String(remote.u||oldName);
  if(newName!==oldName&&DB.accounts[newName]&&DB.accounts[newName].authUid!==uid)return false;
  next.u=newName;next.authUid=uid;next.accountOrigin='cloud';
  next.email=previous.email;next.mail=previous.mail;next.pw='';
  next.loginMethod=previous.loginMethod;next.googleConnected=previous.googleConnected;
  if(previous.progressPolicy&&!next.progressPolicy)next.progressPolicy=previous.progressPolicy;
  const updated={...DB,accounts:{...DB.accounts}};
  if(newName!==oldName)delete updated.accounts[oldName];
  updated.accounts[newName]=next;updated.lastUser=newName;updated.last=next.nick||newName;
  updated.savedAt=Date.now();
  if(!setItem(LSK,JSON.stringify(updated))){syncStatus='unsafe';syncNotice();return false}
  DB=updated;A=next;
  restorePomodoroState();applyTheme();
  if(view==='app')shell();
  return true;
}
async function syncCheck(){
  if(!activeSync||!A?.authUid||sbSession()?.user?.id!==A.authUid||
     document.hidden||syncEditing())return;
  try{await activeSync.refresh()}catch(_){syncStatus='offline';syncNotice()}
}
window.addEventListener('online',syncCheck);
window.addEventListener('focus',syncCheck);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)syncCheck()});
function syncArchiveLegacy(uid,local,remote){
  const snapshot=syncAccountSnapshot(local);
  if(IYSync.equal(snapshot,remote))return;
  const key='iydu.sync.legacy.v2.'+uid;
  const db=store();
  if(!db)throw Error('SYNC_LEGACY_ARCHIVE_UNAVAILABLE');
  if(!db.getItem(key)){
    const raw=JSON.stringify({uid,at:Date.now(),account:snapshot});
    db.setItem(key,raw);
    if(db.getItem(key)!==raw)throw Error('SYNC_LEGACY_ARCHIVE_UNAVAILABLE');
  }
  syncLegacyBackup=true;
}
function syncDownloadDraft(){
  if(!A?.authUid)return;
  let draft=null;
  try{draft=activeSync?.pending()?.local||syncAccountSnapshot(A)}catch(_){return}
  const issue=activeSync?.conflict();
  const record={format:'iydu-sync-recovery-v2',at:new Date().toISOString(),
    uid:A.authUid,local:draft,remote:issue?.remote||null};
  const url=URL.createObjectURL(new Blob([JSON.stringify(record,null,2)],{type:'application/json'}));
  const link=document.createElement('a');
  link.href=url;link.download='iydu-yerel-kurtarma-'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(link);link.click();link.remove();
  setTimeout(()=>URL.revokeObjectURL(url),60000);
}
function syncDownloadOrphans(){
  const uid=A?.authUid,other=activeSync?.orphaned();
  if(!uid||!other?.length)return;
  const bundle={format:'iydu-orphan-drafts-v2',uid,exportedAt:new Date().toISOString(),
    preservedDrafts:other};
  const url=URL.createObjectURL(new Blob([JSON.stringify(bundle,null,2)],{type:'application/json'}));
  const link=document.createElement('a');
  link.href=url;link.download='iydu-kaydedilmemis-eski-sekmeler-'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(link);link.click();link.remove();
  setTimeout(()=>URL.revokeObjectURL(url),60000);
}
function syncDownloadLegacy(){
  const uid=A?.authUid;if(!uid)return;
  const item=store()?.getItem('iydu.sync.legacy.v2.'+uid);
  if(!item)return;
  const url=URL.createObjectURL(new Blob([item],{type:'application/json'}));
  const link=document.createElement('a');
  link.href=url;link.download='iydu-onceki-kayit-'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(link);link.click();link.remove();
  setTimeout(()=>URL.revokeObjectURL(url),60000);
}
function syncOpenConflict(){
  const issue=activeSync?.conflict();
  if(!issue){syncWarn();return}
  const paths=issue.paths.slice(0,8).map(p=>'<li>'+esc(p)+'</li>').join('');
  openModal('sync-conflict-dialog',
    '<h2>'+(tr()?'Eşitleme çakışması':'Sync conflict')+'</h2>'+
    '<p>'+(tr()?'İki cihaz aynı kaydı değiştirdi. Hiçbir sürümü silmedik.':
    'Both devices changed the same entry. Neither version was discarded.')+'</p>'+
    '<ul>'+paths+'</ul><div class="row">'+
    '<button onclick="syncDownloadDraft()">'+(tr()?'Yerel ve bulut kopyasını indir':'Download both copies')+'</button>'+
    '<button class="g" onclick="syncUseCloudVersion()">'+
      (tr()?'Yerel kopyayı arşivle ve bulutu aç':'Archive local and use cloud')+'</button>'+
    '<button class="g" onclick="closeModal(\'sync-conflict-dialog\')">'+t('cancel')+'</button></div>');
}
async function syncUseCloudVersion(){
  if(!activeSync)return;
  try{
    await activeSync.resolveWithRemote();
    closeModal('sync-conflict-dialog');
    toast(tr()?'Yerel sürüm kurtarma arşivine alındı.':'Local version archived for recovery.');
  }catch(_){syncWarn()}
}
function syncNotice(){
  const root=document.querySelector('.shell main');
  if(!root)return;
  root.querySelector('#iydu-sync-notice')?.remove();
  if(!A?.authUid)return;
  if(syncStatus==='synced'&&!syncLegacyBackup)return;
  const card=document.createElement('section');card.id='iydu-sync-notice';
  card.className='card';card.setAttribute('role','status');
  const title=document.createElement('strong');
  const text=document.createElement('p');
  title.textContent=syncStatus==='conflict'?(tr()?'Eşitleme çakışması':'Sync conflict'):
    syncStatus==='offline'?(tr()?'Çevrimdışı kayıt':'Offline copy'):
    syncStatus==='unsafe'?(tr()?'Kaydetme güvenliği uyarısı':'Save safety warning'):
    syncStatus==='remote-pending'?(tr()?'Başka cihazdaki değişiklik hazır':'Other-device changes available'):
    syncStatus==='other-pending'?(tr()?'Önceki sekmelerde kaydedilmemiş veri var':'Unsent drafts from other tabs'):
    syncStatus==='synced'?(tr()?'Eski cihaz kaydı korunuyor':'Old device backup preserved'):
    (tr()?'Eşitleme bekleniyor':'Sync pending');
  text.textContent=tr()?'Yerel kayıtlarını silme. Bulut kaydı doğrulanana kadar bu cihazdaki değişiklikler korunur.':
    'Do not clear browser storage. Changes stay on this device until cloud confirmation.';
  card.append(title,text);
  if(syncStatus==='conflict'){
    const btn=document.createElement('button');btn.type='button';
    btn.textContent=tr()?'Sürümleri incele':'Review versions';
    btn.addEventListener('click',syncOpenConflict);card.append(btn);
  }else if(syncStatus==='other-pending'){
    const btn=document.createElement('button');btn.type='button';
    btn.textContent=tr()?'Eski sekme taslaklarını indir':'Download previous tab drafts';
    btn.addEventListener('click',syncDownloadOrphans);card.append(btn);
  }else if(syncStatus!=='synced'){
    const btn=document.createElement('button');btn.type='button';
    btn.textContent=tr()?'Şimdi eşitle':'Sync now';
    btn.addEventListener('click',()=>{syncCheck();sbPush()});
    card.append(btn);
  }
  if(syncLegacyBackup){
    const btn=document.createElement('button');btn.type='button';
    btn.className='g';btn.textContent=tr()?'Eski cihaz kaydını indir':'Download old device backup';
    btn.addEventListener('click',syncDownloadLegacy);card.append(btn);
  }
  root.prepend(card);
}
// The database owns the old/new-user cutoff; do not infer it from a missing
// browser cache or an absent profile row.
async function sbProgressPolicy(expectedUid){
  if(!expectedUid||sbSession()?.user?.id!==expectedUid)return null;
  try{
    const mode=await sb('/rest/v1/rpc/iydu_progress_policy',{method:'POST',body:{}});
    if(sbSession()?.user?.id!==expectedUid)return null;
    return mode==='active-days'?'activity-7d-v1':mode==='daily'?'daily':null;
  }catch(_){return null}
}
function applyServerProgressPolicy(account,mode){
  if(!account||typeof account!=='object')return;
  if(mode==='activity-7d-v1')account.progressPolicy='activity-7d-v1';
  else if(mode==='daily')delete account.progressPolicy;
}
async function sbGoogleQuickResumeAllowed(){
 try{const result=await sb('/rest/v1/rpc/iydu_quick_resume_status',{method:'POST',body:{}});return result?.allowed===true}catch(_){return false}
}
async function restoreCloudOnLoad(expectedUid='',requireRecentGoogle=false,animateEntry=false){
  if(!sbSession()?.access_token){
    if(sbSession()?.refresh_token&&!await sbRefresh())return false;
    if(!sbSession()?.access_token)return false;
  }
  try{
    const user=await sbCurrentUser();
    if(!user?.id||(expectedUid&&user.id!==expectedUid))return false;
    const session=sbSession();if(!session)return false;
    sbSave({...session,user});
    if(requireRecentGoogle&&!await sbGoogleQuickResumeAllowed())return false;
    // A closed account must remain on its reactivation gate, not fall through
    // to a redundant Google OAuth dialog on remembered Continue.
    if(window.IYAccount&&!await IYAccount.checkAccess(user))return true;
    // All entry paths, including remembered Google Continue and reload,
    // MUST initialize the same UID-scoped CAS baseline before rendering.
    const account=await activateCloudUser({...session,user},'',
      user.app_metadata?.providers?.includes('google')?'google':'password',
      {requireRecentGoogle});
    if(!account)return !!window.IYBrowserGate?.isPending();
    if(animateEntry)playWelcomeTransition();
    return true;
  }catch(e){
    if(e.status===401)sbClear();
    if(e.message==='V13_LOCAL_USERNAME_COLLISION'){
      sbClear();msg=tr()?'Bulut kullanıcı adı bu cihazdaki eski yerel hesapla çakışıyor. Eski veri korunuyor.':'Cloud username conflicts with a legacy profile on this device.';
    }else if(e.message==='SYNC_DURABLE_STORAGE_REQUIRED'||e.message==='LOCAL_SYNC_STORAGE_UNAVAILABLE'){
      msg=tr()?'Bu tarayıcıda güvenilir kayıt alanı yok. Verilerini korumak için site verilerini silmeden normal bir tarayıcı sekmesi kullan.':
        'This browser cannot persist data safely. Do not clear site data; use a normal browser tab.';
    }
    if(!A&&!expectedUid){view='login';renderAppOrAuth()}
    return false;
  }
}
