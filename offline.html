<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Improvin’ Your Day · Çevrimdışı</title>
<style>:root{color-scheme:light dark;font:100%/1.55 system-ui,sans-serif}body{margin:0}main{max-width:28rem;margin:8vh auto;padding:1.25rem}h1{font:600 1.8rem/1.2 Georgia,serif}fieldset{border:0;padding:0;display:grid;gap:.45rem}label{font-weight:600}input,select,textarea,button{box-sizing:border-box;width:100%;padding:.65rem;font:inherit;border:1px solid #8888;border-radius:.65rem}textarea{min-height:6rem;resize:vertical}button{cursor:pointer;margin-top:.6rem}a{color:inherit}</style></head>
<body><main><small>Improvin’ Your Day</small><h1 data-en="Offline entries">Çevrimdışı kayıtlar</h1><p data-en="Tasks and notes are kept on this device until your account reconnects.">Görev ve notların hesabın yeniden bağlanana kadar bu cihazda saklanır.</p>
<form id="offline-entry"><fieldset><label for="kind" data-en="Entry">Kayıt türü</label><select name="kind" id="kind"><option value="task" data-en="Task">Görev</option><option value="note" data-en="Note for a date">Tarihe not</option></select><label for="day" data-en="Date">Tarih</label><input type="date" id="day" name="day" required><label for="offline-body" data-en="Text">Metin</label><textarea name="body" id="offline-body" maxlength="120" required></textarea><button data-en="Save on this device">Bu cihazda sakla</button></fieldset></form><p role="status" id="pad-status"></p><a href="/" data-en="Return to the app">Uygulamaya dön</a></main><script src="/offline-pad.js" defer></script><script src="/growing-text.js" defer></script></body></html>
